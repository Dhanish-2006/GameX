<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameX - Tic-Tac-Toe</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
    background:radial-gradient(circle at center,#312e81,#08080d 65%);
    color:white;
    padding:20px;
}

.game-container{
    width:100%;
    max-width:550px;
    text-align:center;
}

/* BACK */

.back-btn{
    display:inline-block;
    margin-bottom:18px;
    padding:10px 18px;
    border-radius:8px;
    background:#171720;
    border:1px solid #30303c;
    color:white;
    text-decoration:none;
    font-size:14px;
}

.back-btn:hover{
    border-color:#8b5cf6;
}

/* TITLE */

h1{
    font-size:42px;
    margin-bottom:8px;
    background:linear-gradient(90deg,#8b5cf6,#ec4899);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    color:#9999a5;
    margin-bottom:20px;
}

/* MODE SELECTOR */

.mode-selector{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.mode-btn{
    padding:12px 20px;
    border-radius:10px;
    background:#171720;
    border:1px solid #343442;
    color:#bcbcca;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.mode-btn:hover{
    border-color:#8b5cf6;
    transform:translateY(-2px);
}

.mode-btn.active{
    background:linear-gradient(90deg,#7c3aed,#db2777);
    color:white;
    border-color:transparent;
    box-shadow:0 5px 20px rgba(124,58,237,.3);
}

/* STATUS */

.status{
    min-height:30px;
    margin-bottom:18px;
    font-size:18px;
    font-weight:bold;
    color:#a78bfa;
}

/* BOARD */

.board{
    width:min(90vw,390px);
    aspect-ratio:1 / 1;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:10px;
    background:#111119;
    border:2px solid #7c3aed;
    border-radius:15px;
    box-shadow:0 0 35px rgba(124,58,237,.25);
    position:relative;
    z-index:10;
    pointer-events:auto;
}

/* CELLS */

.cell{
    border:none;
    border-radius:10px;
    background:#1a1a24;
    color:white;
    font-size:clamp(45px,12vw,75px);
    font-weight:900;
    cursor:pointer;
    transition:.2s;
    position:relative;
    z-index:20;
    pointer-events:auto;
    touch-action:manipulation;
}

.cell:hover{
    background:#252532;
    transform:scale(.97);
}

.cell.x{
    color:#a78bfa;
}

.cell.o{
    color:#ec4899;
}

.cell.winner{
    background:linear-gradient(135deg,#7c3aed,#db2777);
    color:white;
}

/* RESTART */

.restart-btn{
    margin-top:22px;
    padding:13px 28px;
    border:none;
    border-radius:9px;
    background:linear-gradient(90deg,#7c3aed,#db2777);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.restart-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(124,58,237,.3);
}

/* SCORE */

.score-board{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:20px;
    color:#aaaab5;
    font-size:14px;
    flex-wrap:wrap;
}

.score-board span{
    color:white;
    font-weight:bold;
}

/* PLAYER INDICATOR */

.players{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:15px;
    font-size:13px;
    color:#888895;
}

.player-x{
    color:#a78bfa;
    font-weight:bold;
}

.player-o{
    color:#ec4899;
    font-weight:bold;
}

/* RESPONSIVE */

@media(max-width:600px){

    body{
        padding:10px;
    }

    h1{
        font-size:34px;
    }

    .mode-btn{
        padding:10px 14px;
        font-size:13px;
    }

    .score-board{
        gap:18px;
    }

}

</style>

</head>


<body>

<div class="game-container">

    <!-- BACK -->
    <a href="../index.html" class="back-btn">← Back to GameX</a>

    <!-- TITLE -->
    <h1>❌ Tic-Tac-Toe ⭕</h1>

    <p class="subtitle">Choose your game mode</p>

    <!-- MODE BUTTONS -->
    <div class="mode-selector">
        <button class="mode-btn active" id="humanBtn">👥 Human vs Human</button>
        <button class="mode-btn" id="aiBtn">🤖 Human vs AI</button>
    </div>

    <!-- PLAYER NAMES -->
    <div class="players">
        <div>
            <span class="player-x">X</span> =
            <span id="playerXName">Player 1</span>
        </div>
        <div>
            <span class="player-o">O</span> =
            <span id="playerOName">Player 2</span>
        </div>
    </div>

    <!-- STATUS -->
    <div class="status" id="status">Player 1's turn — X</div>

    <!-- BOARD (9 cells) -->
    <div class="board" id="board">
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
    </div>

    <!-- RESTART -->
    <button class="restart-btn" id="restartBtn">🔄 New Game</button>

    <!-- SCORE -->
    <div class="score-board">
        <div>X: <span id="xScore">0</span></div>
        <div>O: <span id="oScore">0</span></div>
        <div>Draws: <span id="drawScore">0</span></div>
    </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const cells = document.querySelectorAll(".cell");
const statusEl = document.getElementById("status");
const restartBtn = document.getElementById("restartBtn");
const humanBtn = document.getElementById("humanBtn");
const aiBtn = document.getElementById("aiBtn");
const playerXName = document.getElementById("playerXName");
const playerOName = document.getElementById("playerOName");
const xScoreElement = document.getElementById("xScore");
const oScoreElement = document.getElementById("oScore");
const drawScoreElement = document.getElementById("drawScore");
const boardElement = document.getElementById("board");


/* =====================================================
   GAME VARIABLES
===================================================== */

/* FIX: the board now has 9 entries (indexes 0-8) */
let board = Array(9).fill("");

let currentPlayer = "X";
let gameOver = false;
let mode = "human";

/* SCORES */
let xScore = 0;
let oScore = 0;
let drawScore = 0;


/* =====================================================
   WINNING COMBINATIONS
===================================================== */

const winningCombinations = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];


/* =====================================================
   CELL CLICK
===================================================== */

boardElement.addEventListener("click", (event) => {

    const cell = event.target.closest(".cell");

    if (!cell || !boardElement.contains(cell)) {
        return;
    }

    const index = Array.from(cells).indexOf(cell);

    if (index !== -1) {
        handleMove(index);
    }

});


/* =====================================================
   HANDLE MOVE
===================================================== */

function handleMove(index) {

    /* Cell already occupied */
    if (board[index] !== "") {
        return;
    }

    /* Game already finished */
    if (gameOver) {
        return;
    }

    /* AI's turn */
    if (mode === "ai" && currentPlayer === "O") {
        return;
    }

    /* Make move */
    board[index] = currentPlayer;

    updateBoard();

    /* Check result */
    const result = checkWinner();

    if (result) {
        finishGame(result);
        return;
    }

    /* Switch player */
    switchPlayer();

    /* AI */
    if (mode === "ai" && currentPlayer === "O") {

        statusEl.textContent = "🤖 AI is thinking...";

        setTimeout(computerMove, 500);

    }

}


/* =====================================================
   SWITCH PLAYER
===================================================== */

function switchPlayer() {

    currentPlayer = currentPlayer === "X" ? "O" : "X";

    updateStatus();

}


/* =====================================================
   UPDATE STATUS
===================================================== */

function updateStatus() {

    if (mode === "human") {

        statusEl.textContent =
            currentPlayer === "X"
                ? "Player 1's turn — X"
                : "Player 2's turn — O";

    } else {

        statusEl.textContent =
            currentPlayer === "X"
                ? "Your turn — X"
                : "🤖 AI's turn — O";

    }

}


/* =====================================================
   COMPUTER AI
===================================================== */

function computerMove() {

    if (gameOver || mode !== "ai" || currentPlayer !== "O") {
        return;
    }

    const move = getBestMove();

    if (move === -1) {
        return;
    }

    board[move] = "O";

    updateBoard();

    const result = checkWinner();

    if (result) {
        finishGame(result);
        return;
    }

    currentPlayer = "X";

    updateStatus();

}


/* =====================================================
   AI - MINIMAX
===================================================== */

function getBestMove() {

    let bestScore = -Infinity;
    let bestMove = -1;

    for (let i = 0; i < board.length; i++) {

        if (board[i] === "") {

            board[i] = "O";

            const score = minimax(board, 0, false);

            board[i] = "";

            if (score > bestScore) {
                bestScore = score;
                bestMove = i;
            }

        }

    }

    return bestMove;

}


function minimax(position, depth, isMaximizing) {

    const result = checkWinnerForBoard(position);

    if (result) {

        if (result.winner === "O") {
            return 10 - depth;
        }

        if (result.winner === "X") {
            return depth - 10;
        }

        return 0;

    }

    if (isMaximizing) {

        let bestScore = -Infinity;

        for (let i = 0; i < position.length; i++) {

            if (position[i] === "") {

                position[i] = "O";

                const score = minimax(position, depth + 1, false);

                position[i] = "";

                bestScore = Math.max(bestScore, score);

            }

        }

        return bestScore;

    } else {

        let bestScore = Infinity;

        for (let i = 0; i < position.length; i++) {

            if (position[i] === "") {

                position[i] = "X";

                const score = minimax(position, depth + 1, true);

                position[i] = "";

                bestScore = Math.min(bestScore, score);

            }

        }

        return bestScore;

    }

}


/* =====================================================
   CHECK WINNER
===================================================== */

function checkWinner() {

    return checkWinnerForBoard(board);

}


function checkWinnerForBoard(currentBoard) {

    for (const combination of winningCombinations) {

        const [a, b, c] = combination;

        if (
            currentBoard[a] &&
            currentBoard[a] === currentBoard[b] &&
            currentBoard[a] === currentBoard[c]
        ) {

            return {
                winner: currentBoard[a],
                combination: combination
            };

        }

    }

    /* DRAW */
    if (currentBoard.every(cell => cell !== "")) {

        return {
            winner: "draw"
        };

    }

    return null;

}


/* =====================================================
   FINISH GAME
===================================================== */

function finishGame(result) {

    gameOver = true;

    if (result.winner === "X") {

        xScore++;
        xScoreElement.textContent = xScore;

        statusEl.textContent =
            mode === "human" ? "🎉 Player 1 wins!" : "🎉 You win!";

    } else if (result.winner === "O") {

        oScore++;
        oScoreElement.textContent = oScore;

        statusEl.textContent =
            mode === "human" ? "🎉 Player 2 wins!" : "🤖 AI wins!";

    } else {

        drawScore++;
        drawScoreElement.textContent = drawScore;

        statusEl.textContent = "🤝 It's a Draw!";

    }

    /* Highlight winning cells */
    if (result.combination) {

        result.combination.forEach(index => {
            cells[index].classList.add("winner");
        });

    }

}


/* =====================================================
   UPDATE BOARD
===================================================== */

function updateBoard() {

    cells.forEach((cell, index) => {

        cell.textContent = board[index];

        cell.classList.remove("x", "o");

        if (board[index] === "X") {
            cell.classList.add("x");
        }

        if (board[index] === "O") {
            cell.classList.add("o");
        }

    });

}


/* =====================================================
   RESET GAME
===================================================== */

function restartGame() {

    /* FIX: reset to 9 entries as well */
    board = Array(9).fill("");

    currentPlayer = "X";
    gameOver = false;

    cells.forEach(cell => {

        cell.textContent = "";

        cell.classList.remove("x", "o", "winner");

    });

    updateStatus();

    /* AI mode always starts with the player */

}


/* =====================================================
   CHANGE MODE
===================================================== */

function setMode(selectedMode) {

    mode = selectedMode;

    if (mode === "human") {

        humanBtn.classList.add("active");
        aiBtn.classList.remove("active");

        playerXName.textContent = "Player 1";
        playerOName.textContent = "Player 2";

    } else {

        aiBtn.classList.add("active");
        humanBtn.classList.remove("active");

        playerXName.textContent = "You";
        playerOName.textContent = "AI";

    }

    restartGame();

}


/* =====================================================
   BUTTONS
===================================================== */

humanBtn.addEventListener("click", () => setMode("human"));

aiBtn.addEventListener("click", () => setMode("ai"));

restartBtn.addEventListener("click", restartGame);


/* =====================================================
   INITIALIZE
===================================================== */

setMode("human");

</script>

</body>
</html>
