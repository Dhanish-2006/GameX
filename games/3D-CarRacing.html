<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Highway Rush - 3D Racing</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fg:#fff;--mut:#9aa4b2}
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font-family:system-ui,Arial,sans-serif;color:var(--fg);touch-action:none;user-select:none}
#game{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none;z-index:5}
.box{background:rgba(8,12,22,.55);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 14px;backdrop-filter:blur(6px);font-size:12px;color:var(--mut)}
.box b{display:block;font-size:20px;color:var(--fg)}#spd{font-size:32px!important}
#lv{color:#ff4d6d;letter-spacing:2px;font-size:18px}
.bar{height:6px;width:110px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:6px;overflow:hidden}
#nf{height:100%;width:50%;background:linear-gradient(90deg,#35d0ff,#7a5cff)}
#pop{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:26px;font-weight:800;color:#ffd24d;text-shadow:0 0 14px #ff8a00;opacity:0;transition:opacity .25s;z-index:6;pointer-events:none}
#flash{position:fixed;inset:0;background:#f23;opacity:0;pointer-events:none;transition:opacity .4s;z-index:4}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,5,12,.72);z-index:10}
.mb{width:340px;max-width:90%;padding:26px;background:rgba(14,18,30,.96);border:1px solid rgba(255,255,255,.15);border-radius:18px;text-align:center}
.mb h1{margin:0 0 8px;font-size:30px}.mb p{color:var(--mut);font-size:13px;line-height:1.6;margin:0 0 14px}
.d{display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#06121c}
.d small{display:block;font-weight:500;font-size:11px;opacity:.75}
.tc{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;display:none;justify-content:space-between;padding:0 16px;z-index:6;pointer-events:none}
.tc>div{display:flex;gap:12px}.tc i{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px}
.tc i:active{background:rgba(255,255,255,.3)}
@media(pointer:coarse){.tc{display:flex}}
</style></head><body>
<div id="game"></div><div id="flash"></div><div id="pop"></div>
<div class="hud"><div class="box">SCORE<b id="sc">0</b>BEST <span id="bs">0</span></div>
<div class="box" style="text-align:center">KM/H<b id="spd">0</b><div id="lv"></div></div>
<div class="box">NITRO<div class="bar"><div id="nf"></div></div><div id="dn" style="margin-top:6px"></div></div></div>
<div class="tc"><div><i id="bl">◀</i><i id="br">▶</i></div><div><i id="bb">⏹</i><i id="bn">⚡</i></div></div>
<div id="menu"><div class="mb"><h1 id="mt">HIGHWAY RUSH</h1><p id="mp">Weave through traffic as day turns to night. Near misses fill your nitro. Trucks, erratic drivers and roadworks get worse as you go faster.</p>
<button class="d" style="background:#4cd964" data-d="0">EASY<small>3 lives · lighter traffic</small></button>
<button class="d" style="background:#ffd24d" data-d="1">NORMAL<small>2 lives · lane-changers, roadworks</small></button>
<button class="d" style="background:#ff4d6d" data-d="2">HARD<small>1 life · dense, fast, aggressive</small></button>
<p style="margin:12px 0 0;font-size:12px">A/D or ←/→ steer · S/↓ brake · Space nitro</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){"use strict";
const $=id=>document.getElementById(id),R=Math.random;
const D=[{n:'EASY',lives:3,base:32,max:58,sp:1.5,er:0,cn:0},{n:'NORMAL',lives:2,base:38,max:72,sp:1.1,er:.18,cn:.1},{n:'HARD',lives:1,base:46,max:88,sp:.8,er:.35,cn:.2}];
const LX=[-4.5,-1.5,1.5,4.5];
let diff=1,running=false,v=12,dist=0,bonus=0,lives=3,nitro=50,invul=0,shake=0,px=0,sv=0,tm=0,spT=0,best=0;
try{best=+localStorage.getItem('hwRushBest')||0}catch(e){}
$('bs').textContent=best;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,700);
scene.background=new THREE.Color(0x8ec9f0);scene.fog=new THREE.Fog(0x8ec9f0,40,380);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;
$('game').appendChild(ren.domElement);
const hemi=new THREE.HemisphereLight(0xffffff,0x334422,1),sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(-30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-25,right:25,top:40,bottom:-40,near:1,far:150});
sun.target.position.set(0,0,-5);scene.add(hemi,sun,sun.target);
function tex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c},o||{})),B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
// road
const roadT=tex(256,512,(g,w,h)=>{g.fillStyle='#2a2b30';g.fillRect(0,0,w,h);for(let i=0;i<6000;i++){g.fillStyle=R()<.5?'#34353b':'#212227';g.fillRect(R()*w,R()*h,2,2)}
g.fillStyle='#e8e8e8';g.fillRect(8,0,6,h);g.fillRect(w-14,0,6,h);[64,128,192].forEach(x=>g.fillRect(x-3,0,6,h*.35))});
roadT.repeat.set(1,50);
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,600),new THREE.MeshStandardMaterial({map:roadT,roughness:.85}));
road.rotation.x=-Math.PI/2;road.position.z=-280;road.receiveShadow=true;scene.add(road);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(700,700),M(0x2f5d2c,{roughness:1}));gr.rotation.x=-Math.PI/2;gr.position.set(0,-.05,-280);gr.receiveShadow=true;scene.add(gr);
const railM=M(0xb8bcc4,{metalness:.8,roughness:.35});
[-6.5,6.5].forEach(x=>{const r=new THREE.Mesh(B(.12,.35,700),railM);r.position.set(x,.62,-280);scene.add(r)});
// roadside
const lit=[];for(let i=0;i<16*8;i++)lit.push(R()<.45);
const facade=tex(128,256,(g,w,h)=>{g.fillStyle='#6b7280';g.fillRect(0,0,w,h);let k=0;for(let y=8;y<h;y+=16)for(let x=8;x<w;x+=16){k++;g.fillStyle='#1b2a3a';g.fillRect(x,y,8,9)}});
const glow=tex(128,256,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);let k=0;for(let y=8;y<h;y+=16)for(let x=8;x<w;x+=16){if(lit[k++%lit.length]){g.fillStyle='#ffd98a';g.fillRect(x,y,8,9)}}});
const bmat=new THREE.MeshStandardMaterial({map:facade,emissiveMap:glow,emissive:0xffffff,emissiveIntensity:0,roughness:.8});
const trunkM=M(0x5a3a22),leafM=M(0x1f6b30),poleM=M(0x555a63,{metalness:.7,roughness:.4}),lampM=new THREE.MeshStandardMaterial({color:0x222222,emissive:0xffd9a0,emissiveIntensity:0});
const bGeo=B(1,1,1),S=18,N=36,slots=[];
function rnd(g){g.userData.b.forEach(b=>{const s=b.userData.s,sx=10+R()*8;b.scale.set(sx,14+R()*40,12+R()*6);b.position.set(s*(17+sx/2+R()*8),b.scale.y/2,(R()-.5)*4)})}
for(let i=0;i<N;i++){const g=new THREE.Group();g.userData.b=[];g.position.z=20-i*S;
 for(const s of[-1,1]){const b=new THREE.Mesh(bGeo,bmat);b.userData.s=s;g.add(b);g.userData.b.push(b);
  const t=new THREE.Group(),tk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2.6,6),trunkM),lf=new THREE.Mesh(new THREE.ConeGeometry(1.7,4.2,8),leafM);
  tk.position.y=1.3;lf.position.y=4.4;t.add(tk,lf);t.position.set(s*(10+R()*3),0,R()*10-5);g.add(t);
  const p=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,6,6),poleM);p.position.set(s*7.6,3,0);
  const a=new THREE.Mesh(B(1.3,.08,.08),poleM);a.position.set(s*6.95,6,0);
  const h=new THREE.Mesh(B(.5,.12,.3),lampM);h.position.set(s*6.4,5.95,0);
  const q=new THREE.Mesh(B(.12,.7,.12),poleM);q.position.set(s*6.5,.35,0);const q2=q.clone();q2.position.z=9;
  g.add(p,a,h,q,q2)}
 rnd(g);scene.add(g);slots.push(g)}
// cars
const tailM=new THREE.MeshStandardMaterial({color:0x550000,emissive:0xff1111,emissiveIntensity:.8}),headM=new THREE.MeshStandardMaterial({color:0xffffdd,emissive:0xffffaa,emissiveIntensity:.5});
const glass=M(0x0b1118,{metalness:.9,roughness:.1}),tireM=M(0x101010,{roughness:.9}),rimM=M(0xcfd3da,{metalness:.9,roughness:.25});
function car(color,type,own){
 const g=new THREE.Group(),m=M(color,{metalness:.55,roughness:.28}),tl=own?tailM:tailM;
 const add=(geo,mt,x,y,z)=>{const o=new THREE.Mesh(geo,mt);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o};
 let w=1.9,l=4.4;
 if(type==='cone'){w=.8;l=.8;add(new THREE.ConeGeometry(.4,.9,12),M(0xff6a00),0,.45,0);add(B(.8,.06,.8),M(0xffffff),0,.03,0);g.userData={w,l};return g}
 if(type==='truck'){w=2.5;l=9;add(B(2.3,.5,l),poleM,0,.65,0);add(B(2.5,2.5,6),M(0xdedede,{roughness:.6}),0,2.1,1.4);add(B(2.4,1.9,2.2),m,0,1.6,-3.3);add(B(2.1,.7,.1),glass,0,2.1,-4.42)}
 else{const sport=type==='sport',suv=type==='suv';
  add(B(w,sport?.5:.6,l),m,0,.6,0);
  add(B(1.66,sport?.4:suv?.75:.55,sport?1.9:2.3),glass,0,sport?1.05:suv?1.3:1.2,sport?.4:.2);
  add(B(1.5,.08,sport?1.5:2.0),m,0,sport?1.28:suv?1.7:1.5,sport?.4:.2);
  if(sport){add(B(1.8,.07,.45),m,0,1.15,1.95);add(B(.08,.3,.08),m,-.6,1.0,1.95);add(B(.08,.3,.08),m,.6,1.0,1.95)}}
 const wz=type==='truck'?[-3.2,1.2,3.1]:[-l/2+1,l/2-1];
 wz.forEach(z=>[-1,1].forEach(s=>{const x=s*(w/2-.1),t=add(new THREE.CylinderGeometry(.38,.38,.28,16),tireM,x,.38,z);t.rotation.z=Math.PI/2;
  const r=add(new THREE.CylinderGeometry(.22,.22,.3,10),rimM,x,.38,z);r.rotation.z=Math.PI/2}));
 [-1,1].forEach(s=>{add(B(.5,.18,.06),tl,s*.6,.78,l/2);add(B(.4,.16,.06),headM,s*.62,.74,-l/2)});
 g.userData={w,l};return g}
const player=car(0x1166ff,'sport',true);scene.add(player);
const spot=new THREE.SpotLight(0xfff2cc,0,70,.5,.6,1);spot.position.set(0,1,-1);spot.target.position.set(0,0,-30);player.add(spot,spot.target);
// traffic
const tr=[],cols=[0xd32f2f,0xffb300,0x2e9e5b,0xeeeeee,0xff6a00,0x8e44ff,0x37474f,0x1e88e5];
function spawn(){const d=D[diff];
 if(new Set(tr.filter(c=>c.position.z<-250).map(c=>c.userData.lane)).size>=3)return;
 const lane=Math.floor(R()*4);if(tr.some(c=>c.userData.lane===lane&&c.position.z<-270))return;
 const r=R();let type,f;
 if(r<d.cn){for(let i=0;i<3;i++){const c=car(0,'cone');c.userData.lane=lane;c.userData.sp=0;c.position.set(LX[lane]+(R()-.5)*.6,0,-320-i*4);scene.add(c);tr.push(c)}return}
 const q=R();if(q<.2){type='truck';f=.3+R()*.15}else if(q<.38){type='suv';f=.45+R()*.2}else if(q<.55){type='sport';f=.8+R()*.12}else{type='sedan';f=.4+R()*.3}
 const c=car(cols[Math.floor(R()*cols.length)],type),u=c.userData;u.lane=lane;u.sp=v*f;u.er=R()<d.er;u.t=2+R()*2;u.dir=0;
 c.position.set(LX[lane],0,-320);scene.add(c);tr.push(c)}
// audio
let ac,osc,gn;function audio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=450;gn=ac.createGain();gn.gain.value=0;osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start()}catch(e){ac=null}}
// input
const K={l:0,r:0,b:0,n:0},km={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyS:'b',ArrowDown:'b',Space:'n',ShiftLeft:'n'};
addEventListener('keydown',e=>{if(km[e.code]){K[km[e.code]]=1;e.preventDefault()}});addEventListener('keyup',e=>{if(km[e.code])K[km[e.code]]=0});
[['bl','l'],['br','r'],['bb','b'],['bn','n']].forEach(([id,k])=>{const e=$(id);e.addEventListener('pointerdown',()=>K[k]=1);['pointerup','pointerleave','pointercancel'].forEach(t=>e.addEventListener(t,()=>K[k]=0))});
document.querySelectorAll('.d').forEach(b=>b.addEventListener('click',()=>start(+b.dataset.d)));
let pt;function pop(t){const p=$('pop');p.textContent=t;p.style.opacity=1;clearTimeout(pt);pt=setTimeout(()=>p.style.opacity=0,900)}
function hud(){$('lv').textContent='♥'.repeat(Math.max(lives,0))+'♡'.repeat(Math.max(D[diff].lives-lives,0))}
function start(d){diff=d;audio();if(ac&&ac.state==='suspended')ac.resume();tr.forEach(c=>scene.remove(c));tr.length=0;
 v=18;dist=0;bonus=0;lives=D[d].lives;nitro=50;invul=0;px=0;sv=0;spT=0;running=true;$('menu').style.display='none';$('dn').textContent=D[d].n;hud()}
function end(){running=false;const s=Math.floor(dist/10)+bonus;if(s>best){best=s;try{localStorage.setItem('hwRushBest',best)}catch(e){}}$('bs').textContent=best;
 $('mt').textContent='CRASHED';$('mp').textContent='Score '+s+' · Distance '+Math.round(dist)+' m · Best '+best+'. Pick a difficulty to race again.';$('menu').style.display='flex'}
function hit(){lives--;invul=2.2;shake=1;v*=.5;const f=$('flash');f.style.opacity=.55;setTimeout(()=>f.style.opacity=0,200);hud();if(lives<=0)end()}
function scroll(dt,sp){roadT.offset.y+=sp*dt/12;slots.forEach(s=>{s.position.z+=sp*dt;if(s.position.z>20){s.position.z-=N*S;rnd(s)}})}
const night=new THREE.Color(0x060a18),dayC=new THREE.Color(0x8ec9f0),dusk=new THREE.Color(0xff7a3d),sc=new THREE.Color();
function update(dt){const d=D[diff],cl=THREE.MathUtils.clamp;tm+=dt;
 // day/night
 const day=cl(.5+Math.cos(tm/60*Math.PI*2)*.8,0,1),n=1-day;sc.lerpColors(night,dayC,day).lerp(dusk,(1-Math.abs(day*2-1))*.35);
 scene.background.copy(sc);scene.fog.color.copy(sc);hemi.intensity=.25+.9*day;sun.intensity=.1+1.5*day;
 lampM.emissiveIntensity=n*2;bmat.emissiveIntensity=n*1.3;spot.intensity=n*2.5;headM.emissiveIntensity=.5+n*2;
 if(!running){scroll(dt,12);v=12}
 else{
  const braking=K.b,nOn=K.n&&nitro>0&&!braking;
  const tgt=d.base+Math.min(dist/6000,1)*(d.max-d.base)+(nOn?25:0);
  if(braking)v-=38*dt;else if(v<tgt)v+=(nOn?30:7)*dt;else v-=6*dt;v=Math.max(8,v);
  nitro=nOn?Math.max(0,nitro-28*dt):Math.min(100,nitro+5*dt);
  tailM.emissiveIntensity=braking?3:.8;
  const st=K.r-K.l;sv+=(st*8-sv)*Math.min(1,dt*8);px+=sv*dt;if(Math.abs(px)>4.9){px=cl(px,-4.9,4.9);sv=0}
  player.position.x=px;player.rotation.y=-sv*.025;player.rotation.z=sv*.01;
  invul=Math.max(0,invul-dt);player.visible=invul<=0||Math.floor(tm*10)%2===0;
  dist+=v*dt;scroll(dt,v);
  spT-=dt;if(spT<=0){spawn();spT=d.sp*(60/v)*(.7+R()*.6)}
  for(let i=tr.length-1;i>=0;i--){const c=tr[i],u=c.userData;
   c.position.z+=(v-u.sp)*dt;
   if(u.hit){c.position.x+=u.vx*dt;c.rotation.y+=6*dt;c.position.y=Math.min(1.5,c.position.y+dt*3)}
   else{
    if(u.er&&c.position.z>-160){u.t-=dt;if(u.t<1&&!u.dir){const o=[];if(u.lane>0)o.push(-1);if(u.lane<3)o.push(1);u.dir=o[Math.floor(R()*o.length)]}
     if(u.t<=0){u.lane+=u.dir;u.dir=0;u.t=2+R()*3}}
    c.position.x+=(LX[u.lane]-c.position.x)*Math.min(1,dt*2.5);
    if(invul<=0&&Math.abs(c.position.x-px)<(1.9+u.w)/2-.08&&Math.abs(c.position.z)<(4.4+u.l)/2-.1){u.hit=true;u.vx=(c.position.x>px?1:-1)*9;hit();if(!running)return}
    if(!u.passed&&c.position.z>(4.4+u.l)/2){u.passed=true;if(!u.hit&&u.sp>0){bonus+=10;const gap=Math.abs(c.position.x-px)-(1.9+u.w)/2;if(gap<.7){bonus+=40;nitro=Math.min(100,nitro+15);pop('NEAR MISS +40')}}}}
   if(c.position.z>40||c.position.z<-380||Math.abs(c.position.x)>16){scene.remove(c);tr.splice(i,1)}}
 }
 const sc2=Math.floor(dist/10)+bonus;$('sc').textContent=sc2;$('spd').textContent=Math.round(v*3.6);$('nf').style.width=nitro+'%';
 if(osc){osc.frequency.value=45+v*2.4;gn.gain.value=running?.05:0}
 // camera
 const nOn2=running&&K.n&&nitro>0;shake*=1-Math.min(1,dt*3);
 cam.fov+=(62+(v/d.max)*16+(nOn2?8:0)-cam.fov)*Math.min(1,dt*3);cam.updateProjectionMatrix();
 const vib=(shake*.4+(nOn2?.05:0)+.01*v/d.max);
 cam.position.x+=(px*.6-cam.position.x)*Math.min(1,dt*5);cam.position.y=3.3+(R()-.5)*vib;cam.position.z=8.6+(nOn2?.8:0);
 cam.lookAt(px*.7,1.1,-16)}
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;update(dt);ren.render(scene,cam)}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
cam.position.set(0,3.3,8.6);requestAnimationFrame(loop);
})();
</script></body></html>
