let ac,osc1,osc2,flt,gn;

const SkyC={dayTop:new THREE.Color(0x1d4ed8),dayMid:new THREE.Color(0x93c5fd),dayBot:new THREE.Color(0xdbeafe),duskTop:new THREE.Color(0x311042),duskMid:new THREE.Color(0xe11d48),duskBot:new THREE.Color(0xfb923c),nightTop:new THREE.Color(0x020617),nightMid:new THREE.Color(0x0f172a),nightBot:new THREE.Color(0x1e293b),fogDay:new THREE.Color(0x93c5fd),fogDusk:new THREE.Color(0xbe123c),fogNight:new THREE.Color(0x020617)};

const day=cl(sy*1.5+0.35,0,1);const dusk=cl(1.0-Math.abs(sy*2.4),0,1)*(1-day*0.5);const night=cl(1.0-day-dusk*0.5,0,1);

if(!u.passed&&c.position.z>(4.55+u.l)/2){u.passed=true;if(u.sp>0){bonus+=10;const gap=Math.abs(c.position.x-px)-(1.95+u.w)/2;if(gap<0.72){bonus+=40;nitro=Math.min(100,nitro+18);showPop('NEAR MISS +40');}}}}
if(c.position.z>45||c.position.z<-420||Math.abs(c.position.x)>18){scene.remove(c);tr.splice(i,1);}}}
const curScore=Math.floor(dist/10)+bonus;$('sc').textContent=curScore;$('spd').textContent=Math.round(v*3.6);$('nf').style.width=nitro+'%';
if(osc1){const baseFreq=44+v*2.6;osc1.frequency.value=baseFreq;osc2.frequency.value=baseFreq*0.5;flt.frequency.value=380+v*14;gn.gain.value=running?(K.b?0.025:0.048):0;}
