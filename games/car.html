<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Car Racing - GameX</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 20%,#20253b,#08080f 65%);
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.game-container{
    width:100%;
    max-width:950px;
    padding:12px;
    text-align:center;
}

h1{
    font-size:32px;
    margin-bottom:8px;
    text-shadow:0 3px 15px rgba(139,92,246,.5);
}

.stats{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-bottom:10px;
    font-size:17px;
    font-weight:bold;
}

.stat{
    background:rgba(15,15,28,.8);
    padding:7px 13px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.1);
}

.game-wrapper{
    position:relative;
    width:850px;
    max-width:100%;
    margin:auto;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:#111;
    border:3px solid #8b5cf6;
    border-radius:12px;
    box-shadow:
        0 0 35px rgba(139,92,246,.25),
        0 15px 40px rgba(0,0,0,.5);
}

.game-over{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(0,0,0,.78);
    border-radius:12px;
    backdrop-filter:blur(5px);
}

.game-over h2{
    font-size:42px;
    margin-bottom:10px;
}

.game-over p{
    font-size:20px;
    margin-bottom:20px;
}

button{
    border:none;
    padding:13px 27px;
    border-radius:9px;
    background:#8b5cf6;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

.controls{
    margin-top:10px;
    font-size:14px;
    opacity:.75;
}

.back{
    display:inline-block;
    margin-top:10px;
    color:#c4b5fd;
    text-decoration:none;
}

@media(max-width:600px){

    h1{
        font-size:24px;
    }

    .stats{
        gap:6px;
        font-size:12px;
    }

    .stat{
        padding:5px 7px;
    }

    .controls{
        font-size:12px;
    }

}

</style>
</head>

<body>

<div class="game-container">

<h1>🏎️ Highway Rush</h1>

<div class="stats">

<div class="stat">
Score:
<span id="score">0</span>
</div>

<div class="stat">
Best:
<span id="best">0</span>
</div>

<div class="stat">
Speed:
<span id="speed">1</span>
</div>

<div class="stat">
❤️
<span id="lives">3</span>
</div>

</div>

<div class="game-wrapper">

<canvas
id="gameCanvas"
width="850"
height="600">
</canvas>

<div
class="game-over"
id="gameOver">

<h2>💥 GAME OVER</h2>

<p>
Score:
<span id="finalScore">0</span>
</p>

<button onclick="restartGame()">
🔄 Race Again
</button>

</div>

</div>

<div class="controls">
⬅️ ➡️ / A D — Steer &nbsp; • &nbsp;
Avoid traffic and survive as long as possible
</div>

<a
href="../index.html"
class="back">
← Back to GameX
</a>

</div>

<script>

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

const WIDTH=canvas.width;
const HEIGHT=canvas.height;


/* =====================================================
   GAME VARIABLES
===================================================== */

let score=0;

let bestScore=
Number(
localStorage.getItem("gamex-car-best")
)||0;

let lives=3;

let gameRunning=true;

let roadOffset=0;

let distance=0;

let difficulty=1;

let shake=0;

let flash=0;

let spawnTimer=0;

let particles=[];

let enemyCars=[];

let obstacles=[];

let buildings=[];


/* =====================================================
   CONTROLS
===================================================== */

const keys={
    left:false,
    right:false
};


/* =====================================================
   PLAYER
===================================================== */

const player={

    width:52,

    height:96,

    x:
    WIDTH/2-26,

    y:
    HEIGHT-125,

    speed:7,

    tilt:0,

    invincible:0

};


/* =====================================================
   ROAD
===================================================== */

const road={

    center:WIDTH/2,

    width:470,

    targetCenter:WIDTH/2,

    curve:0

};


/* =====================================================
   CAR COLORS
===================================================== */

const carColors=[

    "#e63946",
    "#facc15",
    "#06b6d4",
    "#22c55e",
    "#f97316",
    "#ec4899",
    "#f8fafc"

];


/* =====================================================
   BUILDINGS
===================================================== */

function createBuildings(){

    buildings=[];

    for(let i=0;i<35;i++){

        buildings.push({

            side:
            Math.random()<.5?-1:1,

            x:Math.random(),

            height:
            50+
            Math.random()*150,

            width:
            35+
            Math.random()*60,

            color:
            [
                "#202633",
                "#272d3a",
                "#303746",
                "#1c2430"
            ][
                Math.floor(Math.random()*4)
            ]

        });

    }

}

createBuildings();


/* =====================================================
   ENEMY CAR
===================================================== */

function createEnemy(){

    const laneWidth=
    road.width/4;

    const lane=
    Math.floor(
        Math.random()*4
    );

    const width=
    45+
    Math.random()*12;

    const height=
    80+
    Math.random()*25;

    const laneX=
    road.center-road.width/2+
    lane*laneWidth+
    laneWidth/2-
    width/2;

    enemyCars.push({

        x:laneX,

        y:-height-20,

        width:width,

        height:height,

        speed:
        2.5+
        Math.random()*2.8+
        difficulty*.18,

        color:
        carColors[
            Math.floor(
                Math.random()*carColors.length
            )
        ],

        type:
        Math.random()<.2
        ?"truck"
        :"car",

        changeTimer:
        60+
        Math.random()*120,

        targetX:laneX

    });

}


/* =====================================================
   OBSTACLE
===================================================== */

function createObstacle(){

    const laneWidth=
    road.width/4;

    const lane=
    Math.floor(
        Math.random()*4
    );

    obstacles.push({

        x:
        road.center-
        road.width/2+
        lane*laneWidth+
        laneWidth/2-
        18,

        y:-50,

        width:36,

        height:36,

        type:
        Math.random()<.5
        ?"cone"
        :"barrier"

    });

}


/* =====================================================
   PARTICLES
===================================================== */

function explosion(x,y){

    for(let i=0;i<30;i++){

        particles.push({

            x:x,

            y:y,

            vx:
            (Math.random()-.5)*9,

            vy:
            (Math.random()-.5)*9,

            life:
            30+
            Math.random()*25,

            size:
            2+
            Math.random()*5,

            color:
            Math.random()<.5
            ?"orange"
            :"#ffd166"

        });

    }

}


/* =====================================================
   ROAD
===================================================== */

function drawRoad(){

    /* GRASS */

    ctx.fillStyle="#183d27";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /* SIDE GRASS DETAILS */

    for(let i=0;i<14;i++){

        const y=
        (i*55+
        roadOffset*.35)
        %HEIGHT;

        ctx.fillStyle=
        i%2
        ?"rgba(255,255,255,.025)"
        :"rgba(0,0,0,.08)";

        ctx.fillRect(
            0,
            y,
            WIDTH,
            2
        );

    }


    /* ROAD */

    ctx.fillStyle="#303238";

    ctx.beginPath();

    ctx.moveTo(
        road.center-road.width/2,
        0
    );

    ctx.lineTo(
        road.center-road.width/2+
        road.curve,
        HEIGHT
    );

    ctx.lineTo(
        road.center+road.width/2+
        road.curve,
        HEIGHT
    );

    ctx.lineTo(
        road.center+road.width/2,
        0
    );

    ctx.closePath();

    ctx.fill();


    /* ROAD SHADOW */

    ctx.fillStyle="rgba(0,0,0,.18)";

    ctx.fillRect(
        road.center-road.width/2,
        0,
        10,
        HEIGHT
    );


    /* ROAD EDGES */

    ctx.fillStyle="#f4f4f4";

    ctx.fillRect(
        road.center-road.width/2,
        0,
        7,
        HEIGHT
    );

    ctx.fillRect(
        road.center+road.width/2-7,
        0,
        7,
        HEIGHT
    );


    /* LANE MARKINGS */

    const laneWidth=
    road.width/4;

    ctx.fillStyle=
    "rgba(255,255,255,.9)";

    for(let lane=1;lane<4;lane++){

        const x=
        road.center-
        road.width/2+
        lane*laneWidth+
        road.curve*.5;

        for(
            let y=-90+roadOffset;
            y<HEIGHT;
            y+=115
        ){

            ctx.fillRect(
                x-3,
                y,
                6,
                65
            );

        }

    }

}


/* =====================================================
   BUILDINGS / CITY
===================================================== */

function drawCity(){

    for(let i=0;i<buildings.length;i++){

        const b=buildings[i];

        const sideX=
        b.side<0
        ?road.center-road.width/2-25-
        b.width-
        b.x*80
        :road.center+road.width/2+25+
        b.x*80;

        const y=
        HEIGHT-
        (
            (i*170+
            roadOffset*.45)
            %
            (HEIGHT+250)
        );

        ctx.fillStyle=b.color;

        ctx.fillRect(
            sideX,
            y-b.height,
            b.width,
            b.height
        );


        /* WINDOWS */

        ctx.fillStyle=
        "rgba(255,220,100,.45)";

        for(
            let wy=y-b.height+12;
            wy<y-10;
            wy+=18
        ){

            for(
                let wx=sideX+7;
                wx<sideX+b.width-5;
                wx+=15
            ){

                if(
                    (i+
                    Math.floor(wy)+
                    Math.floor(wx))
                    %3!==0
                ){

                    ctx.fillRect(
                        wx,
                        wy,
                        7,
                        8
                    );

                }

            }

        }

    }

}


/* =====================================================
   CAR DRAWING
===================================================== */

function drawCar(car,color){

    ctx.save();

    ctx.translate(
        car.x+
        car.width/2,
        car.y+
        car.height/2
    );

    ctx.rotate(
        car.tilt||0
    );

    const w=car.width;
    const h=car.height;

    /* SHADOW */

    ctx.fillStyle=
    "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        h*.48,
        w*.62,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* BODY */

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.roundRect(
        -w/2,
        -h/2,
        w,
        h,
        10
    );

    ctx.fill();


    /* BODY HIGHLIGHT */

    const grad=
    ctx.createLinearGradient(
        -w/2,
        0,
        w/2,
        0
    );

    grad.addColorStop(
        0,
        "rgba(0,0,0,.25)"
    );

    grad.addColorStop(
        .5,
        "rgba(255,255,255,.15)"
    );

    grad.addColorStop(
        1,
        "rgba(0,0,0,.3)"
    );

    ctx.fillStyle=grad;

    ctx.fill();


    /* FRONT WINDOW */

    ctx.fillStyle="#101722";

    ctx.beginPath();

    ctx.roundRect(
        -w*.34,
        -h*.31,
        w*.68,
        h*.23,
        5
    );

    ctx.fill();


    /* WINDOW REFLECTION */

    ctx.fillStyle=
    "rgba(150,220,255,.18)";

    ctx.fillRect(
        -w*.25,
        -h*.29,
        w*.18,
        h*.18
    );


    /* REAR WINDOW */

    ctx.fillStyle="#111827";

    ctx.fillRect(
        -w*.32,
        h*.02,
        w*.64,
        h*.20
    );


    /* CENTER LINE */

    ctx.fillStyle=
    "rgba(255,255,255,.15)";

    ctx.fillRect(
        -2,
        -h*.45,
        4,
        h*.9
    );


    /* WHEELS */

    ctx.fillStyle="#050505";

    const wheelW=7;
    const wheelH=25;

    ctx.fillRect(
        -w/2-4,
        -h*.28,
        wheelW,
        wheelH
    );

    ctx.fillRect(
        w/2-3,
        -h*.28,
        wheelW,
        wheelH
    );

    ctx.fillRect(
        -w/2-4,
        h*.15,
        wheelW,
        wheelH
    );

    ctx.fillRect(
        w/2-3,
        h*.15,
        wheelW,
        wheelH
    );


    /* HEADLIGHTS */

    ctx.fillStyle="#fff7c2";

    ctx.fillRect(
        -w*.32,
        -h*.45,
        10,
        6
    );

    ctx.fillRect(
        w*.32-10,
        -h*.45,
        10,
        6
    );


    /* TAIL LIGHTS */

    ctx.fillStyle="#ff2020";

    ctx.fillRect(
        -w*.34,
        h*.38,
        11,
        6
    );

    ctx.fillRect(
        w*.34-11,
        h*.38,
        11,
        6
    );

    ctx.restore();

}


/* =====================================================
   OBSTACLES
===================================================== */

function drawObstacle(o){

    ctx.save();

    ctx.translate(
        o.x+
        o.width/2,
        o.y+
        o.height/2
    );

    if(o.type==="cone"){

        ctx.fillStyle="#f97316";

        ctx.beginPath();

        ctx.moveTo(
            0,
            -20
        );

        ctx.lineTo(
            -18,
            18
        );

        ctx.lineTo(
            18,
            18
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle="white";

        ctx.fillRect(
            -11,
            0,
            22,
            5
        );

    }else{

        ctx.fillStyle="#facc15";

        ctx.fillRect(
            -18,
            -15,
            36,
            30
        );

        ctx.fillStyle="#222";

        for(let i=-15;i<20;i+=15){

            ctx.fillRect(
                i,
                -15,
                7,
                30
            );

        }

    }

    ctx.restore();

}


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

    const pad=7;

    return(

        a.x+pad<
        b.x+b.width-pad

        &&

        a.x+a.width-pad>
        b.x+pad

        &&

        a.y+pad<
        b.y+b.height-pad

        &&

        a.y+a.height-pad>
        b.y+pad

    );

}


/* =====================================================
   CRASH
===================================================== */

function crash(){

    if(player.invincible>0)
        return;

    lives--;

    player.invincible=100;

    shake=18;

    flash=1;

    explosion(
        player.x+
        player.width/2,
        player.y+
        player.height/2
    );

    if(lives<=0){

        endGame();

    }

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!gameRunning)
        return;


    /* DIFFICULTY */

    difficulty=
    1+
    Math.floor(score/100);


    /* PLAYER */

    if(keys.left){

        player.x-=
        player.speed;

        player.tilt=
        Math.max(
            player.tilt-.025,
            -.12
        );

    }else if(keys.right){

        player.x+=
        player.speed;

        player.tilt=
        Math.min(
            player.tilt+.025,
            .12
        );

    }else{

        player.tilt*=.85;

    }


    /* ROAD BOUNDARIES */

    const left=
    road.center-
    road.width/2+
    12;

    const right=
    road.center+
    road.width/2-
    player.width-
    12;


    if(player.x<left)
        player.x=left;

    if(player.x>right)
        player.x=right;


    /* ROAD MOTION */

    const roadSpeed=
    4+
    difficulty*.55;

    roadOffset+=roadSpeed;

    if(roadOffset>115)
        roadOffset=0;


    /* SLIGHT ROAD CURVE */

    road.targetCenter=
    WIDTH/2+
    Math.sin(
        distance*.002
    )*55;

    road.center+=
    (
        road.targetCenter-
        road.center
    )*.004;


    distance+=roadSpeed;


    /* PLAYER INVINCIBILITY */

    if(player.invincible>0)
        player.invincible--;


    /* ENEMY CARS */

    for(const car of enemyCars){

        car.y+=
        car.speed+
        difficulty*.12;


        /* AI TRACKING */

        const vertical=
        player.y-car.y;


        if(
            vertical>0 &&
            vertical<230
        ){

            if(
                player.x<
                car.x-18
            ){

                car.targetX=
                car.x-1.1;

            }

            if(
                player.x>
                car.x+18
            ){

                car.targetX=
                car.x+1.1;

            }

        }


        car.x+=
        (car.targetX-car.x)*.025;


        /* KEEP ON ROAD */

        const minX=
        road.center-
        road.width/2+
        10;

        const maxX=
        road.center+
        road.width/2-
        car.width-
        10;


        car.x=
        Math.max(
            minX,
            Math.min(
                maxX,
                car.x
            )
        );


        if(
            collision(
                player,
                car
            )
        ){

            crash();

        }

    }


    /* OBSTACLES */

    for(const o of obstacles){

        o.y+=
        roadSpeed*1.05;

        if(
            collision(
                player,
                o
            )
        ){

            crash();

            o.y=HEIGHT+100;

        }

    }


    /* REMOVE CARS */

    enemyCars=
    enemyCars.filter(car=>{

        if(car.y>HEIGHT+150){

            score+=10;

            return false;

        }

        return true;

    });


    /* REMOVE OBSTACLES */

    obstacles=
    obstacles.filter(
        o=>o.y<HEIGHT+100
    );


    /* SPAWN TRAFFIC */

    spawnTimer--;

    const spawnRate=
    Math.max(
        30,
        80-
        difficulty*4
    );


    if(spawnTimer<=0){

        createEnemy();

        spawnTimer=
        spawnRate+
        Math.random()*30;

    }


    /* OBSTACLE SPAWN */

    if(
        difficulty>=3 &&
        Math.random()<
        .0025*difficulty
    ){

        createObstacle();

    }


    /* SCORE */

    if(
        Math.floor(distance)%12===0
    ){

        score=
        Math.floor(
            distance/12
        );

    }


    /* SPEED */

    document.getElementById(
        "score"
    ).textContent=score;

    document.getElementById(
        "speed"
    ).textContent=
    Math.min(
        20,
        Math.floor(
            1+
            difficulty*.7
        )
    );

    document.getElementById(
        "lives"
    ).textContent=
    lives;


    /* PARTICLES */

    for(const p of particles){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.98;
        p.vy*=.98;

        p.life--;

    }

    particles=
    particles.filter(
        p=>p.life>0
    );


    if(shake>0)
        shake*=.88;

    if(flash>0)
        flash*=.82;

}


/* =====================================================
   PARTICLES DRAW
===================================================== */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=
        Math.min(
            1,
            p.life/30
        );

        ctx.fillStyle=p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =====================================================
   HUD EFFECT
===================================================== */

function drawLighting(){

    const gradient=
    ctx.createRadialGradient(
        WIDTH/2,
        HEIGHT*.75,
        50,
        WIDTH/2,
        HEIGHT*.7,
        500
    );

    gradient.addColorStop(
        0,
        "rgba(255,255,220,.05)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.35)"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    if(flash>.05){

        ctx.fillStyle=
        `rgba(255,255,255,${flash*.25})`;

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

    }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.save();


    /* SCREEN SHAKE */

    if(shake>1){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

    }


    ctx.clearRect(
        -30,
        -30,
        WIDTH+60,
        HEIGHT+60
    );


    drawCity();

    drawRoad();


    /* ROAD SIDE POSTS */

    for(
        let y=-40+roadOffset;
        y<HEIGHT;
        y+=100
    ){

        ctx.fillStyle="#eee";

        ctx.fillRect(
            road.center-
            road.width/2-
            17,
            y,
            5,
            28
        );

        ctx.fillRect(
            road.center+
            road.width/2+
            12,
            y,
            5,
            28
        );

    }


    /* OBSTACLES */

    obstacles.forEach(
        drawObstacle
    );


    /* ENEMIES */

    enemyCars.forEach(
        car=>{

            if(
                player.invincible>0 &&
                Math.floor(
                    player.invincible/6
                )%2===0
            ){
                return;
            }

            drawCar(
                car,
                car.color
            );

        }
    );


    /* PLAYER */

    if(
        player.invincible<=0 ||
        Math.floor(
            player.invincible/6
        )%2===0
    ){

        drawCar(
            player,
            "#8b5cf6"
        );

    }


    drawParticles();

    drawLighting();

    ctx.restore();

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
"keydown",
e=>{

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    ){

        keys.left=true;

        e.preventDefault();

    }


    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    ){

        keys.right=true;

        e.preventDefault();

    }

});


document.addEventListener(
"keyup",
e=>{

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    ){

        keys.left=false;

    }


    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    ){

        keys.right=false;

    }

});


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    gameRunning=false;

    if(score>bestScore){

        bestScore=score;

        localStorage.setItem(
            "gamex-car-best",
            bestScore
        );

    }

    document.getElementById(
        "best"
    ).textContent=bestScore;

    document.getElementById(
        "finalScore"
    ).textContent=score;

    document.getElementById(
        "gameOver"
    ).style.display="flex";

}


/* =====================================================
   RESTART
===================================================== */

function restartGame(){

    score=0;

    distance=0;

    difficulty=1;

    lives=3;

    roadOffset=0;

    road.center=WIDTH/2;

    road.targetCenter=WIDTH/2;

    enemyCars=[];

    obstacles=[];

    particles=[];

    spawnTimer=0;

    shake=0;

    flash=0;

    player.x=
    WIDTH/2-
    player.width/2;

    player.tilt=0;

    player.invincible=0;

    gameRunning=true;

    document.getElementById(
        "score"
    ).textContent="0";

    document.getElementById(
        "speed"
    ).textContent="1";

    document.getElementById(
        "lives"
    ).textContent="3";

    document.getElementById(
        "gameOver"
    ).style.display="none";

}


/* =====================================================
   START
===================================================== */

document.getElementById(
"best"
).textContent=bestScore;

gameLoop();

</script>
