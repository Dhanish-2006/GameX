<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bike Racing - GameX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #08080f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            padding: 15px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .game-wrapper {
            position: relative;
            width: 800px;
            max-width: 100%;
            margin: auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #555;
            border: 3px solid #8b5cf6;
            border-radius: 12px;
        }

        .game-over {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 12px;
        }

        .game-over h2 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .game-over p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .controls {
            margin-top: 15px;
            font-size: 15px;
            opacity: 0.8;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #c4b5fd;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 25px;
            }

            .stats {
                gap: 18px;
                font-size: 15px;
            }

            .controls {
                font-size: 13px;
            }

            .game-over h2 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>🏍️ Bike Racing</h1>

    <div class="stats">
        <div>
            Score:
            <span id="score">0</span>
        </div>

        <div>
            Best:
            <span id="best">0</span>
        </div>

        <div>
            Speed:
            <span id="speed">1</span>
        </div>
    </div>

    <div class="game-wrapper">

        <canvas
            id="gameCanvas"
            width="800"
            height="600">
        </canvas>

        <div class="game-over" id="gameOver">

            <h2>💥 Crash!</h2>

            <p>
                Your Score:
                <span id="finalScore">0</span>
            </p>

            <button onclick="restartGame()">
                🔄 Restart
            </button>

        </div>

    </div>

    <div class="controls">
        ⬅️ ➡️ Arrow Keys / A D to move
    </div>

    <a href="../index.html" class="back">
        ← Back to GameX
    </a>

</div>


<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;


// ==============================
// GAME VARIABLES
// ==============================

let score = 0;

let bestScore =
    Number(localStorage.getItem("gamex-bike-best")) || 0;

let gameRunning = true;

let roadOffset = 0;

let enemyBikes = [];

let coins = [];

let keys = {
    left: false,
    right: false
};


// ==============================
// ROAD
// ==============================

const road = {
    x: 170,
    width: 460
};


// ==============================
// PLAYER BIKE
// ==============================

const player = {

    width: 38,
    height: 82,

    x: WIDTH / 2 - 19,

    y: HEIGHT - 125,

    speed: 4

};


// ==============================
// CREATE ENEMY BIKE
// ==============================

function createEnemyBike() {

    const lanes = [

        road.x + 75,

        road.x + 185,

        road.x + 295

    ];

    const lane =
        lanes[Math.floor(Math.random() * lanes.length)];

    enemyBikes.push({

        x: lane,

        y: -100,

        width: 38,

        height: 82,

        speed: 2.5 + Math.random() * 1.5,

        color:
            Math.random() > 0.5
            ? "#ef4444"
            : "#22c55e"

    });
}


// ==============================
// CREATE COIN
// ==============================

function createCoin() {

    const lanes = [

        road.x + 75,

        road.x + 185,

        road.x + 295

    ];

    const lane =
        lanes[Math.floor(Math.random() * lanes.length)];

    coins.push({

        x: lane + 10,

        y: -30,

        radius: 10,

        speed: 3

    });
}


// ==============================
// DRAW ROAD
// ==============================

function drawRoad() {

    // Grass

    ctx.fillStyle = "#176b35";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    // Road

    ctx.fillStyle = "#333";

    ctx.fillRect(
        road.x,
        0,
        road.width,
        HEIGHT
    );


    // Road edges

    ctx.fillStyle = "#ddd";

    ctx.fillRect(
        road.x,
        0,
        7,
        HEIGHT
    );

    ctx.fillRect(
        road.x + road.width - 7,
        0,
        7,
        HEIGHT
    );


    // Lane lines

    ctx.fillStyle = "#fff";

    const laneWidth =
        road.width / 4;


    for (
        let lane = 1;
        lane < 4;
        lane++
    ) {

        const x =
            road.x + lane * laneWidth;


        for (
            let y = -60 + roadOffset;
            y < HEIGHT;
            y += 100
        ) {

            ctx.fillRect(
                x - 3,
                y,
                6,
                55
            );
        }
    }
}


// ==============================
// DRAW BIKE
// ==============================

function drawBike(bike, color) {

    const centerX =
        bike.x + bike.width / 2;


    // Wheels

    ctx.fillStyle = "#050505";

    ctx.beginPath();

    ctx.arc(
        centerX,
        bike.y + 13,
        11,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        centerX,
        bike.y + bike.height - 13,
        11,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Bike body

    ctx.strokeStyle = color;

    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(
        centerX,
        bike.y + 18
    );

    ctx.lineTo(
        centerX - 12,
        bike.y + 43
    );

    ctx.lineTo(
        centerX + 12,
        bike.y + 43
    );

    ctx.lineTo(
        centerX,
        bike.y + bike.height - 18
    );

    ctx.stroke();


    // Rider

    ctx.fillStyle = "#111827";

    ctx.beginPath();

    ctx.arc(
        centerX,
        bike.y + 30,
        9,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Headlight

    ctx.fillStyle = "#fef08a";

    ctx.beginPath();

    ctx.arc(
        centerX,
        bike.y + 8,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


// ==============================
// DRAW COIN
// ==============================

function drawCoin(coin) {

    ctx.fillStyle = "#facc15";

    ctx.beginPath();

    ctx.arc(
        coin.x,
        coin.y,
        coin.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#92400e";

    ctx.font = "bold 13px Arial";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    ctx.fillText(
        "$",
        coin.x,
        coin.y
    );
}


// ==============================
// COLLISION
// ==============================

function collision(a, b) {

    return (

        a.x < b.x + b.width &&

        a.x + a.width > b.x &&

        a.y < b.y + b.height &&

        a.y + a.height > b.y

    );
}


// ==============================
// COIN COLLISION
// ==============================

function collectCoin(bike, coin) {

    return (

        bike.x < coin.x + coin.radius &&

        bike.x + bike.width >
            coin.x - coin.radius &&

        bike.y < coin.y + coin.radius &&

        bike.y + bike.height >
            coin.y - coin.radius

    );
}


// ==============================
// UPDATE
// ==============================

function update() {

    if (!gameRunning) {
        return;
    }


    // Player movement

    if (keys.left) {

        player.x -= player.speed;
    }

    if (keys.right) {

        player.x += player.speed;
    }


    // Keep bike on road

    const leftLimit =
        road.x + 20;

    const rightLimit =
        road.x +
        road.width -
        player.width -
        20;


    if (player.x < leftLimit) {

        player.x = leftLimit;
    }

    if (player.x > rightLimit) {

        player.x = rightLimit;
    }


    // Road movement

    roadOffset += 3;

    if (roadOffset >= 100) {

        roadOffset = 0;
    }


    // Enemy bikes

   enemyBikes.forEach(bike => {

    // Move enemy bike downward
    bike.y +=
        bike.speed +
        score * 0.005;

    // If player is near the edge,
    // enemy bike moves toward the player
    if (player.x < road.x + 80) {
        bike.x -= 1.5;
    }

    if (player.x > road.x + road.width - 120) {
        bike.x += 1.5;
    }

    // Collision
    if (collision(player, bike)) {
        endGame();
    }

});


    // Remove enemy bikes

    enemyBikes =
        enemyBikes.filter(bike => {

            if (bike.y > HEIGHT) {

                score += 10;

                document.getElementById(
                    "score"
                ).textContent = score;

                return false;
            }

            return true;
        });


    // Coins

    coins.forEach(coin => {

        coin.y += coin.speed;


        if (collectCoin(player, coin)) {

            score += 25;

            document.getElementById(
                "score"
            ).textContent = score;

            coin.collected = true;
        }

    });


    coins =
        coins.filter(coin => {

            return (
                !coin.collected &&
                coin.y < HEIGHT + 30
            );

        });


    // Difficulty

    const gameSpeed =
        Math.min(
            1 + Math.floor(score / 100),
            10
        );


    document.getElementById(
        "speed"
    ).textContent = gameSpeed;
}


// ==============================
// DRAW
// ==============================

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    drawRoad();


    // Coins

    coins.forEach(coin => {

        drawCoin(coin);

    });


    // Player bike

    drawBike(
        player,
        "#8b5cf6"
    );


    // Enemy bikes

    enemyBikes.forEach(bike => {

        drawBike(
            bike,
            bike.color
        );

    });
}


// ==============================
// GAME LOOP
// ==============================

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


// ==============================
// ENEMY SPAWN
// ==============================

setInterval(() => {

    if (gameRunning) {

        createEnemyBike();
    }

}, 1300);


// ==============================
// COIN SPAWN
// ==============================

setInterval(() => {

    if (gameRunning) {

        createCoin();
    }

}, 1800);


// ==============================
// KEYBOARD
// ==============================

document.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = true;

            e.preventDefault();
        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = true;

            e.preventDefault();
        }

    }
);


document.addEventListener(
    "keyup",
    e => {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = false;
        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = false;
        }

    }
);


// ==============================
// GAME OVER
// ==============================

function endGame() {

    gameRunning = false;


    if (score > bestScore) {

        bestScore = score;

        localStorage.setItem(
            "gamex-bike-best",
            bestScore
        );
    }


    document.getElementById(
        "best"
    ).textContent = bestScore;


    document.getElementById(
        "finalScore"
    ).textContent = score;


    document.getElementById(
        "gameOver"
    ).style.display = "flex";
}


// ==============================
// RESTART
// ==============================

function restartGame() {

    score = 0;

    player.x =
        WIDTH / 2 -
        player.width / 2;

    enemyBikes = [];

    coins = [];

    roadOffset = 0;

    gameRunning = true;


    document.getElementById(
        "score"
    ).textContent = "0";


    document.getElementById(
        "speed"
    ).textContent = "1";


    document.getElementById(
        "gameOver"
    ).style.display = "none";
}


// ==============================
// START
// ==============================

document.getElementById(
    "best"
).textContent = bestScore;


gameLoop();

</script>

</body>
</html>
