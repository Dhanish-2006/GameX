<style>

kbd{display:inline-block;min-width:24px;padding:2px 6px;border:1px solid rgba(255,255,255,.25);border-bottom-width:3px;border-radius:6px;background:rgba(255,255,255,.1);font:inherit;font-size:11px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}

.cd{margin-bottom:14px;padding:12px 16px;border:1px solid rgba(125,211,252,.3);border-radius:12px;background:rgba(56,189,248,.1)}
.cdr{display:flex;align-items:center;justify-content:center;gap:12px}
#cdn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2ba4e7,#6557e8);box-shadow:0 0 18px rgba(80,170,255,.55);font-size:20px;font-weight:900;animation:pop .35s ease-out}
.cdt{text-align:left;font-size:13px;font-weight:700;line-height:1.4}

.track{height:6px;margin-top:12px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
.bar{height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#7cecff,#6557e8);animation:drain linear forwards}
.link{margin-top:10px;padding:0;border:0;background:none;color:rgba(186,230,253,.75);font-size:11px;font-weight:700;text-decoration:underline;cursor:pointer}
#act{min-width:180px;padding:14px 24px;border:0;border-radius:12px;background:linear-gradient(135deg,#2ba4e7,#6557e8);box-shadow:0 10px 30px rgba(60,110,240,.45);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
#act:active{transform:scale(.98)}
.foot{margin-top:12px;color:rgba(224,242,254,.5);font-size:11px}
@keyframes pop{from{transform:scale(1.45);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes drain{from{width:100%}to{width:0}}
.touchonly{display:none!important}
@media(pointer:coarse),(max-width:700px){
 #touch{display:flex}#hint{display:none}
 .touchonly{display:grid!important}.deskonly{display:none!important}
 #panel{left:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:158px;padding:8px 11px}
 #spd{font-size:34px}
}
@media(max-width:520px){
 #hud{left:8px;right:8px;gap:5px}.brand{display:none}
 .stat{min-height:35px;padding:4px 7px;font-size:9px}.stat b{font-size:12px}
 .hbtn{min-width:35px;min-height:35px}.grid{grid-template-columns:repeat(2,1fr)}
 .keys{grid-template-columns:1fr}#toast{top:calc(64px + env(safe-area-inset-top,0px))}
}
</style>

<body>
<canvas id="game"></canvas>
<div id="vignette"></div><div id="flash"></div>

<header id="hud">
  <div class="brand glass"><small>GAMEX PRESENTS</small><strong>🏍️ HIGHWAY RUSH 3D</strong></div>
  <div class="stats">
    <div class="stat glass">SCORE <b id="uScore">0</b></div>
    <div class="stat glass">BEST <b id="uBest">0</b></div>
    <div class="stat glass">DIST <b id="uDist">0.00 km</b></div>
    <div class="stat glass">COINS <b id="uCoins">0</b></div>
    <div class="stat glass">LEVEL <b id="uLevel">1</b></div>
  </div>
  <div class="acts">
    <button class="hbtn glass" id="bSound" type="button">🔊</button>
    <button class="hbtn glass" id="bPause" type="button">Ⅱ</button>
  </div>
</header>

<div id="panel" class="glass">
  <div><span id="spd">0</span><span class="unit">KM/H</span></div>
  <div class="meter sm"><div class="fill" id="fSpd"></div></div>
  <div class="ml pace"><span>▲ PACE</span><span><span id="uPace">220</span> km/h</span></div>
  <div class="meter sm"><div class="fill" id="fPace"></div></div>
  <div class="ml"><span>⚡ NITRO</span><span id="uNit">100%</span></div>
  <div class="meter"><div class="fill" id="fNit"></div></div>
  <div class="ml"><span>❤️ BIKE</span><span id="uHp">100%</span></div>
  <div class="meter"><div class="fill" id="fHp"></div></div>
</div>

<div id="hint">A / D or ← / →: steer<br>W / ↑ / Space: nitro · S / ↓: brake<br>P: pause · Touch any vehicle = GAME OVER</div>

<div id="touch">
  <div class="grp">
    <button class="tb" data-c="left" type="button">◀</button>
    <button class="tb" data-c="right" type="button">▶</button>
  </div>
  <div class="grp">
    <button class="tb brk" data-c="brake" type="button">BRAKE</button>
    <button class="tb bst" data-c="boost" type="button">NITRO⚡</button>
  </div>
</div>

<div id="ov"><div class="card" id="ovCard">
  <div class="eyebrow">LOADING</div><h1>Building the 3D track…</h1>
  <p class="muted">Fetching Three.js and preparing the highway.</p>
</div></div>

<script type="module">
import * as THREE from "three";

const $=id=>document.getElementById(id);
const U={score:$("uScore"),best:$("uBest"),dist:$("uDist"),coins:$("uCoins"),level:$("uLevel"),
 spd:$("spd"),fSpd:$("fSpd"),pace:$("uPace"),fPace:$("fPace"),nit:$("uNit"),fNit:$("fNit"),
 hp:$("uHp"),fHp:$("fHp"),toast:$("toast"),flash:$("flash"),panel:$("panel"),ov:$("ov"),card:$("ovCard"),
 pause:$("bPause"),sound:$("bSound")};
const canvas=$("game");
const MOBILE=matchMedia("(pointer:coarse)").matches||innerWidth<700;

/* ---------- tuning ---------- */
const ROAD_MIN=-300,ROAD_MAX=50,SEG=100,PLAYER_Z=6,LANES=[-6,-2,2,6];
const START_SPEED=200,BASE_CRUISE=220,MAX_CRUISE=360,RAMP_PER_KM=18,STEP=10;
const NITRO=80,MAX_SPEED=MAX_CRUISE+NITRO,BRAKE_SPEED=140,TRAFFIC_SPEEDUP=.35;
const HIT_PAD=.42,CRASH_SEQ=1.2,AUTO_RESTART=3,SPAWN_Z=-235,PCOUNT=140,KEY="hr3d-best";
const R=Math.PI/2;
const NAMES={BIKE:"a motorbike",CAR:"a car",SUV:"an SUV",TAXI:"a taxi",TRUCK:"a truck",TANKER:"a tanker truck"};
const BONUS={bike:85,car:110,truck:160},NIT={bike:7,car:9,truck:12};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const approach=(v,t,a)=>v<t?Math.min(t,v+a):Math.max(t,v-a);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cruiseFor=d=>Math.min(MAX_CRUISE,BASE_CRUISE+d/1000*RAMP_PER_KM);
const pace=d=>(cruiseFor(d)-BASE_CRUISE)/(MAX_CRUISE-BASE_CRUISE);
const isPick=t=>t==="coin"||t==="health"||t==="nitro";

/* ---------- state ---------- */
const keys={left:0,right:0,boost:0,brake:0};
const touch={left:new Set(),right:new Set(),boost:new Set(),brake:new Set()};
const fresh=()=>({lat:-2,vx:0,speed:START_SPEED,hp:100,nitro:100,dist:0,score:0,coins:0,
 inv:0,slip:0,boosting:false,top:START_SPEED,level:1,near:0,over:0});
let P=fresh();
let scene,camera,renderer,sky,asphalt,hero,G={},M={},T={};
let mode="load",best=0,wt=0,idleT=0,overAt=0,spawnM=0,coinM=0,supM=0,uiT=0,toastT=0,flash=0,shake=0,prev=0,curve0=0;
let crashT=-1,crashV=0,crashDir=1,crashSpin=0,cause="",pending=null,cdId=0;
let objs=[],ribs=[],marks=[],rails=[],props=[],parts=[],pcur=0,pPos,pCol,pGeo;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
const held=n=>keys[n]||touch[n].size>0;
const clearKeys=()=>{for(const k in keys){keys[k]=0;touch[k].clear()}};

/* ---------- road curve ---------- */
const cv=p=>Math.sin(p*.0031)*8+Math.sin(p*.00105+1.35)*4;
const sync=()=>curve0=cv(P.dist);
const center=z=>cv(P.dist-z)-curve0;
const heading=z=>Math.atan2(center(z+2)-center(z-2),4);

/* ---------- audio ---------- */
const A={muted:false,ctx:null,lastCoin:0,
 start(){if(A.muted)return;try{
   if(!A.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=new C();A.ctx=c;A.master=c.createGain();A.master.connect(c.destination);
    A.osc=c.createOscillator();A.osc.type="sawtooth";A.osc.frequency.value=120;
    A.sub=c.createOscillator();A.sub.type="square";A.sub.frequency.value=60;
    const sg=c.createGain();sg.gain.value=.35;
    A.flt=c.createBiquadFilter();A.flt.type="lowpass";A.flt.frequency.value=400;
    A.gain=c.createGain();A.gain.gain.value=0;
    A.osc.connect(A.flt);A.sub.connect(sg);sg.connect(A.flt);A.flt.connect(A.gain);A.gain.connect(A.master);
    A.osc.start();A.sub.start();
    const n=c.sampleRate|0;A.noise=c.createBuffer(1,n,c.sampleRate);
    const d=A.noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}
   A.ctx.resume().catch(()=>{})}catch(e){}},
 ok(){return A.muted||!A.ctx?null:A.ctx},
 upd(sp,on,bo){if(!A.ctx)return;const t=A.ctx.currentTime,f=55+sp*.72;
   A.osc.frequency.setTargetAtTime(f,t,.12);A.sub.frequency.setTargetAtTime(f/2,t,.12);
   A.flt.frequency.setTargetAtTime(220+sp*2.6+(bo?650:0),t,.12);
   A.gain.gain.setTargetAtTime(on&&!A.muted?(bo?.03:.022):0,t,.1)},
 coin(){const c=A.ok();if(!c||wt-A.lastCoin<.09)return;A.lastCoin=wt;
   const n=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type="sine";
   o.frequency.setValueAtTime(680,n);o.frequency.exponentialRampToValueAtTime(1050,n+.1);
   g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.035,n+.012);
   g.gain.exponentialRampToValueAtTime(.0001,n+.13);o.connect(g);g.connect(A.master);o.start(n);o.stop(n+.14)},
 crash(i=1){const c=A.ok();if(!c)return;const n=c.currentTime,d=.16+i*.22,
   s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=A.noise;
   f.type="lowpass";f.frequency.setValueAtTime(2600,n);f.frequency.exponentialRampToValueAtTime(240,n+d);
   g.gain.setValueAtTime(.12+i*.06,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
   s.connect(f);f.connect(g);g.connect(A.master);s.start(n);s.stop(n+d+.02)},
 horn(){const c=A.ok();if(!c)return;const n=c.currentTime,f=c.createBiquadFilter(),g=c.createGain();
   f.type="lowpass";f.frequency.value=1500;g.gain.setValueAtTime(.0001,n);
   g.gain.exponentialRampToValueAtTime(.045,n+.03);g.gain.setValueAtTime(.045,n+.4);
   g.gain.exponentialRampToValueAtTime(.0001,n+.58);f.connect(g);g.connect(A.master);
   for(const fr of[185,233]){const o=c.createOscillator();o.type="sawtooth";o.frequency.value=fr;
    o.connect(f);o.start(n);o.stop(n+.6)}},
 level(){const c=A.ok();if(!c)return;const n=c.currentTime;
   [660,880,1320].forEach((fr,i)=>{const s=n+i*.09,o=c.createOscillator(),g=c.createGain();
    o.type="triangle";o.frequency.value=fr;g.gain.setValueAtTime(.0001,s);
    g.gain.exponentialRampToValueAtTime(.05,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+.18);
    o.connect(g);g.connect(A.master);o.start(s);o.stop(s+.2)})}};

/* ---------- HUD ---------- */
function notify(msg,tone="info"){U.toast.textContent=msg;U.toast.dataset.t=tone;U.toast.classList.add("on");toastT=2}
function hud(){
 const s=Math.floor(P.score),hp=clamp(P.hp,0,100),ni=clamp(P.nitro,0,100);
 U.score.textContent=s.toLocaleString();U.best.textContent=Math.max(best,s).toLocaleString();
 U.dist.textContent=(P.dist/1000).toFixed(2)+" km";U.coins.textContent=P.coins;U.level.textContent=P.level;
 U.spd.textContent=Math.round(P.speed);U.fSpd.style.width=clamp(P.speed/MAX_SPEED*100,0,100)+"%";
 U.pace.textContent=Math.round(cruiseFor(P.dist));U.fPace.style.width=clamp(pace(P.dist)*100,0,100)+"%";
 U.hp.textContent=Math.ceil(hp)+"%";U.fHp.style.width=hp+"%";U.fHp.classList.toggle("low",hp<30);
 U.nit.textContent=Math.ceil(ni)+"%";U.fNit.style.width=ni+"%";
}
function saveBest(){const s=Math.floor(P.score);if(s<=best)return;best=s;try{localStorage.setItem(KEY,""+best)}catch(e){}}
const stats=()=>({score:Math.floor(P.score),dist:P.dist,coins:P.coins,best:Math.max(best,Math.floor(P.score)),
 level:P.level,top:Math.round(P.top),near:P.near,over:P.over,newBest:false});

/* ---------- overlay ---------- */
const tile=(l,v,h)=>`<div class="tile${h?" hl":""}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
function grid(s,full){let h=`<div class="grid">`+tile("SCORE",s.score.toLocaleString(),1)+
 tile("DISTANCE",(s.dist/1000).toFixed(2)+" km")+tile("LEVEL",s.level);
 if(full)h+=tile("TOP SPEED",s.top+" km/h")+tile("COINS",s.coins)+tile("NEAR MISS",s.near)+
  tile("OVERTAKES",s.over)+tile("BEST",s.best.toLocaleString());
 return h+`</div>`}
function overlay(st){
 clearInterval(cdId);cdId=0;
 if(!st){U.ov.classList.add("hide");return}
 let eb="",ti="",bt="",body="",foot="";
 if(st.kind==="menu"){
  eb="GAMEX PRESENTS";ti="🏍️ HIGHWAY RUSH 3D";bt="START RACE";
  foot="Press <b>Enter</b> or <b>Space</b> · Touch buttons work on mobile";
  body=`<p class="lead">Race a winding 3D highway. Weave between <b>bikes</b>, <b>cars</b> and heavy <b>trucks</b>,
   dodge cones, barriers and oil, grab coins and repair kits.</p>

/* ---------- particles ---------- */
function buildParticles(){

  parts.push({life:0,max:1,p:new THREE.Vector3(),v:new THREE.Vector3(),c:new THREE.Color()})}

 pGeo.setAttribute("color",new THREE.BufferAttribute(pCol,3).setUsage(THREE.DynamicDrawUsage));
 const pts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:.23,vertexColors:true,transparent:true,depthWrite:false}));

}
function burst(x,y,z,col,n){for(let i=0;i<n;i++){const p=parts[pcur++%PCOUNT];
 p.life=p.max=.25+Math.random()*.47;p.c.set(col);p.p.set(x,y,z);
 p.v.set((Math.random()-.5)*11,2+Math.random()*6,(Math.random()-.5)*11)}}
function updParticles(dt){
 for(let i=0;i<PCOUNT;i++){const p=parts[i],n=i*3;
  if(p.life>0){p.life-=dt;p.v.y-=9*dt;p.p.addScaledVector(p.v,dt);
   const b=Math.max(0,p.life/p.max);
   pPos[n]=p.p.x;pPos[n+1]=p.p.y;pPos[n+2]=p.p.z;
   pCol[n]=p.c.r*b;pCol[n+1]=p.c.g*b;pCol[n+2]=p.c.b*b}
  else pPos[n+1]=-1e4}
 pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
}

/* ---------- objects ---------- */
function place(o){

 o.group.position.set(center(o.z)+o.lat,y,o.z);

}
function push(o){objs.push(o);scene.add(o.group);place(o);return o}
function laneFree(lane,z,ign,extra){const x=LANES[lane];

  if(Math.abs(o.lat-x)>=2.2)continue;
  if(Math.abs(o.z-z)<20+o.hl+extra)return false}return true}
function wallOff(lane,z,hl){const set=new Set([lane]);

  if(Math.abs(o.z-z)<12+o.hl+hl)set.add(clamp(Math.round((o.lat+6)/4),0,3))}
 return set.size>=4}
function chooseLane(z,hl,order){
 for(const l of(order||shuffle([0,1,2,3]))){
  if(!laneFree(l,z,null,hl))continue;if(wallOff(l,z,hl))continue;return l}
 return null}
function kindFor(){const tr=Math.min(.3,.2+P.dist/20000),r=Math.random();

function spawnTraffic(kind,lane,z){

  base=rand(52,82);label=tk?"TANKER":"TRUCK"}
 base*=1+pace(P.dist)*TRAFFIC_SPEEDUP;
 push({type:"traffic",kind,label,group:rig.root,rig,lane,lat:LANES[lane],target:LANES[lane],
  z,pz:z,hit:false,hw:rig.hw,hl:rig.hl,speed:base,base,bonus:BONUS[kind],nit:NIT[kind],

function updTraffic(o,dt,rs){
 o.cool=Math.max(0,o.cool-dt);o.braking=false;
 let lead=null;
 if(!o.hit)for(const q of objs){
  if(q===o||(q.type!=="traffic"&&q.type!=="cone"&&q.type!=="barrier"))continue;
  if(q.z>=o.z||Math.abs(q.lat-o.lat)>q.hw+o.hw+.35)continue;
  const gap=o.z-o.hl-(q.z+q.hl);if(!lead||gap<lead.gap)lead={gap,sp:q.type==="traffic"?q.speed:0}}
 let blocked=false;
 if(lead&&lead.gap<30){
  const want=lead.gap<6?Math.max(0,lead.sp-10):lead.gap<18?lead.sp:lead.sp+(o.base-lead.sp)*(lead.gap-18)/12;
  const cap=Math.min(o.base,want);
  if(o.speed>cap+.3){o.speed=approach(o.speed,cap,(lead.gap<10?90:35)*dt);o.braking=true}
  else o.speed=approach(o.speed,cap,14*dt);
  blocked=o.base>lead.sp+4;
 }else o.speed=approach(o.speed,o.base,14*dt);
 const safe=l=>{if(l<0||l>3)return false;const x=LANES[l];
  for(const q of objs){if(q===o||isPick(q.type))continue;if(Math.abs(q.lat-x)>2.3)continue;
   const dz=q.z-o.z,re=o.hl+q.hl;
   if(q.type==="traffic"){if(dz>-(re+14)&&dz<re+10)return false}
   else if(dz>-(re+80)&&dz<re+4)return false}return true};
 if(blocked&&o.want===null&&o.cool<=0&&o.z<PLAYER_Z-35){
  const opt=[o.lane-1,o.lane+1].filter(safe);
  if(opt.length){o.want=pick(opt);o.sig=.7}else o.cool=.8}
 if(o.changeAt!==null&&o.want===null&&o.z>o.changeAt){
  const d=o.lane===0?1:o.lane===3?-1:Math.random()<.5?-1:1;o.want=o.lane+d;o.sig=.8;o.changeAt=null}
 if(o.want!==null){o.sig-=dt;
  if(o.sig<=0){if(o.z<PLAYER_Z-16&&safe(o.want)){o.lane=o.want;o.target=LANES[o.lane];o.cool=3.5}
   else o.cool=1.2;o.want=null}}
 o.z+=(rs-o.speed/3.6)*dt;
 o.lat+=(o.target-o.lat)*Math.min(1,dt*(o.kind==="bike"?1.6:o.kind==="car"?1.3:.9));
 const drift=o.target-o.lat;
 o.rig.lean.rotation.z=o.kind==="bike"?clamp(drift*-.045,-.18,.18):clamp(drift*.012,-.05,.05);
 const sig=o.want!==null?Math.sign(o.want-o.lane):Math.abs(drift)>.35?Math.sign(drift):0;
 const bl=Math.floor(wt*7)%2===0,hz=o.hit&&bl;
 if(o.rig.iL)o.rig.iL.visible=hz||(bl&&sig<0);
 if(o.rig.iR)o.rig.iR.visible=hz||(bl&&sig>0);
 if(o.rig.brake)o.rig.brake.visible=o.braking;
}
function updObjects(dt,rs){
 for(let i=objs.length-1;i>=0;i--){
  const o=objs[i];o.pz=o.z;
  if(o.type==="traffic")updTraffic(o,dt,rs);
  else{o.z+=rs*dt;if(isPick(o.type))o.group.rotation.y+=dt*(o.type==="coin"?3.4:1.2)}
  place(o);
  const dx=Math.abs(o.lat-P.lat);
  const lo=Math.min(o.pz,o.z),hi=Math.max(o.pz,o.z);
  const dz=PLAYER_Z<lo?lo-PLAYER_Z:PLAYER_Z>hi?PLAYER_Z-hi:0;
  let got=false;
  if(o.type==="coin"&&dx<1.05&&dz<1.8){P.coins++;P.score+=60;P.nitro=Math.min(100,P.nitro+3);
   burst(o.group.position.x,1.25,PLAYER_Z,0xffdc72,7);A.coin();got=true}
  else if(o.type==="health"&&dx<1.1&&dz<1.75){P.hp=Math.min(100,P.hp+28);P.score+=40;
   notify("🔧 Repair kit: bike health restored!","good");got=true}
  else if(o.type==="nitro"&&dx<1.1&&dz<1.75){P.nitro=Math.min(100,P.nitro+36);P.score+=40;
   notify("⚡ Nitro refilled!","good");got=true}
  if(got){scene.remove(o.group);objs.splice(i,1);continue}
  if(!o.hit&&mode==="playing"){
   if(o.type==="traffic"&&dx<o.hw+HIT_PAD&&dz<o.hl+.9){crashInto(o)}
   else if(o.type==="barrier"&&dx<1.48&&dz<1.3){o.hit=true;hurt(37,"💥 You hit a road barrier.")}
   else if(o.type==="cone"&&dx<.7&&dz<1.3){o.hit=true;hurt(17,"⚠️ Cone impact!",.7)}
   else if(o.type==="oil"&&dx<1.05&&dz<1.45){o.hit=true;P.slip=1.8;
    P.vx+=Math.random()<.5?-5:5;hurt(11,"🛢️ Oil spill! Counter-steer!",.5)}}
  if(o.type==="traffic"&&!o.passed&&o.z-o.hl>PLAYER_Z+1.2){
   o.passed=true;
   if(!o.hit&&mode==="playing"){P.over++;P.score+=15;
    const cl=dx-(o.hw+HIT_PAD);
    if(cl>0&&cl<1.35){P.near++;P.score+=o.bonus;P.nitro=Math.min(100,P.nitro+o.nit);
     notify(`🔥 NEAR MISS · ${o.label}  +${o.bonus}`,"good");if(o.kind==="truck")A.horn()}}}
  if(o.z-o.hl>PLAYER_Z+30||o.z<ROAD_MIN-40){scene.remove(o.group);objs.splice(i,1);continue}
  if(mode!=="playing")break;
 }
}

function gameOver(why,dir=Math.random()<.5?-1:1,inten=1.3){

 const res=stats(),prevBest=best;

 pending=res;cause=why;crashT=0;crashV=P.speed/3.6;crashDir=dir;crashSpin=0;
 P.hp=0;P.vx=0;P.boosting=false;clearKeys();
 shake=.9*inten;flash=1;A.crash(inten);A.upd(0,false,false);

function crashUpdate(dt){
 if(crashT<0)return;

 const tr=crashV*dt;crashV=Math.max(0,crashV-Math.max(crashV*2.6,8)*dt);P.speed=crashV*3.6;
 if(tr>0){P.dist+=tr;sync();asphalt.offset.y=(asphalt.offset.y-tr*.055)%1;
  updRibbons();updDeco(tr);updProps(tr)}
 const bl=Math.floor(wt*7)%2===0;
 for(const o of objs){o.z+=tr;
  if(o.type==="traffic"){o.z-=o.speed/3.6*dt;
   if(o.hit){o.speed=approach(o.speed,0,40*dt);
    if(o.rig.iL)o.rig.iL.visible=bl;if(o.rig.iR)o.rig.iR.visible=bl;
    if(o.rig.brake)o.rig.brake.visible=true}}
  place(o)}
 const fall=Math.min(1,crashT/.4),slide=crashV/40;
 crashSpin+=dt*(1.2+slide*3)*crashDir;
 P.lat=clamp(P.lat+crashDir*(2.5+slide*6)*dt*(1-fall*.5),-7.4,7.4);
 hero.root.position.set(center(PLAYER_Z)+P.lat,.28*fall,PLAYER_Z);
 hero.root.rotation.y=heading(PLAYER_Z)+crashSpin;

 if(crashV>2&&Math.random()<dt*45)burst(hero.root.position.x,.25,PLAYER_Z,0xffc266,2);

 if(pending&&crashT>=CRASH_SEQ){overAt=performance.now();U.toast.classList.remove("on");
  const r=pending;pending=null;overlay({kind:"over",stats:r,cause})}
}

/* ---------- camera & loop ---------- */
function updCamera(dt){

 camera.position.z+=(dz-camera.position.z)*Math.min(1,dt*2.7);
 if(shake>0){camera.position.x+=(Math.random()-.5)*shake;
  camera.position.y+=(Math.random()-.5)*shake*.55;shake=Math.max(0,shake-dt*1.35)}
 camera.lookAt(center(-30)+P.lat*.38,1.35,-30);
 camera.rotation.z-=P.vx*.0018;
 const base=asp<.75?88:asp<1.1?75:65;
 const want=base+clamp((P.speed-200)*.035,0,7)+(P.boosting?6:0);
 camera.fov+=(want-camera.fov)*Math.min(1,dt*2.8);camera.updateProjectionMatrix();
 sky.position.copy(camera.position);

function idle(dt){

function update(dt){
 wt+=dt;P.inv=Math.max(0,P.inv-dt);P.slip=Math.max(0,P.slip-dt);
 const braking=held("brake"),boosting=held("boost")&&!braking&&P.nitro>.5;
 P.boosting=boosting;
 const cruise=cruiseFor(P.dist),lvl=1+Math.floor((cruise-BASE_CRUISE)/STEP);
 if(lvl>P.level){P.level=lvl;
  notify(cruise>=MAX_CRUISE?`🔥 MAX PACE — ${MAX_CRUISE} km/h!`:`⚡ LEVEL ${lvl} — SPEED UP! ${Math.round(cruise)} km/h`,"good");
  A.level()}
 const want=braking?BRAKE_SPEED:boosting?Math.min(MAX_SPEED,cruise+NITRO):cruise;
 P.speed=approach(P.speed,want,(braking?120:boosting?95:34)*dt);
 P.top=Math.max(P.top,P.speed);
 if(boosting)P.nitro=Math.max(0,P.nitro-22*dt);
 else P.nitro=Math.min(100,P.nitro+(braking?5:3)*dt);
 const steer=(held("right")?1:0)-(held("left")?1:0),slip=P.slip>0;

 P.vx*=Math.exp(-(slip?1.6:steer?4.2:8.2)*dt);

 P.vx=clamp(P.vx,-15.5,15.5);P.lat+=P.vx*dt;
 if(Math.abs(P.lat)>7.55){P.lat=clamp(P.lat,-7.55,7.55);
  if(Math.abs(P.vx)>2.2)hurt(9,"⚠️ You scraped the roadside rail!",.6);P.vx*=-.3}
 if(mode!=="playing")return;
 const rs=P.speed/3.6,tr=rs*dt;
 P.dist+=tr;sync();P.score+=tr*(1.6+P.speed/250);
 asphalt.offset.y=(asphalt.offset.y-tr*.055)%1;
 updRibbons();updDeco(tr);updProps(tr);
 hero.root.position.set(center(PLAYER_Z)+P.lat,Math.sin(wt*17)*.012,PLAYER_Z);
 hero.root.rotation.y=heading(PLAYER_Z)-P.vx*.012;
 hero.lean.rotation.z+=(clamp(-P.vx*.05,-.33,.33)-hero.lean.rotation.z)*Math.min(1,dt*9);

 if(hero.flame){hero.flame.visible=boosting;hero.flame.scale.y=.72+Math.random()*.6}
 if(hero.brake)hero.brake.visible=braking;
 if(boosting&&Math.random()<dt*30)burst(hero.root.position.x,.78,PLAYER_Z+1.7,0x6edbff,1);
 spawnM-=tr;coinM-=tr;supM-=tr;
 if(spawnM<=0){spawnEvent();spawnM=Math.max(26,54-P.dist/120)*rand(.8,1.2)}
 if(coinM<=0){const l=chooseLane(SPAWN_Z+25,4);
  if(l!==null)for(let i=0;i<3;i++)spawnPickup("coin",l,SPAWN_Z+25-i*6);
  coinM=rand(95,140)}
 if(supM<=0){const l=chooseLane(SPAWN_Z+15,1);
  if(l!==null)spawnPickup(P.hp<68?"health":"nitro",l,SPAWN_Z+15);supM=rand(480,640)}
 updObjects(dt,rs);
 if(mode!=="playing")return;
 updParticles(dt);updCamera(dt);
 if(toastT>0){toastT-=dt;if(toastT<=0)U.toast.classList.remove("on")}
 flash=Math.max(0,flash-dt*1.9);U.flash.style.opacity=flash*.62;
 U.panel.classList.toggle("boost",boosting);
 uiT+=dt;if(uiT>=.08){uiT=0;hud();A.upd(P.speed,true,boosting)}
}
function resize(){
 if(!renderer)return;const asp=innerWidth/innerHeight;
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,MOBILE?1.3:1.8));
 renderer.setSize(innerWidth,innerHeight,false);
 camera.aspect=asp;camera.fov=asp<.75?88:asp<1.1?75:65;camera.updateProjectionMatrix();
}
function loop(t){
 requestAnimationFrame(loop);
 const dt=prev?Math.min((t-prev)/1000,.045):0;prev=t;
 if(mode==="playing")update(dt);else if(mode==="menu")idle(dt);else if(mode==="over")crashUpdate(dt);
 renderer.render(scene,camera);
}

/* ---------- input ---------- */
const keyOf=c=>({ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",
 ArrowUp:"boost",KeyW:"boost",Space:"boost",ShiftLeft:"boost",ShiftRight:"boost",
 ArrowDown:"brake",KeyS:"brake"})[c]||null;
function bindInput(){
 addEventListener("keydown",e=>{
  const k=keyOf(e.code);
  if(k){e.preventDefault();
   if(mode==="playing")keys[k]=1;
   else if(e.code==="Space"&&!e.repeat&&mode!=="paused")action();
   return}
  if((e.code==="KeyP"||e.code==="Escape")&&!e.repeat){e.preventDefault();
   mode==="playing"?pauseGame():mode==="paused"&&resume();return}
  if(e.code==="KeyM"&&!e.repeat){muteToggle();return}
  if(e.code==="Enter"&&!e.repeat&&mode!=="playing"){e.preventDefault();action()}
 });
 addEventListener("keyup",e=>{const k=keyOf(e.code);if(k){keys[k]=0;e.preventDefault()}});
 document.querySelectorAll("[data-c]").forEach(b=>{
  const n=b.dataset.c;
  b.addEventListener("pointerdown",e=>{e.preventDefault();if(mode!=="playing")return;
   touch[n].add(e.pointerId);try{b.setPointerCapture(e.pointerId)}catch(_){}});
  const up=e=>touch[n].delete(e.pointerId);
  b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);
  b.addEventListener("lostpointercapture",up);
  b.addEventListener("contextmenu",e=>e.preventDefault());
 });
 U.pause.onclick=()=>{U.pause.blur();mode==="playing"?pauseGame():mode==="paused"&&resume()};
 U.sound.onclick=()=>{U.sound.blur();muteToggle()};
 addEventListener("blur",()=>{clearKeys();if(mode==="playing")pauseGame()});
 document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="playing")pauseGame()});
 addEventListener("resize",resize);
 addEventListener("beforeunload",saveBest);
}
function muteToggle(){A.muted=!A.muted;U.sound.textContent=A.muted?"🔇":"🔊";
 if(!A.muted&&mode==="playing")A.start();A.upd(P.speed,mode==="playing",P.boosting)}

/* ---------- boot ---------- */
function init(){
 renderer=new THREE.WebGLRenderer({canvas,antialias:!MOBILE,powerPreference:"high-performance"});
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.38;
 renderer.shadowMap.enabled=!MOBILE;renderer.shadowMap.type=THREE.PCFShadowMap;
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0xa7b4ae,95,300);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.5,900);
 camera.position.set(-1,6.25,18);camera.lookAt(-1,1.35,-30);
 scene.add(new THREE.HemisphereLight(0xd7eaff,0x546347,2.1));
 const sun=new THREE.DirectionalLight(0xffe2b9,2.35);
 sun.position.set(-48,75,-22);sun.target.position.set(0,0,-22);
 sun.castShadow=!MOBILE;sun.shadow.mapSize.set(1024,1024);
 Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:170});
 sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
 scene.add(sun);scene.add(sun.target);
 buildKit();
 T={bike:mkBike(),sedan:mkCar("sedan"),suv:mkCar("suv"),taxi:mkCar("taxi"),
    truck:mkTruck(false),tanker:mkTruck(true)};
 mkSky();buildWorld();buildParticles();
 hero=inst(T.bike,0x31c9f4);scene.add(hero.root);
 resize();
}
try{
 init();bindInput();reset();setMode("menu");overlay({kind:"menu"});requestAnimationFrame(loop);
}catch(err){
 console.error(err);
 overlay({kind:"error",title:"3D GAME COULD NOT START",
  msg:"WebGL could not start. Enable hardware acceleration or try another browser, then reload."});
 $("act").onclick=()=>location.reload();
}
</script>
