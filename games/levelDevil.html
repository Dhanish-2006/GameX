<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devil's Door</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#1f2430;--panel:#f6f8f9;--muted:#5b6670;--accent:#d63a3a;--bg:#dfe6ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef2f4;--panel:#1d2329;--muted:#a3afb8;--bg:#10151a}}
:root[data-theme="dark"]{--ink:#eef2f4;--panel:#1d2329;--muted:#a3afb8;--bg:#10151a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:6px}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-weight:700;pointer-events:none}
#sk{pointer-events:auto;display:none;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:6px 12px;font:inherit}
button{cursor:pointer;font:inherit}
#pads{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#pads div{display:flex;gap:10px}
#pads button{pointer-events:auto;width:78px;height:78px;border-radius:20px;border:0;font-size:28px;color:#fff;background:rgba(31,36,48,.7);touch-action:none}
#pads button.on{background:var(--accent)}
@media (hover:none){#pads{display:flex}}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,18,.5);padding:16px}
#ov.h{display:none}
.panel{background:var(--panel);border-radius:18px;padding:24px 26px;max-width:360px;text-align:center}
h1{margin:0 0 8px;font-size:32px;color:var(--accent)}
.panel p{margin:0 0 16px;color:var(--muted);line-height:1.5}
#go{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 26px;font-size:18px;font-weight:700}
#go:focus-visible,#sk:focus-visible,#pads button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="lv"></span><button id="sk">Skip level</button></div>
<div id="pads"><div><button id="bl" aria-label="Left">◀</button><button id="br" aria-label="Right">▶</button></div><button id="bj" aria-label="Jump">▲</button></div>
<div id="ov"><div class="panel"><h1 id="t">Devil's Door</h1><p id="m">Reach the door. Trust nothing. Floors vanish, spikes appear and the door has its own plans. Move with A and D or the arrow keys, jump with W, Up or Space.</p><button id="go">Start</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const F=['S',0,380,800,70];
/* objects: [kind,x,y,w,h,opts]  S solid, K spike, D door, R silent trigger
   opts: t=[x,y,w,h] trigger area, hide/show/rev on trigger, mx/my+s move, d=spike points down, fk=fake door */
const LV=[
 {n:'Warm up',o:[['S',0,380,300,70],['S',380,380,420,70],['D',730,336,30,44]]},
 {n:'Floor is lava, almost',o:[['S',0,380,450,70],['S',450,380,90,70,{t:[430,300,110,90],hide:1}],['S',540,380,260,70],['D',730,336,30,44]]},
 {n:'Hello, spikes',o:[F,['K',300,360,40,20,{show:1,t:[240,300,60,80]}],['K',520,360,40,20],['D',730,336,30,44]]},
 {n:'Incoming',o:[F,['K',790,356,24,24,{t:[100,300,700,80],mx:-760,s:420}],['D',730,336,30,44]]},
 {n:'Left is right',o:[['S',0,380,430,70],['S',520,380,280,70],['R',0,0,0,0,{t:[300,300,40,80],rev:1}],['D',730,336,30,44]]},
 {n:'Come back here',o:[F,['D',560,336,30,44,{t:[400,300,170,80],mx:170,s:260}],['K',650,360,40,20,{show:1,t:[600,300,60,80]}]]},
 {n:'Look up',o:[F,['K',300,40,40,24,{d:1,t:[270,300,100,80],my:320,s:700}],['K',520,40,40,24,{d:1,t:[490,300,100,80],my:320,s:700}],['D',730,336,30,44]]},
 {n:'Trust fall',o:[['S',0,380,300,70],['S',560,380,240,70],['S',410,330,60,14,{show:1,t:[300,250,110,160]}],['D',730,336,30,44]]},
 {n:'Which door?',o:[F,['D',450,336,30,44,{fk:1}],['D',730,336,30,44]]},
 {n:'Everything',o:[['S',0,380,260,70],['S',340,380,120,70],['S',460,380,90,70,{t:[440,300,110,90],hide:1}],['S',550,380,250,70],['R',0,0,0,0,{t:[400,300,30,80],rev:1}],['K',620,360,40,20,{show:1,t:[570,300,50,80]}],['D',690,336,30,44,{t:[640,300,60,80],mx:80,s:300}]]}
];
let fl=0,cur=0,O=[],p,rev=false,dead=0,deaths=0,fails=0,state='menu',S=1;
const keys={l:0,r:0,j:0};
try{cur=Math.min(+localStorage.getItem('dd-lv')||0,LV.length-1)}catch(e){}
function resize(){const d=Math.min(devicePixelRatio||1,2);S=Math.min(innerWidth/800,innerHeight/450,2);cv.style.width=800*S+'px';cv.style.height=450*S+'px';cv.width=800*S*d;cv.height=450*S*d;ctx.setTransform(S*d,0,0,S*d,0,0);}
addEventListener('resize',resize);resize();
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function load(i){
  cur=i;O=LV[i].o.map(([k,x,y,w,h,q={}])=>({k,x,y,w,h,...q,x0:x,y0:y,vis:!q.show,on:false}));
  p={x:40,y:356,w:18,h:24,vx:0,vy:0,g:false,f:1};rev=false;dead=0;
  $('lv').textContent='Level '+(i+1)+' / '+LV.length+' · Deaths '+deaths;
  $('sk').style.display=fails>=5?'block':'none';
  try{localStorage.setItem('dd-lv',i)}catch(e){}
}
function die(){if(!dead){dead=.7;deaths++;fails++;}}
function win(){
  fails=0;
  if(cur+1>=LV.length){state='end';cur=0;try{localStorage.setItem('dd-lv',0)}catch(e){}
    $('t').textContent='You escaped!';$('m').textContent='All '+LV.length+' levels cleared with '+deaths+' deaths.';$('go').textContent='Play again';$('ov').classList.remove('h');deaths=0;}
  else load(cur+1);
}
function step(dt){
  if(dead){dead-=dt;if(dead<=0)load(cur);return;}
  fl=Math.max(0,fl-dt);const dir=(keys.r-keys.l)*(rev?-1:1);
  p.vx=dir*310;if(dir)p.f=dir;p.vy=Math.min(p.vy+1800*dt,900);
  if(keys.j&&!p.jp)p.jb=.12;p.jp=keys.j;p.jb=Math.max(0,(p.jb||0)-dt);
  p.cy=p.g?.1:Math.max(0,(p.cy||0)-dt);
  if(p.jb>0&&p.cy>0){p.vy=-600;p.jb=0;p.cy=0;p.g=false;}
  if(!keys.j&&p.vy<-300)p.vy=-300;
  const sol=O.filter(o=>o.k==='S'&&o.vis);
  p.x+=p.vx*dt;
  for(const s of sol)if(hit(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;}
  p.y+=p.vy*dt;p.g=false;
  for(const s of sol)if(hit(p,s)){if(p.vy>0){p.y=s.y-p.h;p.g=true;}else p.y=s.y+s.h;p.vy=0;}
  p.x=Math.max(0,Math.min(782,p.x));
  for(const o of O){
    if(o.t&&!o.on&&hit(p,{x:o.t[0],y:o.t[1],w:o.t[2],h:o.t[3]})){o.on=true;if(o.hide)o.vis=false;if(o.show)o.vis=true;if(o.rev){rev=true;fl=.9;}}
    if(o.on&&(o.mx||o.my)){
      const tx=o.x0+(o.mx||0),ty=o.y0+(o.my||0),st=o.s*dt;
      for(const [a,b] of [['x',tx],['y',ty]]){const d=b-o[a];o[a]=Math.abs(d)<=st?b:o[a]+Math.sign(d)*st;}
    }
    if(o.k==='K'&&o.vis&&hit(p,{x:o.x+4,y:o.y+5,w:o.w-8,h:o.h-8}))die();
    if(o.k==='D'&&hit(p,o)){if(o.fk)die();else{win();return;}}
  }
  if(p.y>520)die();
}
function draw(){
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg')||'#dfe6ea';ctx.fillRect(0,0,800,450);
  ctx.fillStyle='rgba(120,130,140,.35)';ctx.font='700 22px Trebuchet MS,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(LV[cur].n,400,60);
  if(fl>0){ctx.fillStyle='#d63a3a';ctx.font='700 30px Trebuchet MS,system-ui,sans-serif';ctx.fillText('Controls reversed!',400,120);}
  for(const o of O){
    if(!o.vis)continue;
    if(o.k==='S'){ctx.fillStyle='#1f2430';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#3a4254';ctx.fillRect(o.x,o.y,o.w,4);}
    else if(o.k==='K'){ctx.fillStyle='#d63a3a';const n=Math.max(1,Math.round(o.w/14)),w=o.w/n;
      for(let i=0;i<n;i++){ctx.beginPath();if(o.d){ctx.moveTo(o.x+i*w,o.y);ctx.lineTo(o.x+(i+1)*w,o.y);ctx.lineTo(o.x+(i+.5)*w,o.y+o.h);}
        else{ctx.moveTo(o.x+i*w,o.y+o.h);ctx.lineTo(o.x+(i+1)*w,o.y+o.h);ctx.lineTo(o.x+(i+.5)*w,o.y);}ctx.fill();}}
    else if(o.k==='D'){ctx.fillStyle='#5a3417';ctx.fillRect(o.x-3,o.y-3,o.w+6,o.h+3);ctx.fillStyle='#9a5d2b';ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#f2c14e';ctx.beginPath();ctx.arc(o.x+o.w-7,o.y+o.h/2,3,0,7);ctx.fill();}
  }
  if(dead&&dead>.5)return;
  ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);if(dead)ctx.rotate((.7-dead)*8);
  ctx.fillStyle='#ffb703';ctx.fillRect(-9,-12,18,24);
  ctx.fillStyle='#d63a3a';ctx.beginPath();ctx.moveTo(-9,-12);ctx.lineTo(-5,-19);ctx.lineTo(-1,-12);ctx.moveTo(9,-12);ctx.lineTo(5,-19);ctx.lineTo(1,-12);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(p.f>0?0:-8,-6,8,6);ctx.fillStyle='#1f2430';ctx.fillRect(p.f>0?4:-6,-4,3,4);
  ctx.restore();
}
let last=0;
function frame(t){
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  if(state==='play'){step(dt/2);step(dt/2);}
  draw();requestAnimationFrame(frame);
}
function start(){if(state==='play')return;state='play';$('ov').classList.add('h');load(cur);}
$('go').onclick=start;
$('sk').onclick=()=>{fails=0;load(Math.min(cur+1,LV.length-1));};
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
addEventListener('keydown',e=>{if(km[e.code]){keys[km[e.code]]=1;e.preventDefault();}if(e.code==='Enter'&&state!=='play')start();});
addEventListener('keyup',e=>{if(km[e.code])keys[km[e.code]]=0;});
addEventListener('blur',()=>{keys.l=keys.r=keys.j=0;});
document.addEventListener('visibilitychange',()=>{keys.l=keys.r=keys.j=0;});
[['bl','l'],['br','r'],['bj','j']].forEach(([id,k])=>{const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;b.classList.add('on');b.setPointerCapture(e.pointerId);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=0;b.classList.remove('on');}));
  b.addEventListener('contextmenu',e=>e.preventDefault());});
load(cur);requestAnimationFrame(frame);
</script></body></html>
