<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameX - Snake</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #172554,
                    #08080d 65%
                );

            color: white;

            padding: 20px;

        }

        .game-container {

            width: 100%;

            max-width: 650px;

            text-align: center;

        }

        .back-btn {

            display: inline-block;

            margin-bottom: 20px;

            padding: 10px 18px;

            border-radius: 8px;

            background: #171720;

            border: 1px solid #30303c;

            color: white;

            text-decoration: none;

            font-size: 14px;

        }

        .back-btn:hover {

            border-color: #8b5cf6;

        }

        h1 {

            font-size: 42px;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #8b5cf6,
                    #ec4899
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }

        .subtitle {

            color: #9999a5;

            margin-bottom: 20px;

        }

        .score-board {

            display: flex;

            justify-content: center;

            gap: 40px;

            margin-bottom: 15px;

            font-size: 17px;

        }

        .score {

            color: #a78bfa;

            font-weight: bold;

        }

        canvas {

            display: block;

            width: 100%;

            max-width: 500px;

            height: auto;

            margin: auto;

            background: #050509;

            border: 3px solid #7c3aed;

            border-radius: 10px;

            box-shadow:
                0 0 30px rgba(
                    124,
                    58,
                    237,
                    0.25
                );

        }

        .controls {

            margin-top: 20px;

            color: #888894;

            font-size: 14px;

            line-height: 1.7;

        }

        .bomb-info {

            margin-top: 8px;

            color: #ff5555;

            font-weight: bold;

        }

        .restart-btn {

            margin-top: 18px;

            padding: 12px 25px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    90deg,
                    #7c3aed,
                    #db2777
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

        }

        .restart-btn:hover {

            transform: translateY(-2px);

        }

    </style>

</head>


<body>


    <div class="game-container">


        <a href="../index.html"
            class="back-btn">

            ← Back to GameX

        </a>


        <h1>🐍 Snake</h1>


        <p class="subtitle">

            Eat the food. Grow longer.
            Don't hit yourself or the bombs!

        </p>


        <div class="score-board">

            <div>

                Score:

                <span
                    id="score"
                    class="score">

                    0

                </span>

            </div>


            <div>

                High Score:

                <span
                    id="highScore"
                    class="score">

                    0

                </span>

            </div>

        </div>


        <canvas
            id="gameCanvas"
            width="500"
            height="500">

        </canvas>


        <div class="controls">

            🎮 Use
            <b>Arrow Keys</b>
            or
            <b>W A S D</b>
            to move.

            <br>

            💣 Avoid all 3 bombs!

        </div>


        <div class="bomb-info">

            💣 Bombs: <span id="bombCount">3</span>

        </div>


        <button
            class="restart-btn"
            id="restartBtn">

            🔄 Restart Game

        </button>


    </div>


    <script>


        const canvas =
            document.getElementById(
                "gameCanvas"
            );

        const ctx =
            canvas.getContext("2d");


        const gridSize = 25;

        const tileCount =
            canvas.width / gridSize;


        let snake;

        let food;

        let bombs = [];

        let dx;

        let dy;

        let nextDx;

        let nextDy;

        let directionChanged;

        let score;

        let gameRunning;


        // Higher number = slower

        const gameSpeed = 220;


        let highScore =
            Number(
                localStorage.getItem(
                    "gamex-snake-highscore"
                )
            ) || 0;


        document.getElementById(
            "highScore"
        ).textContent = highScore;



        // =========================
        // START GAME
        // =========================

        function startGame() {


            snake = [

                {
                    x: 10,
                    y: 10
                },

                {
                    x: 9,
                    y: 10
                },

                {
                    x: 8,
                    y: 10
                }

            ];


            dx = 1;

            dy = 0;


            nextDx = 1;

            nextDy = 0;


            directionChanged = false;


            score = 0;


            gameRunning = true;


            document.getElementById(
                "score"
            ).textContent = score;


            generateFood();


            generateBombs();


            document.getElementById(
                "bombCount"
            ).textContent = 3;


            drawGame();

        }



        // =========================
        // GENERATE FOOD
        // =========================

        function generateFood() {


            food = {

                x: Math.floor(
                    Math.random() *
                    tileCount
                ),

                y: Math.floor(
                    Math.random() *
                    tileCount
                )

            };


            for (let part of snake) {

                if (
                    part.x === food.x &&
                    part.y === food.y
                ) {

                    generateFood();

                    return;

                }

            }


            // Don't put food on a bomb

            for (let bomb of bombs) {

                if (
                    bomb.x === food.x &&
                    bomb.y === food.y
                ) {

                    generateFood();

                    return;

                }

            }

        }



        // =========================
        // GENERATE EXACTLY 3 BOMBS
        // =========================

        function generateBombs() {


            bombs = [];


            while (bombs.length < 3) {


                const bomb = {

                    x: Math.floor(
                        Math.random() *
                        tileCount
                    ),

                    y: Math.floor(
                        Math.random() *
                        tileCount
                    )

                };


                let valid = true;


                // Don't spawn on snake

                for (let part of snake) {

                    if (
                        part.x === bomb.x &&
                        part.y === bomb.y
                    ) {

                        valid = false;

                        break;

                    }

                }


                // Don't spawn too close
                // to the snake head

                if (
                    Math.abs(
                        bomb.x - snake[0].x
                    ) <= 2 &&
                    Math.abs(
                        bomb.y - snake[0].y
                    ) <= 2
                ) {

                    valid = false;

                }


                // Don't duplicate bombs

                for (let other of bombs) {

                    if (
                        other.x === bomb.x &&
                        other.y === bomb.y
                    ) {

                        valid = false;

                        break;

                    }

                }


                if (valid) {

                    bombs.push(bomb);

                }

            }

        }



        // =========================
        // DRAW GAME
        // =========================

        function drawGame() {


            ctx.fillStyle = "#050509";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // =========================
            // GRID
            // =========================

            ctx.strokeStyle = "#11111a";


            for (
                let i = 0;
                i <= tileCount;
                i++
            ) {


                ctx.beginPath();

                ctx.moveTo(
                    i * gridSize,
                    0
                );

                ctx.lineTo(
                    i * gridSize,
                    canvas.height
                );

                ctx.stroke();


                ctx.beginPath();

                ctx.moveTo(
                    0,
                    i * gridSize
                );

                ctx.lineTo(
                    canvas.width,
                    i * gridSize
                );

                ctx.stroke();

            }



            // =========================
            // FOOD
            // =========================

            ctx.fillStyle = "#ec4899";


            ctx.beginPath();


            ctx.arc(

                food.x * gridSize +
                    gridSize / 2,

                food.y * gridSize +
                    gridSize / 2,

                gridSize / 2 - 4,

                0,

                Math.PI * 2

            );


            ctx.fill();



            // =========================
            // BOMBS
            // =========================

            bombs.forEach(
                (bomb) => {


                    const centerX =
                        bomb.x *
                        gridSize +
                        gridSize / 2;


                    const centerY =
                        bomb.y *
                        gridSize +
                        gridSize / 2;


                    // Red glow

                    ctx.shadowColor =
                        "#ff2222";

                    ctx.shadowBlur = 12;


                    // Bomb body

                    ctx.fillStyle =
                        "#111111";


                    ctx.beginPath();

                    ctx.arc(

                        centerX,

                        centerY,

                        9,

                        0,

                        Math.PI * 2

                    );

                    ctx.fill();


                    // Red outline

                    ctx.strokeStyle =
                        "#ff3333";

                    ctx.lineWidth = 2;


                    ctx.beginPath();

                    ctx.arc(

                        centerX,

                        centerY,

                        9,

                        0,

                        Math.PI * 2

                    );

                    ctx.stroke();


                    // Fuse

                    ctx.shadowBlur = 0;


                    ctx.strokeStyle =
                        "#b87333";

                    ctx.lineWidth = 2;


                    ctx.beginPath();

                    ctx.moveTo(
                        centerX + 5,
                        centerY - 7
                    );

                    ctx.lineTo(
                        centerX + 9,
                        centerY - 12
                    );

                    ctx.stroke();


                    // Fire

                    ctx.fillStyle =
                        "#ffcc00";


                    ctx.beginPath();

                    ctx.arc(

                        centerX + 10,

                        centerY - 13,

                        3,

                        0,

                        Math.PI * 2

                    );

                    ctx.fill();


                    // Reset shadow

                    ctx.shadowBlur = 0;

                }
            );



            // =========================
            // SNAKE
            // =========================

            snake.forEach(
                (part, index) => {


                    ctx.fillStyle =
                        index === 0
                            ? "#a78bfa"
                            : "#7c3aed";


                    ctx.fillRect(

                        part.x *
                            gridSize + 2,

                        part.y *
                            gridSize + 2,

                        gridSize - 4,

                        gridSize - 4

                    );


                    // Snake head eyes

                    if (index === 0) {


                        ctx.fillStyle =
                            "white";


                        let eyeX1;
                        let eyeY1;

                        let eyeX2;
                        let eyeY2;


                        if (dx === 1) {

                            eyeX1 =
                                part.x *
                                gridSize + 17;

                            eyeY1 =
                                part.y *
                                gridSize + 8;

                            eyeX2 =
                                part.x *
                                gridSize + 17;

                            eyeY2 =
                                part.y *
                                gridSize + 17;

                        }

                        else if (dx === -1) {

                            eyeX1 =
                                part.x *
                                gridSize + 8;

                            eyeY1 =
                                part.y *
                                gridSize + 8;

                            eyeX2 =
                                part.x *
                                gridSize + 8;

                            eyeY2 =
                                part.y *
                                gridSize + 17;

                        }

                        else if (dy === -1) {

                            eyeX1 =
                                part.x *
                                gridSize + 8;

                            eyeY1 =
                                part.y *
                                gridSize + 8;

                            eyeX2 =
                                part.x *
                                gridSize + 17;

                            eyeY2 =
                                part.y *
                                gridSize + 8;

                        }

                        else {

                            eyeX1 =
                                part.x *
                                gridSize + 8;

                            eyeY1 =
                                part.y *
                                gridSize + 17;

                            eyeX2 =
                                part.x *
                                gridSize + 17;

                            eyeY2 =
                                part.y *
                                gridSize + 17;

                        }


                        ctx.beginPath();

                        ctx.arc(
                            eyeX1,
                            eyeY1,
                            2,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();


                        ctx.beginPath();

                        ctx.arc(
                            eyeX2,
                            eyeY2,
                            2,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();

                    }

                }
            );

        }



        // =========================
        // UPDATE GAME
        // =========================

        function updateGame() {


            if (!gameRunning) {

                return;

            }


            // Apply direction

            dx = nextDx;

            dy = nextDy;


            directionChanged = false;


            const head = {

                x: snake[0].x + dx,

                y: snake[0].y + dy

            };



            // =========================
            // WALL COLLISION
            // =========================

            if (

                head.x < 0 ||

                head.x >= tileCount ||

                head.y < 0 ||

                head.y >= tileCount

            ) {

                endGame(
                    "💥 You hit the wall!"
                );

                return;

            }



            // =========================
            // BODY COLLISION
            // =========================

            for (
                let part of snake
            ) {


                if (

                    head.x === part.x &&

                    head.y === part.y

                ) {

                    endGame(
                        "🐍 You hit yourself!"
                    );

                    return;

                }

            }



            // =========================
            // BOMB COLLISION
            // =========================

            for (
                let bomb of bombs
            ) {


                if (

                    head.x === bomb.x &&

                    head.y === bomb.y

                ) {

                    endGame(
                        "💣 BOOM! You ate a bomb!"
                    );

                    return;

                }

            }



            // Add new head

            snake.unshift(head);



            // =========================
            // FOOD COLLISION
            // =========================

            if (

                head.x === food.x &&

                head.y === food.y

            ) {


                score++;


                document.getElementById(
                    "score"
                ).textContent = score;



                // High score

                if (
                    score > highScore
                ) {


                    highScore = score;


                    localStorage.setItem(

                        "gamex-snake-highscore",

                        highScore

                    );


                    document.getElementById(
                        "highScore"
                    ).textContent =
                        highScore;

                }


                generateFood();

            }

            else {

                snake.pop();

            }

        }



        // =========================
        // GAME OVER
        // =========================

        function endGame(
            reason = "GAME OVER"
        ) {


            gameRunning = false;


            ctx.fillStyle =
                "rgba(0, 0, 0, 0.72)";


            ctx.fillRect(

                0,

                0,

                canvas.width,

                canvas.height

            );


            ctx.fillStyle = "white";


            ctx.font =
                "bold 38px Arial";


            ctx.textAlign =
                "center";


            ctx.fillText(

                "GAME OVER",

                canvas.width / 2,

                canvas.height / 2 - 35

            );


            ctx.font =
                "bold 18px Arial";


            ctx.fillStyle =
                "#ff5555";


            ctx.fillText(

                reason,

                canvas.width / 2,

                canvas.height / 2 + 5

            );


            ctx.font =
                "16px Arial";


            ctx.fillStyle =
                "#aaaab5";


            ctx.fillText(

                "Press Restart to play again",

                canvas.width / 2,

                canvas.height / 2 + 40

            );

        }



        // =========================
        // GAME LOOP
        // =========================

        function gameLoop() {

            updateGame();

            drawGame();

        }



        // =========================
        // KEYBOARD CONTROLS
        // =========================

        document.addEventListener(
            "keydown",
            event => {


                const key =
                    event.key.toLowerCase();


                // Prevent page scrolling

                if (

                    key === "arrowup" ||

                    key === "arrowdown" ||

                    key === "arrowleft" ||

                    key === "arrowright" ||

                    key === "w" ||

                    key === "a" ||

                    key === "s" ||

                    key === "d"

                ) {

                    event.preventDefault();

                }


                // Only one direction
                // change per game tick

                if (
                    directionChanged
                ) {

                    return;

                }



                // UP

                if (

                    key === "arrowup" ||

                    key === "w"

                ) {


                    if (dy !== 1) {

                        nextDx = 0;

                        nextDy = -1;

                        directionChanged =
                            true;

                    }

                }



                // DOWN

                else if (

                    key === "arrowdown" ||

                    key === "s"

                ) {


                    if (dy !== -1) {

                        nextDx = 0;

                        nextDy = 1;

                        directionChanged =
                            true;

                    }

                }



                // LEFT

                else if (

                    key === "arrowleft" ||

                    key === "a"

                ) {


                    if (dx !== 1) {

                        nextDx = -1;

                        nextDy = 0;

                        directionChanged =
                            true;

                    }

                }



                // RIGHT

                else if (

                    key === "arrowright" ||

                    key === "d"

                ) {


                    if (dx !== -1) {

                        nextDx = 1;

                        nextDy = 0;

                        directionChanged =
                            true;

                    }

                }

            }
        );



        // =========================
        // RESTART
        // =========================

        document.getElementById(
            "restartBtn"
        ).addEventListener(
            "click",
            startGame
        );



        // =========================
        // START
        // =========================

        startGame();



        // =========================
        // GAME LOOP TIMER
        // =========================

        setInterval(
            gameLoop,
            gameSpeed
        );


    </script>

</body>

</html>
