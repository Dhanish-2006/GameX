<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Platform Adventure</title>

<style>
:root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#07111f;
    --fg:#fff;
    --mut:#c6ceda
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--fg);
    font-family:system-ui,Arial,sans-serif;
    user-select:none;
    touch-action:none
}

canvas{
    display:block;
    width:100%;
    height:100%
}

#hud{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top,0px));
    left:12px;
    right:12px;
    z-index:5;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:space-between;
    pointer-events:none
}

.hb{
    background:rgba(5,10,20,.8);
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    padding:8px 12px;
    font-weight:700;
    font-size:14px;
    backdrop-filter:blur(8px)
}

.bar{
    width:140px;
    height:11px;
    background:#252b35;
    border-radius:20px;
    overflow:hidden;
    margin-top:5px
}

#hf{
    height:100%;
    width:100%;
    background:#27e36a;
    transition:width .15s
}

.ov{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.72)
}

.pn{
    width:min(90%,480px);
    padding:30px;
    text-align:center;
    background:rgba(12,19,33,.96);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px
}

.pn h1{
    font-size:32px;
    margin-bottom:14px
}

.pn p{
    color:var(--mut);
    line-height:1.7;
    margin-bottom:22px;
    font-size:15px
}

button{
    border:0;
    border-radius:12px;
    padding:13px 28px;
    background:#7657ed;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer
}

.hidden{
    display:none!important
}

#mc{
    position:fixed;
    left:14px;
    right:14px;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    z-index:10;
    display:none;
    justify-content:space-between;
    pointer-events:none
}

.g{
    display:flex;
    gap:12px
}

.mb{
    pointer-events:auto;
    width:64px;
    height:64px;
    border-radius:50%;
    background:rgba(10,15,28,.8);
    border:1px solid rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    touch-action:none
}

.mb:active{
    background:rgba(120,90,240,.7)
}

@media(pointer:coarse){
    #mc{
        display:flex
    }
}

@media(max-width:600px){
    .hb{
        font-size:12px;
        padding:6px 8px
    }

    .bar{
        width:90px
    }
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="hud">
    <div class="hb">
        ❤️ Health
        <div class="bar">
            <div id="hf"></div>
        </div>
    </div>

    <div class="hb" id="lv"></div>

    <div class="hb">
        ⭐ <span id="sc">0</span>
    </div>

    <div class="hb">
        🪙 <span id="co">0</span>
    </div>

    <div class="hb" id="lvl">Lv 1</div>
</div>

<div id="ov" class="ov">
    <div class="pn">
        <h1 id="ot"></h1>
        <p id="op"></p>
        <button id="ob"></button>
    </div>
</div>

<div id="mc">
    <div class="g">
        <div class="mb" id="bl">◀</div>
        <div class="mb" id="br">▶</div>
    </div>

    <div class="g">
        <div class="mb" id="bj">⬆</div>
        <div class="mb" id="ba" style="background:rgba(110,50,190,.9)">⚔</div>
    </div>
</div>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const cv=$('c');
const ctx=cv.getContext('2d');

const LH=600;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let sc=1;
let W=800;

function rs(){
    const d=Math.min(devicePixelRatio||1,2);

    cv.width=innerWidth*d;
    cv.height=innerHeight*d;

    sc=cv.height/LH;
    W=cv.width/sc;
}

addEventListener('resize',rs);
rs();

const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;

const hash=i=>{
    const s=Math.sin(i*127.1)*43758.5453;
    return s-Math.floor(s);
};

let st='start';
let score=0;
let coins=0;
let level=1;
let lives=3;
let best=0;
let cam=0;
let shake=0;
let hitstop=0;
let t=0;
let WW=3000;

try{
    best=+localStorage.getItem('platBest')||0;
}catch(e){}

// =====================================================
// LEVEL THEMES (one per level, cycles)
// =====================================================

const THEMES=[
{name:'Whispering Woods',emo:'🌲',sky:['#07131f','#17395c','#2d5a55'],r1:'#12283f',r2:'#0f2437',tree:'#0c2a26',dirt1:'#5b4130',dirt2:'#241812',grass:'#3c9d4d',grassHi:'#6ccf62',blade:'#4fb458',fog:'70,130,150',amb:0},
{name:'Sunken Ruins',emo:'🏛️',sky:['#0d1030','#3b2d63','#7a4a63'],r1:'#1c1a3e',r2:'#161433',tree:'#241f45',dirt1:'#4a4358',dirt2:'#221e2e',grass:'#5a8f4f',grassHi:'#8fd07a',blade:'#63a854',fog:'150,110,190',amb:0},
{name:'Frost Peaks',emo:'🏔️',sky:['#0a1626','#274a6d','#7aa3bd'],r1:'#1b3348',r2:'#142840',tree:'#22415a',dirt1:'#4b5d70',dirt2:'#232d3c',grass:'#b9d9e8',grassHi:'#e8f6ff',blade:'#9fc4d8',fog:'190,220,240',amb:1},
{name:'Ember Depths',emo:'🌋',sky:['#1a0b12','#4a1620','#8a3b1e'],r1:'#2a1119',r2:'#200d14',tree:'#33141c',dirt1:'#4d2a24',dirt2:'#211210',grass:'#7a4030',grassHi:'#a85c40',blade:'#8a4a34',fog:'255,120,60',amb:2}
];

let TH=THEMES[0];

let plats=[],mp=[],cr=[],ens=[],cns=[],gems=[],hts=[],parts=[];
let spk=[],saws=[],jets=[],pends=[],springs=[],chests=[],cps=[];
let msgs=[],projs=[],waves=[];
let boss=null;

let portal={
    x:0,y:0,w:60,h:110,open:0,wt:0
};

const P={
    x:100,y:448,w:28,h:52,
    vx:0,vy:0,face:1,
    hp:100,gr:false,coy:0,buf:0,
    inv:0,atk:0,cd:0,kb:0,
    hits:new Set(),anim:0,sq:0,
    onp:null,
    safe:{x:100,y:448}
};

const K={l:0,r:0,j:0};

const stars=Array.from(
    {length:90},
    (_,i)=>[hash(i),hash(i+99),1+hash(i+7)*1.6,hash(i+3)*6]
);


// =====================================================
// MESSAGES
// =====================================================

function say(txt,col){
    msgs.push({txt,col:col||'#fff',t:0,l:140});
}


// =====================================================
// ENEMY SPAWNING
// =====================================================

function spawnEn(type,x,y,w,R,L){

    const cx=x+w/2;
    const base={
        type,face:R()<.5?1:-1,
        fl:0,kb:0,alive:1,ph:R()*6
    };

    if(type==='walk'){

        const hp=2+(L>2)+(L>5);

        ens.push(Object.assign(base,{
            x:cx-14,y:y-44,w:28,h:44,
            hp,mhp:hp,
            min:x+8,max:x+w-36,
            sp:.9+L*.07,
            dmg:12,sc:100
        }));

    }else if(type==='spike'){

        const hp=4+(L>3)+(L>6);

        ens.push(Object.assign(base,{
            x:cx-15,y:y-40,w:30,h:38,
            hp,mhp:hp,
            min:x+8,max:x+w-38,
            sp:.55+L*.04,
            noStomp:1,
            dmg:16,sc:200
        }));

    }else if(type==='fly'){

        const hp=1+(L>3);

        ens.push(Object.assign(base,{
            ax:cx-13,ay:y-95-R()*45,
            x:cx-13,y:y-110,
            w:26,h:24,vx:0,vy:0,
            hp,mhp:hp,
            dmg:10,sc:120
        }));

    }else if(type==='shoot'){

        const hp=2+(L>4);

        ens.push(Object.assign(base,{
            x:cx-13,y:y-46,w:26,h:46,
            hp,mhp:hp,
            min:x+14,max:x+w-40,
            cd:60+R()*80,cf:0,
            dmg:12,sc:150
        }));

    }else{

        const hp=3+(L>3)+(L>6);

        ens.push(Object.assign(base,{
            x:cx-20,y:y-38,w:40,h:38,
            hp,mhp:hp,
            min:x+4,max:x+w-44,
            st:0,tm:0,vx:0,
            sp:.7+L*.05,
            dmg:16,sc:180
        }));
    }
}


// =====================================================
// LEVEL BUILD
// =====================================================

function build(){

    const L=level;
    const R=rng(level*7919+13);

    TH=THEMES[(L-1)%THEMES.length];

    plats=[];mp=[];cr=[];ens=[];cns=[];gems=[];hts=[];parts=[];
    spk=[];saws=[];jets=[];pends=[];springs=[];chests=[];cps=[];
    msgs=[];projs=[];waves=[];

    let x=700,y=500;

    plats.push({x:0,y:500,w:700});

    const n=Math.min(12+L*2,24);
    const cp1=Math.floor(n*.45);
    const cp2=Math.floor(n*.75);

    for(let i=0;i<n;i++){

        const sx=x,sy=y;

        y=clamp(
            y+(R()-.5)*(165+L*9),
            255,500
        );

        let gap=72+R()*Math.min(130,58+L*9);

        const rise=sy-y;

        if(rise>70)gap=Math.min(gap,105);
        else if(rise>40)gap=Math.min(gap,150);

        x+=gap;

        // moving platform as stepping stone across the gap
        if(gap>105&&R()<.38+L*.03){

            const mw=88+R()*44;
            const vert=R()<.5;

            const m={
                mv:1,w:mw,
                ox:x-gap/2-mw/2,
                oy:clamp((sy+y)/2-40,240,490),
                ax:vert?0:Math.min(64,gap*.28),
                ay:vert?42+R()*46:0,
                spd:.018+R()*.02,
                ph:R()*TAU
            };

            m.x=m.ox;m.y=m.oy;
            m.px=m.x;m.py=m.y;

            mp.push(m);
            plats.push(m);
        }

        const w=185+R()*225;
        const pl={x,y,w};

        const crumb=i>2&&R()<.1+L*.02;

        if(crumb){
            pl.cr=1;pl.st=0;pl.tm=0;pl.gone=0;
            cr.push(pl);
        }

        plats.push(pl);

        // coin arc over the gap
        if(gap>105&&R()<.7){
            for(let k=1;k<=4;k++){
                cns.push({
                    x:sx+gap*k/5,
                    y:Math.min(sy,y)-64-Math.sin(k/5*Math.PI)*34,
                    a:k,got:0
                });
            }
        }

        if(!crumb){

            // enemy
            if(i>0&&R()<Math.min(.95,.68+L*.03)){

                const pool=[
                    ['walk',10],
                    ['fly',L>=1?5:0],
                    ['spike',L>=2?4:0],
                    ['shoot',L>=3?4:0],
                    ['charge',L>=4?3:0]
                ];

                let tot=0;
                for(const p of pool)tot+=p[1];

                let r=R()*tot,type='walk';

                for(const p of pool){
                    r-=p[1];
                    if(r<=0){type=p[0];break;}
                }

                spawnEn(type,x,y,w,R,L);
            }

            // coin row
            for(let k=1;k<=4;k++){
                cns.push({
                    x:x+w*k/5,
                    y:y-50-Math.sin(k/5*Math.PI)*30,
                    a:k,got:0
                });
            }

            // gem
            if(R()<.11)gems.push({x:x+w/2,y:y-64,got:0,ph:R()*TAU});

            // heart
            if(i%8===4)hts.push({x:x+w/2,y:y-70,got:0});

            // spikes
            if(L>=1&&w>230&&R()<.16+L*.02)
                spk.push({x:x+w*.22+R()*w*.34,y,w:52+R()*44});

            // saw blade
            if(L>=2&&w>250&&R()<.1+L*.012)
                saws.push({
                    x:x+w/2,y:y-16,
                    min:x+26,max:x+w-26,
                    dir:R()<.5?1:-1,
                    spd:1.3+L*.09,
                    a:R()*TAU,r:22
                });

            // pendulum spike ball
            if(L>=3&&w>240&&R()<.11)
                pends.push({
                    x:x+w/2,y:y-185,
                    len:118+R()*44,
                    per:105+R()*45,
                    ph:R()*TAU
                });

            // flame jet
            if(L>=4&&w>220&&R()<.1)
                jets.push({x:x+w*(.25+R()*.5),y,per:150+R()*70,ph:R()*300,st:0});

            // spring
            if(i>1&&R()<.14)springs.push({x:x+w*.5,y,t:0});

            // treasure chest
            if(R()<.13)chests.push({x:x+w*(.3+R()*.4),y,got:0});
        }

        // checkpoints
        if(i===cp1||i===cp2)cps.push({x:x+w/2,y,got:0});

        x+=w;
    }

    // =================================================
    // BOSS ARENA + LOCKED PORTAL
    // =================================================

    x+=110;

    const aw=760;

    plats.push({x,y,w:aw});

    WW=x+aw;

    boss={
        x:x+430,y:y-92,w:74,h:88,
        vx:0,vy:0,face:-1,gr:1,
        awake:0,dead:0,
        st:'idle',tm:60,fl:0,
        hp:14+L*5,mhp:14+L*5,
        arena:{x,y,w:aw}
    };

    portal={x:x+590,y:y-110,w:60,h:110,open:0,wt:0};

    Object.assign(P,{
        x:100,y:500-P.h,
        vx:0,vy:0,face:1,
        hp:100,gr:false,coy:0,buf:0,
        inv:70,atk:0,cd:0,kb:0,
        hits:new Set(),anim:0,sq:0,onp:null,
        safe:{x:100,y:448}
    });

    cam=0;
}


// =====================================================
// NEW GAME
// =====================================================

function newGame(){

    score=0;
    coins=0;
    level=1;
    lives=3;

    build();
    st='play';

    say('LEVEL 1 — '+TH.emo+' '+TH.name,'#ffd43b');
}


// =====================================================
// OVERLAY
// =====================================================

function show(ti,tx,bt,f){

    $('ot').textContent=ti;
    $('op').innerHTML=tx;
    $('ob').textContent=bt;

    $('ov').classList.remove('hidden');

    $('ob').onclick=()=>{
        $('ov').classList.add('hidden');
        f();
    };
}


// =====================================================
// INPUT
// =====================================================

const km={
    KeyA:'l',
    ArrowLeft:'l',
    KeyD:'r',
    ArrowRight:'r',
    KeyW:'j',
    ArrowUp:'j',
    Space:'j'
};

addEventListener('keydown',e=>{

    if(km[e.code]){

        e.preventDefault();

        if(km[e.code]==='j'&&!e.repeat&&!K.j){
            P.buf=7;
        }

        K[km[e.code]]=1;
    }

    if(
        (e.code==='Enter'||e.code==='KeyJ'||e.code==='KeyK')&&
        !e.repeat
    ){
        e.preventDefault();
        attack();
    }

    if(
        (e.code==='KeyP'||e.code==='Escape')&&
        st==='play'
    ){
        st='pause';
        show('Paused','','RESUME',()=>st='play');
    }
});

addEventListener('keyup',e=>{
    if(km[e.code])K[km[e.code]]=0;
});

addEventListener('blur',()=>{
    K.l=K.r=K.j=0;
});

cv.addEventListener('mousedown',e=>{
    if(e.button===0)attack();
});

cv.addEventListener('contextmenu',e=>e.preventDefault());

function hold(id,k){

    const e=$(id);

    e.addEventListener('pointerdown',ev=>{
        ev.preventDefault();
        if(k==='j'&&!K.j)P.buf=7;
        K[k]=1;
    });

    ['pointerup','pointerleave','pointercancel'].forEach(
        n=>e.addEventListener(n,()=>K[k]=0)
    );
}

hold('bl','l');
hold('br','r');
hold('bj','j');

$('ba').addEventListener('pointerdown',e=>{
    e.preventDefault();
    attack();
});

function attack(){

    if(st!=='play'||P.cd>0)return;

    P.atk=24;
    P.cd=26;
    P.hits=new Set();

    P.vx+=P.face*2.2; // small lunge
}


// =====================================================
// FX
// =====================================================

function puff(x,y,n,c){

    for(let i=0;i<n;i++){

        parts.push({
            x,y,
            vx:(Math.random()-.5)*3,
            vy:-Math.random()*1.5,
            l:22,m:22,
            c:c||'#9aa5a0',
            s:2+Math.random()*3,
            g:.02
        });
    }
}

function spark(x,y,n,c){

    for(let i=0;i<n;i++){

        parts.push({
            x,y,
            vx:(Math.random()-.5)*9,
            vy:(Math.random()-.5)*9,
            l:24,m:24,
            c:c||'#8cecff',
            s:2+Math.random()*2,
            g:.25
        });
    }
}


// =====================================================
// PHYSICS
// =====================================================

function mv(o,dx,dy){

    if(dx){

        o.x+=dx;

        for(const p of plats){

            if(p.gone)continue;
            if(p.mv||p.cr)continue; // thin platforms: no side block

            if(
                o.x<p.x+p.w&&
                o.x+o.w>p.x&&
                o.y+o.h>p.y+.5&&
                o.y<p.y+900
            ){
                o.x=dx>0?p.x-o.w:p.x+p.w;
                o.vx=0;
            }
        }
    }

    if(dy){

        o.y+=dy;

        for(const p of plats){

            if(p.gone)continue;

            if(
                o.x<p.x+p.w&&
                o.x+o.w>p.x&&
                o.y+o.h>p.y&&
                o.y<p.y+900
            ){
                if(dy>0){
                    o.y=p.y-o.h;
                    o.vy=0;
                    o.gr=true;
                    o.onp=p;
                }else if(!p.mv&&!p.cr){
                    o.y=p.y+900;
                    o.vy=0;
                }
            }
        }
    }
}

function respawn(){

    P.x=P.safe.x;
    P.y=P.safe.y;

    P.vx=0;P.vy=0;
    P.inv=110;P.kb=0;P.atk=0;P.cd=20;

    cam=clamp(P.safe.x-W*.4,0,WW-W);
}

function die(){

    lives--;
    shake=12;

    if(lives<=0){

        st='over';

        if(score>best){
            best=score;
            try{localStorage.setItem('platBest',best)}catch(e){}
        }

        show(
            '💀 Game Over',
            'Score <b>'+score+'</b> · Coins <b>'+coins+
            '</b> · Best <b>'+best+'</b>',
            'PLAY AGAIN',
            newGame
        );

    }else{

        P.hp=100;
        respawn();
        say('♥ '+lives+' LIVES LEFT','#ff6b8a');
    }
}

function hurt(d,dir){

    P.hp-=d;
    P.inv=70;
    P.vx=dir*6;
    P.vy=-6;
    P.kb=12;

    shake=9;
    hitstop=4;

    spark(P.x+14,P.y+26,10,'#ff5b6e');

    if(P.hp<=0){
        P.hp=0;
        die();
    }
}

function hitEn(e,dir){

    e.hp--;
    e.fl=8;
    e.kb=dir*6;

    if(e.type==='fly')e.vy-=3;
    if(e.type==='charge'&&e.st===2){e.st=3;e.tm=50;}

    hitstop=3;
    shake=5;

    spark(e.x+e.w/2,e.y+e.h/2,10);

    if(e.hp<=0){

        e.alive=0;
        score+=e.sc;

        spark(e.x+e.w/2,e.y+e.h/2,26,'#ff9ab0');

        if(Math.random()<.35){
            cns.push({
                x:e.x+e.w/2,y:e.y,
                a:0,got:0,pop:1,
                vx:(Math.random()-.5)*4,
                vy:-3,g:e.y
            });
        }
    }
}

function killBoss(){

    boss.dead=1;
    portal.open=1;
    score+=1500;

    shake=18;
    hitstop=8;

    const cx=boss.x+boss.w/2;
    const cy=boss.y+boss.h/2;

    spark(cx,cy,16,'#ff9ab0');
    spark(cx,cy,16,'#ffd43b');
    spark(cx,cy,16,'#8cecff');
    puff(cx,cy,20,'#8f7ba0');

    hts.push({x:cx,y:boss.arena.y-46,got:0});
    gems.push({x:cx+46,y:boss.arena.y-60,got:0,ph:0});

    say('GUARDIAN DEFEATED!','#ffd43b');
    say('THE PORTAL OPENS','#c277ff');
}


// =====================================================
// STEP
// =====================================================

function step(){

    shake*=.85;

    if(hitstop>0){
        hitstop--;
        return;
    }

    t++;

    if(P.cd>0)P.cd--;
    if(P.inv>0)P.inv--;
    if(P.atk>0)P.atk--;

    // ---- moving platforms ----
    for(const m of mp){
        m.px=m.x;m.py=m.y;
        m.x=m.ox+Math.sin(t*m.spd+m.ph)*m.ax;
        m.y=m.oy+Math.sin(t*m.spd+m.ph)*m.ay;
    }

    if(P.gr&&P.onp&&P.onp.mv){
        P.x+=P.onp.x-P.onp.px;
        P.y+=P.onp.y-P.onp.py;

        for(const p of plats){
            if(p===P.onp||p.mv||p.cr||p.gone)continue;
            if(
                P.x<p.x+p.w&&P.x+P.w>p.x&&
                P.y+P.h>p.y+2&&P.y<p.y+900
            ){
                P.x=(P.x+P.w/2<p.x+p.w/2)?p.x-P.w:p.x+p.w;
            }
        }
    }

    // ---- crumbling platforms ----
    for(const c of cr){

        if(c.st===0){
            if(P.gr&&P.onp===c){c.st=1;c.tm=38;}
        }else if(c.st===1){
            c.tm--;
            if(c.tm<=0){
                c.st=2;c.tm=170;c.gone=1;
                puff(c.x+c.w/2,c.y,10,'#8a8f98');
            }
        }else{
            c.tm--;
            if(c.tm<=0){
                c.st=0;c.gone=0;
                puff(c.x+c.w/2,c.y,6);
            }
        }
    }

    // ---- player control ----
    if(P.kb>0){

        P.kb--;

    }else{

        const d=K.r-K.l;

        if(d){
            P.vx+=d*(P.gr?.7:.4);
            P.face=d;
        }else{
            P.vx*=P.gr?.78:.96;
        }

        P.vx=clamp(P.vx,-5.2,5.2);

        if(P.atk&&P.gr)P.vx*=.88;
    }

    P.coy=P.gr?7:P.coy-1;
    if(P.buf>0)P.buf--;

    if(P.buf>0&&P.coy>0){
        P.vy=-13.5;
        P.coy=0;P.buf=0;P.gr=false;
        puff(P.x+14,P.y+52,5);
    }

    if(!K.j&&P.vy<-5)P.vy*=.6;

    P.vy=Math.min(P.vy+.62,16);

    mv(P,P.vx,0);

    const was=P.vy;
    P.gr=false;
    mv(P,0,P.vy);

    // ---- springs ----
    if(P.gr){
        for(const s of springs){
            if(Math.abs(P.x+14-s.x)<30&&Math.abs(P.y+P.h-s.y)<12){
                if(was>5){
                    P.vy=-19.5;P.gr=false;s.t=14;
                    puff(s.x,s.y,8,'#9fd8ff');
                    spark(s.x,s.y-8,6,'#7ec8ff');
                }
                break;
            }
        }
    }

    if(P.gr&&was>7){
        puff(P.x+14,P.y+52,8);
        P.sq=.25;
    }

    P.sq*=.8;

    if(P.gr&&Math.abs(P.vx)>.5){
        P.anim+=Math.abs(P.vx)*.07;
        if(Math.abs(P.vx)>3&&t%9===0)
            puff(P.x+14,P.y+52,1);
    }

    if(P.x<0){P.x=0;P.vx=0;}

    if(P.gr&&P.onp&&!P.onp.mv&&!P.onp.cr){
        const p=P.onp;
        if(P.x>p.x+30&&P.x+P.w<p.x+p.w-30){
            P.safe={x:P.x,y:P.y};
        }
    }

    // ---- falling = lose a life, back to checkpoint ----
    if(P.y>LH+130){
        die();
        return;
    }

    // ---- sword hit window ----
    let hb=null;

    if(P.atk>=10&&P.atk<=18){

        hb={
            x:P.face>0?P.x+P.w:P.x-72,
            y:P.y-6,w:72,h:64
        };

        for(const e of ens){
            if(
                e.alive&&!P.hits.has(e)&&
                e.x<hb.x+hb.w&&e.x+e.w>hb.x&&
                e.y<hb.y+hb.h&&e.y+e.h>hb.y
            ){
                P.hits.add(e);
                hitEn(e,P.face);
            }
        }

        if(boss&&boss.awake&&!boss.dead&&!P.hits.has(boss)&&
            boss.x<hb.x+hb.w&&boss.x+boss.w>hb.x&&
            boss.y<hb.y+hb.h&&boss.y+boss.h>hb.y
        ){
            P.hits.add(boss);
            const d=boss.st==='rest'?2:1;
            boss.hp-=d;
            boss.fl=9;
            hitstop=4;shake=6;
            score+=15;
            spark(boss.x+boss.w/2,boss.y+30,12);
            if(boss.hp<=0)killBoss();
        }

        for(const p of projs){
            if(
                p.l>0&&
                p.x>hb.x&&p.x<hb.x+hb.w&&
                p.y>hb.y&&p.y<hb.y+hb.h
            ){
                p.l=0;score+=15;
                spark(p.x,p.y,8,'#8cecff');
            }
        }
    }

    // ---- enemies ----
    for(const e of ens){

        if(!e.alive)continue;

        if(e.fl>0)e.fl--;

        if(e.kb){

            e.x+=e.kb;
            if(e.type==='fly')e.y+=e.kb*.4;
            e.kb*=.85;
            if(Math.abs(e.kb)<.3)e.kb=0;

        }else if(e.type==='walk'){

            const dx=P.x-e.x;

            if(Math.abs(dx)<240&&Math.abs(P.y-e.y)<90){
                e.face=dx>0?1:-1;
                e.x+=e.face*e.sp*1.5;
            }else{
                e.x+=e.face*e.sp*.6;
                if(e.x<=e.min)e.face=1;
                if(e.x>=e.max)e.face=-1;
            }

        }else if(e.type==='spike'){

            e.x+=e.face*e.sp*.7;
            if(e.x<=e.min)e.face=1;
            if(e.x>=e.max)e.face=-1;

        }else if(e.type==='fly'){

            const dx=P.x+14-(e.x+13);
            const dy=P.y+10-(e.y+12);
            const d=Math.hypot(dx,dy)||1;

            if(d<300){
                e.vx+=dx/d*.16;
                e.vy+=dy/d*.16;
            }else{
                e.vx+=(e.ax-e.x)*.003+Math.sin(t*.045+e.ph)*.06;
                e.vy+=(e.ay-e.y)*.003+Math.cos(t*.037+e.ph)*.06;
            }

            const mx=2.1+level*.09;

            e.vx=clamp(e.vx,-mx,mx);
            e.vy=clamp(e.vy,-mx,mx);

            e.x+=e.vx;e.y+=e.vy;
            e.face=e.vx>0?1:-1;
            e.y=clamp(e.y,70,545);

        }else if(e.type==='shoot'){

            const dx=P.x-e.x;
            const near=Math.abs(dx)<430&&Math.abs(P.y-e.y)<130;

            if(near)e.face=dx>0?1:-1;

            if(Math.abs(dx)<120)e.x-=e.face*.5;

            if(e.cf>0)e.cf--;

            e.cd--;

            if(near&&e.cd<=0){
                e.cd=Math.max(64,120-level*7);
                e.cf=14;

                const sy2=e.y+12;
                const ang=Math.atan2(
                    P.y+18-sy2,
                    P.x+14-(e.x+14)
                );
                const sp2=4.2+level*.12;

                projs.push({
                    x:e.x+14+e.face*18,y:sy2,
                    vx:Math.cos(ang)*sp2,
                    vy:Math.sin(ang)*sp2,
                    g:0,r:8,l:240,orb:1
                });

                spark(e.x+14,sy2,4,'#c07bff');
            }

        }else if(e.type==='charge'){

            if(e.st===0){
                e.x+=e.face*e.sp*.55;
                if(e.x<=e.min)e.face=1;
                if(e.x>=e.max)e.face=-1;

                if(Math.abs(P.x-e.x)<230&&Math.abs(P.y-e.y)<70){
                    e.face=P.x>e.x?1:-1;
                    e.st=1;e.tm=32;
                }

            }else if(e.st===1){
                e.tm--;
                if(t%4===0)puff(e.x+20-e.face*14,e.y+e.h,1,'#c9b8a0');
                if(e.tm<=0){
                    e.st=2;e.tm=80;
                    e.vx=e.face*(6+level*.18);
                }

            }else if(e.st===2){
                e.x+=e.vx;e.tm--;
                if(t%3===0)puff(e.x+20-e.face*18,e.y+e.h,1,'#c9b8a0');

                if(e.x<=e.min||e.x>=e.max||e.tm<=0){
                    e.x=clamp(e.x,e.min,e.max);
                    e.st=3;e.tm=55;
                    if(e.tm>0&&e.x===e.min||e.x===e.max){}
                    shake=Math.max(shake,5);
                    puff(e.x+20,e.y+20,6,'#c9b8a0');
                }

            }else{
                e.tm--;
                if(e.tm<=0)e.st=0;
            }
        }

        if(e.type!=='fly'&&!(e.type==='charge'&&e.st===2)){
            e.x=clamp(e.x,e.min,e.max);
        }

        // contact with player
        if(
            P.x<e.x+e.w&&P.x+P.w>e.x&&
            P.y<e.y+e.h&&P.y+P.h>e.y
        ){
            if(
                P.vy>1.5&&
                P.y+P.h-e.y<24&&
                !e.noStomp
            ){
                hitEn(e,P.face);
                P.vy=-9.5;
                P.gr=false;
                score+=10;

            }else if(P.inv<=0){
                hurt(e.dmg,e.x+e.w/2<P.x+14?1:-1);
            }
        }
    }

    // ---- boss ----
    if(boss&&!boss.dead&&boss.awake){

        const B=boss;

        if(B.fl>0)B.fl--;
        B.tm--;

        if(B.st==='idle'){

            B.face=P.x>B.x?1:-1;
            B.x+=B.face*1.1;

            if(B.tm<=0){B.st='tele';B.tm=32;}

        }else if(B.st==='tele'){

            if(B.tm<=0){
                const dx=Math.abs(P.x-B.x);

                if(dx>380){
                    B.st='throw';B.tm=22;

                }else if(dx>240){
                    B.st='charge';B.tm=55;
                    B.vx=B.face*(8.5+level*.2);

                }else{
                    B.st='slam';
                    B.vy=-15;B.gr=0;
                }
            }

        }else if(B.st==='charge'){

            B.x+=B.vx;

            const wl=B.x<B.arena.x+6;
            const wr=B.x+B.w>B.arena.x+B.arena.w-6;

            if(wl||wr||B.tm<=0){
                B.x=clamp(B.x,B.arena.x+6,B.arena.x+B.arena.w-6-B.w);
                B.st='rest';B.tm=55;
                shake=Math.max(shake,8);
                puff(B.x+B.w/2+B.face*40,B.y+B.h-10,8,'#8f7ba0');
            }

        }else if(B.st==='throw'){

            if(B.tm===10){
                projs.push({
                    x:B.x+B.w/2+B.face*26,
                    y:B.y+16,
                    vx:B.face*(5.5+level*.2),
                    vy:-7.5,g:.26,r:13,
                    rock:1,l:300
                });
            }

            if(B.tm<=0){B.st='rest';B.tm=40;}

        }else if(B.st==='slam'){

            B.vy=Math.min(B.vy+.7,16);
            B.y+=B.vy;

            if(B.y+B.h>=B.arena.y){
                B.y=B.arena.y-B.h;
                B.gr=1;
                B.st='rest';B.tm=50;
                shake=16;

                waves.push({x:B.x-10,y:B.arena.y,dir:-1,life:110});
                waves.push({x:B.x+B.w+10,y:B.arena.y,dir:1,life:110});

                puff(B.x+B.w/2,B.arena.y,14,'#8f7ba0');
            }

        }else if(B.st==='rest'){

            if(B.tm<=0){
                B.st='idle';
                B.tm=45+Math.random()*40;
            }
        }

        B.x=clamp(B.x,B.arena.x+6,B.arena.x+B.arena.w-6-B.w);

        // boss contact
        if(
            P.x<B.x+B.w&&P.x+P.w>B.x&&
            P.y<B.y+B.h&&P.y+P.h>B.y
        ){
            if(P.vy>2&&P.y+P.h-B.y<28){
                B.hp-=2;B.fl=8;
                P.vy=-14;
                hitstop=4;shake=7;
                score+=20;
                spark(B.x+B.w/2,B.y+14,12);
                if(B.hp<=0)killBoss();

            }else if(P.inv<=0){
                hurt(20,B.x+B.w/2<P.x+14?1:-1);
            }
        }
    }

    // boss wake trigger
    if(boss&&!boss.dead&&!boss.awake&&P.x>boss.arena.x-320){
        boss.awake=1;
        say('⚠ THE GUARDIAN AWAKENS','#ff6b6b');
        shake=14;
    }

    // ---- shockwaves ----
    for(const w of waves){

        w.x+=w.dir*5.2;
        w.life--;

        if(boss&&(w.x<boss.arena.x-10||w.x>boss.arena.x+boss.arena.w+10))w.life=0;

        if(
            P.inv<=0&&
            Math.abs(P.x+14-w.x)<16&&
            P.y+P.h>w.y-30&&
            P.y+P.h<w.y+8
        ){
            hurt(14,w.dir);
        }
    }

    waves=waves.filter(w=>w.life>0);

    // ---- projectiles ----
    for(const p of projs){

        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=p.g;
        p.l--;

        if(t%2===0){
            parts.push({
                x:p.x,y:p.y,vx:0,vy:0,
                l:14,m:14,
                c:p.orb?'#c07bff':'#ffa050',
                s:p.orb?3:4,g:0
            });
        }

        if(
            P.inv<=0&&
            P.x<p.x+p.r&&P.x+P.w>p.x-p.r&&
            P.y<p.y+p.r&&P.y+P.h>p.y-p.r
        ){
            hurt(p.orb?10:12,p.vx>0?1:-1);
            p.l=0;
        }

        if(p.orb){
            for(const pl of plats){
                if(pl.gone)continue;
                if(
                    p.x>pl.x&&p.x<pl.x+pl.w&&
                    p.y>pl.y&&p.y<pl.y+40
                ){
                    p.l=0;
                    spark(p.x,p.y,6,'#c07bff');
                    break;
                }
            }
        }else if(boss&&p.y>boss.arena.y-6){
            p.l=0;
            puff(p.x,boss.arena.y,8,'#c9b8a0');
            spark(p.x,boss.arena.y-8,10,'#ffa050');
        }
    }

    projs=projs.filter(p=>p.l>0);

    // ---- coins ----
    for(const c of cns){

        if(!c.got){

            c.a+=.08;

            if(c.pop){
                c.x+=c.vx;
                c.y+=c.vy;
                c.vy+=.4;
                if(c.y>c.g){
                    c.y=c.g;
                    c.vy*=-.45;
                    c.vx*=.7;
                }
            }

            if(
                Math.hypot(P.x+14-c.x,P.y+26-c.y)<32
            ){
                c.got=1;
                coins++;
                score+=25;
                spark(c.x,c.y,8,'#ffd43b');
            }
        }
    }

    // ---- gems ----
    for(const g of gems){
        if(
            !g.got&&
            Math.hypot(P.x+14-g.x,P.y+26-g.y)<30
        ){
            g.got=1;
            score+=250;
            coins+=3;
            spark(g.x,g.y,14,'#7ef0ff');
            say('+250 GEM','#7ef0ff');
        }
    }

    // ---- hearts ----
    for(const h of hts){
        if(
            !h.got&&
            Math.hypot(P.x+14-h.x,P.y+26-h.y)<34&&
            P.hp<100
        ){
            h.got=1;
            P.hp=Math.min(100,P.hp+30);
            spark(h.x,h.y,12,'#ff6b8a');
        }
    }

    // ---- chests ----
    for(const c of chests){
        if(
            !c.got&&
            Math.abs(P.x+14-c.x)<30&&
            Math.abs(P.y+P.h-c.y)<36
        ){
            c.got=1;
            spark(c.x,c.y-10,16,'#ffd43b');

            if(Math.random()<.3){
                hts.push({x:c.x,y:c.y-34,got:0});
                say('A HEART!','#ff6b8a');
            }else{
                for(let k=0;k<5;k++){
                    cns.push({
                        x:c.x,y:c.y-14,a:k,got:0,pop:1,
                        vx:(Math.random()-.5)*5,
                        vy:-4-Math.random()*3,
                        g:c.y
                    });
                }
                say('TREASURE!','#ffd43b');
            }
        }
    }

    // ---- checkpoints ----
    for(const c of cps){
        if(
            !c.got&&
            Math.abs(P.x+14-c.x)<34&&
            Math.abs(P.y+P.h-c.y)<50
        ){
            c.got=1;
            P.safe={x:c.x-14,y:c.y-P.h-4};
            say('CHECKPOINT!','#4ade80');
            spark(c.x,c.y-40,14,'#4ade80');
        }
    }

    // ---- spikes ----
    for(const s of spk){
        if(
            P.inv<=0&&
            P.x+P.w>s.x+4&&P.x<s.x+s.w-4&&
            P.y+P.h>s.y-18&&P.y+P.h<s.y+6
        ){
            hurt(22,P.x+14<s.x+s.w/2?-1:1);
            P.vy=-8.5;
            P.gr=false;
        }
    }

    // ---- saws ----
    for(const s of saws){

        s.x+=s.dir*s.spd;

        if(s.x<s.min){s.x=s.min;s.dir=1;}
        if(s.x>s.max){s.x=s.max;s.dir=-1;}

        s.a+=.3;

        if(
            P.inv<=0&&
            Math.hypot(P.x+14-s.x,P.y+26-s.y)<s.r+13
        ){
            hurt(18,P.x+14<s.x?-1:1);
        }
    }

    // ---- pendulums ----
    for(const p of pends){

        const a=Math.sin(t/p.per*TAU+p.ph)*1.05;

        p.bx=p.x+Math.sin(a)*p.len;
        p.by=p.y+Math.cos(a)*p.len;

        if(
            P.inv<=0&&
            Math.hypot(P.x+14-p.bx,P.y+26-p.by)<31
        ){
            hurt(20,P.x+14<p.bx?-1:1);
        }
    }

    // ---- flame jets ----
    for(const j of jets){

        const c=(t+j.ph)%j.per;

        j.st=c<34?0:c<52?1:c<100?2:0;

        if(j.st===1&&t%5===0){
            parts.push({
                x:j.x+(Math.random()-.5)*10,
                y:j.y-6,
                vx:0,vy:-1-Math.random(),
                l:16,m:16,c:'#ffd43b',s:2,g:0
            });
        }

        if(j.st===2){

            if(t%3===0){
                parts.push({
                    x:j.x+(Math.random()-.5)*16,
                    y:j.y-20-Math.random()*80,
                    vx:(Math.random()-.5)*1.5,
                    vy:-2-Math.random()*2,
                    l:18,m:18,c:'#ffb050',s:2.5,g:0
                });
            }

            if(
                P.inv<=0&&
                Math.abs(P.x+14-j.x)<24&&
                P.y+P.h>j.y-125&&
                P.y<j.y
            ){
                hurt(15,P.x+14<j.x?-1:1);
            }
        }
    }

    // ---- spring anim ----
    for(const s of springs){
        if(s.t>0)s.t--;
    }

    // ---- portal ----
    if(
        P.x+P.w>portal.x&&
        P.x<portal.x+portal.w&&
        P.y+P.h>portal.y&&
        P.y<portal.y+portal.h
    ){
        if(portal.open){

            st='clear';
            score+=500;

            show(
                '🎉 '+TH.emo+' Level Complete!',
                'Score <b>'+score+'</b> · Coins <b>'+coins+'</b>',
                'NEXT LEVEL',
                ()=>{
                    level++;
                    build();
                    st='play';
                    say('LEVEL '+level+' — '+TH.emo+' '+TH.name,'#ffd43b');
                }
            );

        }else if(portal.wt<=0){
            say('DEFEAT THE GUARDIAN!','#ff6b6b');
            portal.wt=180;
        }
    }

    if(portal.wt>0)portal.wt--;

    // ---- particles ----
    for(const p of parts){
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=p.g;
        p.l--;
    }

    parts=parts.filter(p=>p.l>0);

    // ---- camera ----
    const tg=P.x+P.face*60-W*.4;
    cam+=(tg-cam)*.1;
    cam=clamp(cam,0,WW-W);
}


// =====================================================
// DRAWING HELPERS
// =====================================================

function limb(x,y,l,w,a,c){

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(a);
    ctx.fillStyle=c;
    ctx.fillRect(-w/2,0,w,l);
    ctx.restore();
}

function ridge(par,base,amp,col,sd){

    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(0,LH);

    for(let x=0;x<=W+30;x+=30){

        const u=x+cam*par;

        ctx.lineTo(
            x,
            base-amp*(
                .5+
                .3*Math.sin(u*.004+sd)+
                .2*Math.sin(u*.011+sd*2)+
                .1*Math.sin(u*.027)
            )
        );
    }

    ctx.lineTo(W+30,LH);
    ctx.fill();
}


// =====================================================
// BACKGROUND
// =====================================================

function bg(){

    const g=ctx.createLinearGradient(0,0,0,cv.height);

    g.addColorStop(0,TH.sky[0]);
    g.addColorStop(.6,TH.sky[1]);
    g.addColorStop(1,TH.sky[2]);

    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle=g;
    ctx.fillRect(0,0,cv.width,cv.height);

    ctx.setTransform(sc,0,0,sc,0,0);

    // stars
    ctx.fillStyle='#fff';

    for(const s of stars){
        ctx.globalAlpha=.35+.35*Math.sin(t*.03+s[3]);
        ctx.fillRect(((s[0]*W-cam*.02)%W+W)%W,s[1]*320,s[2],s[2]);
    }

    ctx.globalAlpha=1;

    // moon
    const mg=ctx.createRadialGradient(W-140,90,10,W-140,90,110);

    mg.addColorStop(0,'rgba(255,243,189,.9)');
    mg.addColorStop(.3,'rgba(255,243,189,.25)');
    mg.addColorStop(1,'rgba(255,243,189,0)');

    ctx.fillStyle=mg;
    ctx.fillRect(W-260,0,260,220);

    ctx.fillStyle='#fff3bd';
    ctx.beginPath();
    ctx.arc(W-140,90,34,0,TAU);
    ctx.fill();

    ridge(.08,430,170,TH.r1,1);
    ridge(.18,480,130,TH.r2,3);

    // theme props
    const ti=(level-1)%4;

    ctx.fillStyle=TH.tree;

    const i0=Math.floor(cam*.4/110)-1;

    for(let i=i0;i<i0+W/110+3;i++){

        const x=i*110-cam*.4;
        const h=70+hash(i)*70;

        if(ti===1){
            // ruins columns
            ctx.fillRect(x-8,LH-40-h,16,h);
            ctx.fillRect(x-16,LH-46-h,32,8);
            ctx.fillRect(x-14,LH-40,28,10);

        }else{
            ctx.beginPath();
            ctx.moveTo(x-30,LH-40);
            ctx.lineTo(x+15,LH-40-h);
            ctx.lineTo(x+60,LH-40);
            ctx.fill();

            if(ti===2){
                ctx.fillStyle='#eef8ff';
                ctx.beginPath();
                ctx.moveTo(x+4,LH-28-h);
                ctx.lineTo(x+15,LH-40-h);
                ctx.lineTo(x+26,LH-28-h);
                ctx.fill();
                ctx.fillStyle=TH.tree;
            }

            if(ti===3){
                ctx.fillStyle='#ff8c40';
                ctx.fillRect(x+13,LH-44-h,4,4);
                ctx.fillStyle=TH.tree;
            }

            ctx.fillRect(x-30,LH-40,90,60);
        }
    }

    // fog
    const f=ctx.createLinearGradient(0,330,0,LH);

    f.addColorStop(0,'rgba('+TH.fog+',0)');
    f.addColorStop(1,'rgba('+TH.fog+',.28)');

    ctx.fillStyle=f;
    ctx.fillRect(0,330,W,LH-330);

    // ambient particles
    for(let i=0;i<26;i++){

        const sd=i*37.7;
        let x,y;

        if(ti===1){
            x=(((hash(i)*W+t*.4*(.5+hash(i+9))-cam*.06)%W)+W)%W;
            y=(hash(i+4)*LH+t*(.6+hash(i+2)))%LH;
            ctx.globalAlpha=.5;
            ctx.fillStyle='#fff';
            ctx.fillRect(x,y,2,2);

        }else if(ti===2){
            x=(((hash(i)*W+Math.sin(t*.02+sd)*20-cam*.06)%W)+W)%W;
            y=LH-((t*(.5+hash(i+2)*.7)+hash(i)*LH)%LH);
            ctx.globalAlpha=.35+.3*Math.sin(t*.1+sd);
            ctx.fillStyle='#ff9a50';
            ctx.fillRect(x,y,2.5,2.5);

        }else{
            x=(((hash(i)*W+Math.sin(t*.01+sd)*30-cam*.05)%W)+W)%W;
            y=140+hash(i+5)*360+Math.sin(t*.015+sd*2)*24;
            ctx.globalAlpha=.25+.45*(.5+.5*Math.sin(t*.06+sd*3));
            ctx.fillStyle=ti===0?'#d8f277':'#d9b0ff';
            ctx.beginPath();
            ctx.arc(x,y,1.8,0,TAU);
            ctx.fill();
        }
    }

    ctx.globalAlpha=1;
}


// =====================================================
// PLATFORMS
// =====================================================

function drawMover(p,x){

    const g=ctx.createLinearGradient(0,p.y,0,p.y+26);

    g.addColorStop(0,'#6b6f80');
    g.addColorStop(1,'#33374a');

    ctx.fillStyle=g;
    ctx.fillRect(x,p.y,p.w,22);

    ctx.fillStyle='#8b90a4';
    ctx.fillRect(x,p.y,p.w,4);

    ctx.fillStyle='#23263a';
    ctx.fillRect(x,p.y+22,p.w,4);

    ctx.save();
    ctx.translate(x+p.w/2,p.y+11);
    ctx.rotate(t*.03+Math.PI/4);
    ctx.fillStyle='#b07bff';
    ctx.fillRect(-4,-4,8,8);
    ctx.restore();

    ctx.fillStyle='#23263a';
    ctx.fillRect(x+3,p.y+8,4,4);
    ctx.fillRect(x+p.w-7,p.y+8,4,4);
}

function drawCrumb(p,x){

    if(p.gone){
        ctx.globalAlpha=.15+.1*Math.sin(t*.2);
        ctx.strokeStyle='#9aa2ad';
        ctx.setLineDash([5,5]);
        ctx.strokeRect(x,p.y,p.w,14);
        ctx.setLineDash([]);
        ctx.globalAlpha=1;
        return;
    }

    const j=p.st===1?(Math.random()-.5)*(1+2*(1-p.tm/38)):0;

    ctx.save();
    ctx.translate(j,0);

    const g=ctx.createLinearGradient(0,p.y,0,p.y+16);

    g.addColorStop(0,'#8d8578');
    g.addColorStop(1,'#575046');

    ctx.fillStyle=g;
    ctx.fillRect(x,p.y,p.w,14);

    ctx.fillStyle='#b0a894';
    ctx.fillRect(x,p.y,p.w,3);

    ctx.strokeStyle='rgba(40,35,28,.6)';
    ctx.lineWidth=1.5;
    ctx.beginPath();

    for(let i=10;i<p.w;i+=26){
        ctx.moveTo(x+i,p.y+2);
        ctx.lineTo(x+i+5,p.y+12);
    }

    ctx.stroke();
    ctx.restore();
}

function drawPlat(p){

    const x=p.x-cam;

    if(x+p.w<0||x>W)return;

    if(p.mv){drawMover(p,x);return;}
    if(p.cr){drawCrumb(p,x);return;}

    const g=ctx.createLinearGradient(0,p.y,0,p.y+220);

    g.addColorStop(0,TH.dirt1);
    g.addColorStop(1,TH.dirt2);

    ctx.fillStyle=g;
    ctx.fillRect(x,p.y,p.w,LH-p.y+60);

    ctx.fillStyle='rgba(0,0,0,.22)';

    for(let i=14;i<p.w;i+=34){
        const h=hash(p.x+i);
        ctx.fillRect(x+i,p.y+20+h*90,6+h*8,4+h*5);
    }

    ctx.fillStyle=TH.grass;
    ctx.fillRect(x,p.y,p.w,12);

    ctx.fillStyle=TH.grassHi;
    ctx.fillRect(x,p.y,p.w,3);

    ctx.fillStyle=TH.blade;

    for(let i=0;i<p.w;i+=9){
        const h=3+hash(p.x+i)*6;
        ctx.beginPath();
        ctx.moveTo(x+i,p.y);
        ctx.lineTo(x+i+3,p.y-h);
        ctx.lineTo(x+i+6,p.y);
        ctx.fill();
    }

    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.fillRect(x+p.w-6,p.y,6,LH);
}


// =====================================================
// HAZARD DRAWINGS
// =====================================================

function drawSpk(s){

    const x0=s.x-cam;

    if(x0+s.w<0||x0>W)return;

    ctx.fillStyle='#3a3f4a';
    ctx.fillRect(x0,s.y-4,s.w,4);

    ctx.fillStyle='#b7bfc9';

    for(let i=0;i<s.w-12;i+=14){
        ctx.beginPath();
        ctx.moveTo(x0+i,s.y-3);
        ctx.lineTo(x0+i+7,s.y-19);
        ctx.lineTo(x0+i+14,s.y-3);
        ctx.fill();
    }
}

function drawSaw(s){

    const x=s.x-cam;

    if(x<-60||x>W+60)return;

    ctx.save();
    ctx.translate(x,s.y);
    ctx.rotate(s.a);

    ctx.fillStyle='#9aa2ad';
    ctx.beginPath();
    ctx.arc(0,0,s.r,0,TAU);
    ctx.fill();

    ctx.fillStyle='#c9d2da';

    for(let i=0;i<8;i++){
        const a=i/8*TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*s.r-2,Math.sin(a)*s.r-2);
        ctx.lineTo(Math.cos(a+.22)*(s.r+8),Math.sin(a+.22)*(s.r+8));
        ctx.lineTo(Math.cos(a+.44)*s.r-2,Math.sin(a+.44)*s.r-2);
        ctx.fill();
    }

    ctx.fillStyle='#ff4d6d';
    ctx.beginPath();
    ctx.arc(0,0,6,0,TAU);
    ctx.fill();

    ctx.restore();
}

function drawPend(p){

    const ax=p.x-cam;

    if(ax<-80||ax>W+80)return;

    // anchor
    ctx.fillStyle='#5b6270';
    ctx.beginPath();
    ctx.arc(ax,p.y,7,0,TAU);
    ctx.fill();

    ctx.strokeStyle='#8b93a3';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(ax,p.y,10,0,TAU);
    ctx.stroke();

    // chain
    ctx.strokeStyle='#7d8494';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(ax,p.y);
    ctx.lineTo(p.bx-cam,p.by);
    ctx.stroke();

    // ball
    ctx.save();
    ctx.translate(p.bx-cam,p.by);

    ctx.fillStyle='#b7bfc9';

    for(let i=0;i<8;i++){
        const a=i/8*TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*13,Math.sin(a)*13);
        ctx.lineTo(Math.cos(a+.25)*21,Math.sin(a+.25)*21);
        ctx.lineTo(Math.cos(a+.5)*13,Math.sin(a+.5)*13);
        ctx.fill();
    }

    ctx.fillStyle='#3a3f4a';
    ctx.beginPath();
    ctx.arc(0,0,15,0,TAU);
    ctx.fill();

    ctx.fillStyle='#ff4d6d';
    ctx.beginPath();
    ctx.arc(0,0,4,0,TAU);
    ctx.fill();

    ctx.restore();
}

function drawJet(j){

    const x=j.x-cam;

    if(x<-40||x>W+40)return;

    ctx.fillStyle='#2b2f3a';
    ctx.fillRect(x-14,j.y-8,28,8);

    ctx.fillStyle='#171a22';
    ctx.fillRect(x-10,j.y-6,20,2);
    ctx.fillRect(x-10,j.y-2,20,2);

    if(j.st===1){
        ctx.fillStyle='#ffd43b';
        ctx.globalAlpha=.5+.5*Math.sin(t*.5);
        ctx.beginPath();
        ctx.arc(x,j.y-12,3,0,TAU);
        ctx.fill();
        ctx.globalAlpha=1;
    }

    if(j.st===2){

        const fh=120+Math.sin(t*.5)*10;
        const wig=Math.sin(t*.35)*6;

        ctx.fillStyle='rgba(255,120,40,.85)';
        ctx.beginPath();
        ctx.moveTo(x-13,j.y-8);
        ctx.quadraticCurveTo(x-20,j.y-fh*.55,x-4+wig,j.y-fh);
        ctx.lineTo(x+4+wig,j.y-fh);
        ctx.quadraticCurveTo(x+20,j.y-fh*.55,x+13,j.y-8);
        ctx.fill();

        ctx.fillStyle='rgba(255,220,120,.9)';
        ctx.beginPath();
        ctx.moveTo(x-7,j.y-8);
        ctx.quadraticCurveTo(x-11,j.y-fh*.5,x-2+wig*.6,j.y-fh*.78);
        ctx.lineTo(x+2+wig*.6,j.y-fh*.78);
        ctx.quadraticCurveTo(x+11,j.y-fh*.5,x+7,j.y-8);
        ctx.fill();
    }
}

function drawSpring(s){

    const x=s.x-cam;

    if(x<-40||x>W+40)return;

    const comp=s.t>0?s.t*1.1:0;

    ctx.fillStyle='#23263a';
    ctx.fillRect(x-16,s.y-6,32,6);

    ctx.strokeStyle='#8892a6';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(x-10,s.y-6);
    ctx.lineTo(x+10,s.y-10-comp*.4);
    ctx.lineTo(x-10,s.y-14-comp*.7);
    ctx.stroke();

    ctx.fillStyle='#e04848';
    ctx.fillRect(x-20,s.y-20-comp,40,7);

    ctx.fillStyle='#fff';
    ctx.fillRect(x-20,s.y-18-comp,40,2);
}

function drawChest(c){

    const x=c.x-cam;

    if(x<-40||x>W+40)return;

    if(!c.got){
        ctx.globalAlpha=.4+.3*Math.sin(t*.1);
        ctx.strokeStyle='#ffd43b';
        ctx.lineWidth=2;
        ctx.strokeRect(x-17,c.y-28,34,30);
        ctx.globalAlpha=1;
    }

    ctx.fillStyle='#7a4a22';
    ctx.fillRect(x-15,c.y-18,30,18);

    ctx.fillStyle='#5c3517';
    ctx.fillRect(x-15,c.y-18,30,3);

    ctx.fillStyle='#e5b84d';
    ctx.fillRect(x-2,c.y-14,4,8);

    if(c.got){
        ctx.fillStyle='#241812';
        ctx.fillRect(x-15,c.y-30,30,12);
    }else{
        ctx.fillStyle='#8f5a2c';
        ctx.fillRect(x-15,c.y-26,30,8);
        ctx.fillStyle='#e5b84d';
        ctx.fillRect(x-15,c.y-26,30,2);
    }
}

function drawCp(c){

    const x=c.x-cam;

    if(x<-40||x>W+40)return;

    const wv=c.got?Math.sin(t*.12)*4:0;

    ctx.fillStyle='#c8ccd4';
    ctx.fillRect(x-2,c.y-64,4,64);

    ctx.fillStyle=c.got?'#4ade80':'#6b7280';

    if(c.got){
        ctx.shadowBlur=10;
        ctx.shadowColor='#4ade80';
    }

    ctx.beginPath();
    ctx.moveTo(x+2,c.y-62);
    ctx.lineTo(x+28+wv,c.y-54);
    ctx.lineTo(x+2,c.y-44);
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle='#8b93a3';
    ctx.fillRect(x-6,c.y-2,12,3);
}


// =====================================================
// PICKUP DRAWINGS
// =====================================================

function drawGem(g){

    if(g.got)return;

    const x=g.x-cam;

    if(x<-30||x>W+30)return;

    const bob=Math.sin(t*.06+g.ph)*4;
    const sx=Math.abs(Math.cos(t*.05+g.ph))*.6+.4;

    ctx.save();
    ctx.translate(x,g.y+bob);
    ctx.scale(sx,1);

    ctx.shadowBlur=12;
    ctx.shadowColor='#7ef0ff';

    const gr=ctx.createLinearGradient(0,-12,0,12);

    gr.addColorStop(0,'#bff6ff');
    gr.addColorStop(1,'#3ec6e8');

    ctx.fillStyle=gr;
    ctx.beginPath();
    ctx.moveTo(0,-12);
    ctx.lineTo(9,0);
    ctx.lineTo(0,12);
    ctx.lineTo(-9,0);
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.strokeStyle='rgba(255,255,255,.7)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(0,-12);
    ctx.lineTo(0,12);
    ctx.stroke();

    ctx.restore();
}


// =====================================================
// PLAYER
// =====================================================

function drawPlayer(){

    const x=P.x+14-cam;
    const a=Math.sin(P.anim)*.8;
    const air=!P.gr;

    if(P.gr){
        ctx.fillStyle='rgba(0,0,0,.3)';
        ctx.beginPath();
        ctx.ellipse(x,P.y+P.h,17,4,0,0,TAU);
        ctx.fill();
    }

    ctx.save();

    if(P.inv>0&&Math.floor(P.inv/4)%2)ctx.globalAlpha=.4;

    ctx.translate(x,P.y+P.h);
    ctx.scale(P.face*(1+P.sq),1-P.sq);
    ctx.translate(0,-P.h);

    limb(-4,30,22,9,air?-.5:a,'#172335');
    limb(4,30,22,9,air?.4:-a,'#172335');
    limb(-9,15,18,6,air?-.9:-a*.8,'#c88765');

    ctx.fillStyle='#293d52';
    ctx.fillRect(-11,12,22,20);

    ctx.fillStyle='#466078';
    ctx.fillRect(-8,15,16,13);

    ctx.fillStyle='#88a7bd';
    ctx.fillRect(-1,15,2,13);

    ctx.fillStyle='#c88765';
    ctx.fillRect(-4,10,8,5);

    ctx.beginPath();
    ctx.arc(0,6,9,0,TAU);
    ctx.fill();

    ctx.fillStyle='#161923';
    ctx.beginPath();
    ctx.arc(0,4,10,Math.PI,TAU);
    ctx.fill();

    ctx.fillStyle='#8c3bea';
    ctx.fillRect(-9,2,18,3);

    ctx.fillStyle='#fff';
    ctx.fillRect(3,6,3,2.5);

    const ps=1-P.atk/24;
    const ang=P.atk?2.4+3*(1-Math.pow(1-ps,3)):-.9;

    ctx.save();
    ctx.translate(9,16);

    if(P.atk>=8){
        ctx.globalAlpha=Math.min(1,P.atk/16);
        ctx.strokeStyle='#8cecff';
        ctx.shadowBlur=18;
        ctx.shadowColor='#5edfff';
        ctx.lineWidth=7;
        ctx.beginPath();
        ctx.arc(0,0,66,2.4+Math.PI/2,ang+Math.PI/2);
        ctx.stroke();
        ctx.globalAlpha=1;
        ctx.shadowBlur=0;
    }

    ctx.rotate(ang);

    ctx.fillStyle='#c88765';
    ctx.fillRect(-3,0,6,18);

    ctx.fillStyle='#e5b84d';
    ctx.fillRect(-7,17,14,3);

    ctx.fillStyle='#3a2616';
    ctx.fillRect(-2,19,4,8);

    const bl=ctx.createLinearGradient(-3,0,3,0);

    bl.addColorStop(0,'#fff');
    bl.addColorStop(1,'#7aa4c0');

    ctx.fillStyle=bl;
    ctx.beginPath();
    ctx.moveTo(-3,27);
    ctx.lineTo(3,27);
    ctx.lineTo(0,P.atk?92:80);
    ctx.fill();

    ctx.restore();
    ctx.restore();
}


// =====================================================
// ENEMY DRAWINGS
// =====================================================

function drawWalk(e,x){

    const a=Math.sin(t*.2+e.ph)*.7;
    const fl=e.fl>0;

    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();
    ctx.ellipse(x,e.y+e.h,16,4,0,0,TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(x,e.y);
    ctx.scale(e.face,1);

    limb(-4,28,16,8,a,'#191822');
    limb(4,28,16,8,-a,'#191822');

    ctx.fillStyle=fl?'#fff':'#2a1b39';
    ctx.fillRect(-10,10,20,20);

    ctx.fillStyle='#db3158';
    ctx.fillRect(-11,12,22,4);

    ctx.fillStyle=fl?'#fff':'#25232e';
    ctx.beginPath();
    ctx.arc(0,5,9,0,TAU);
    ctx.fill();

    ctx.fillStyle='#101018';
    ctx.fillRect(-9,4,18,6);

    ctx.fillStyle='#ff355e';
    ctx.fillRect(3,5,4,2.5);

    ctx.save();
    ctx.translate(8,16);
    ctx.rotate(-1.2+Math.sin(t*.2+e.ph)*.15);

    ctx.fillStyle='#bfe9ff';
    ctx.fillRect(-1.5,10,3,26);

    ctx.fillStyle='#6b4a2a';
    ctx.fillRect(-4,8,8,3);

    ctx.restore();
    ctx.restore();
}

function drawSpikeEn(e,x){

    const fl=e.fl>0;
    const sq=1+Math.sin(t*.12+e.ph)*.06;

    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();
    ctx.ellipse(x,e.y+e.h,16,4,0,0,TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(x,e.y+e.h);
    ctx.scale(e.face,1);

    ctx.fillStyle=fl?'#fff':'#8f9aa8';

    for(let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.moveTo(i*9-4,-34);
        ctx.lineTo(i*9,-44+Math.sin(t*.1+i)*1.5);
        ctx.lineTo(i*9+4,-34);
        ctx.fill();
    }

    ctx.fillStyle=fl?'#fff':'#1f8f7a';
    ctx.beginPath();
    ctx.ellipse(0,-17,15*sq,17/sq,0,0,TAU);
    ctx.fill();

    ctx.fillStyle='#155e51';
    ctx.beginPath();
    ctx.ellipse(0,-10,12,8,0,0,TAU);
    ctx.fill();

    ctx.fillStyle='#fff';
    ctx.fillRect(2,-22,5,6);
    ctx.fillRect(-8,-22,5,6);

    ctx.fillStyle='#101018';
    ctx.fillRect(4,-20,3,4);
    ctx.fillRect(-6,-20,3,4);

    ctx.restore();
}

function drawFly(e,x){

    const fl=e.fl>0;
    const fw=Math.sin(t*.55+e.ph);

    ctx.save();
    ctx.translate(x,e.y+12);
    ctx.scale(e.face,1);

    ctx.fillStyle='rgba(210,225,255,.7)';

    ctx.beginPath();
    ctx.moveTo(-2,-2);
    ctx.quadraticCurveTo(-16,-10-fw*9,-24,-2-fw*12);
    ctx.quadraticCurveTo(-14,4,-2,4);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(2,-2);
    ctx.quadraticCurveTo(16,-10-fw*9,24,-2-fw*12);
    ctx.quadraticCurveTo(14,4,2,4);
    ctx.fill();

    ctx.fillStyle=fl?'#fff':'#2c2440';
    ctx.beginPath();
    ctx.ellipse(0,2,11,9,0,0,TAU);
    ctx.fill();

    ctx.fillStyle='#1a1430';
    ctx.fillRect(-6,0,3,8);
    ctx.fillRect(0,-1,3,9);

    ctx.fillStyle='#ff355e';
    ctx.fillRect(3,-3,4,3);
    ctx.fillRect(-7,-3,4,3);

    ctx.fillStyle='#e8e2ff';
    ctx.beginPath();
    ctx.moveTo(-2,10);
    ctx.lineTo(2,10);
    ctx.lineTo(0,16);
    ctx.fill();

    ctx.restore();
}

function drawMage(e,x){

    const fl=e.fl>0;
    const bob=Math.sin(t*.07+e.ph)*2;

    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.beginPath();
    ctx.ellipse(x,e.y+e.h+2,12,3,0,0,TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(x,e.y+bob);
    ctx.scale(e.face,1);

    ctx.strokeStyle='#6b4a2a';
    ctx.lineWidth=3.5;
    ctx.beginPath();
    ctx.moveTo(9,44);
    ctx.lineTo(15,4);
    ctx.stroke();

    const chg=e.cd<26?1-e.cd/26:0;

    ctx.fillStyle='#c07bff';
    ctx.shadowBlur=8+chg*14;
    ctx.shadowColor='#a85cff';
    ctx.beginPath();
    ctx.arc(16,2,4+chg*5+(e.cf>0?4:0),0,TAU);
    ctx.fill();
    ctx.shadowBlur=0;

    ctx.fillStyle=fl?'#fff':'#3b2a5e';
    ctx.beginPath();
    ctx.moveTo(-11,46);
    ctx.lineTo(11,46);
    ctx.lineTo(6,14);
    ctx.lineTo(-6,14);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle='#5a4390';
    ctx.fillRect(-11,42,22,4);

    ctx.fillStyle=fl?'#fff':'#2a1d47';
    ctx.beginPath();
    ctx.arc(0,9,9,0,TAU);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-8,4);
    ctx.lineTo(1,-8);
    ctx.lineTo(8,6);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle='#0c0a16';
    ctx.beginPath();
    ctx.arc(2,9,5.5,0,TAU);
    ctx.fill();

    ctx.fillStyle='#7ef0ff';
    ctx.fillRect(0,7,2.5,2.5);
    ctx.fillRect(5,7,2.5,2.5);

    ctx.restore();
}

function drawBoar(e,x){

    const fl=e.fl>0;
    const run=e.st===2?1:0;
    const legA=run?Math.sin(t*.6)*.7:Math.sin(t*.15+e.ph)*.15;
    const jx=e.st===1?(Math.random()-.5)*3:0;

    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();
    ctx.ellipse(x+jx,e.y+e.h,22,4,0,0,TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(x+jx,e.y+e.h);
    ctx.scale(e.face,1);
    ctx.translate(0,-e.h);

    limb(-12,26,14,7,legA,'#3a2818');
    limb(10,26,14,7,-legA,'#3a2818');
    limb(-6,26,14,7,-legA*.7,'#4a3420');
    limb(14,26,14,7,legA*.7,'#4a3420');

    ctx.fillStyle=fl?'#fff':'#5a3d2b';
    ctx.beginPath();
    ctx.moveTo(-20,10);
    ctx.quadraticCurveTo(-24,26,-14,32);
    ctx.lineTo(12,32);
    ctx.quadraticCurveTo(24,28,22,14);
    ctx.quadraticCurveTo(10,4,-20,10);
    ctx.fill();

    ctx.fillStyle='#3a2818';
    ctx.fillRect(-20,8,40,6);

    ctx.fillStyle=fl?'#fff':'#6b4a33';
    ctx.beginPath();
    ctx.arc(20,16,10,0,TAU);
    ctx.fill();

    ctx.fillStyle='#8a6244';
    ctx.fillRect(26,14,8,7);

    ctx.fillStyle='#f3ead8';
    ctx.beginPath();
    ctx.moveTo(24,22);
    ctx.lineTo(30,26);
    ctx.lineTo(23,26);
    ctx.fill();

    ctx.fillStyle=e.st===1?'#ffd43b':'#ff355e';
    ctx.fillRect(18,12,4,3.5);

    if(e.st===2){
        ctx.strokeStyle='rgba(255,255,255,.35)';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(-24,14);
        ctx.lineTo(-38,14);
        ctx.moveTo(-26,24);
        ctx.lineTo(-42,24);
        ctx.stroke();
    }

    ctx.restore();
}

function drawEn(e){

    if(!e.alive)return;

    const x=e.x+e.w/2-cam;

    if(x<-90||x>W+90)return;

    if(e.type==='walk')drawWalk(e,x);
    else if(e.type==='spike')drawSpikeEn(e,x);
    else if(e.type==='fly')drawFly(e,x);
    else if(e.type==='shoot')drawMage(e,x);
    else drawBoar(e,x);

    if(e.hp<e.mhp){
        ctx.fillStyle='#252b35';
        ctx.fillRect(x-14,e.y-10,28,4);
        ctx.fillStyle='#ff4d6d';
        ctx.fillRect(x-14,e.y-10,28*Math.max(0,e.hp)/e.mhp,4);
    }
}


// =====================================================
// BOSS DRAWING
// =====================================================

function drawBoss(){

    const B=boss;

    if(!B||B.dead)return;

    const x=B.x+B.w/2-cam;

    if(x<-180||x>W+180)return;

    const fl=B.fl>0;
    const tele=B.st==='tele'&&Math.floor(t/4)%2===0;

    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(x,B.arena.y,46,7,0,0,TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(x,B.y+B.h);
    ctx.scale(B.face,1);
    ctx.translate(0,-B.h);

    const la=B.st==='idle'?Math.sin(t*.14)*.5:0;

    limb(-15,B.h-24,26,13,la,fl?'#fff':'#241432');
    limb(15,B.h-24,26,13,-la,fl?'#fff':'#241432');

    // club arm
    ctx.save();
    ctx.translate(-22,22);

    const ca=B.st==='slam'?(B.gr?1.2:-2.6):
        B.st==='tele'?-2.1:
        B.st==='charge'?1.2:
        -.4+Math.sin(t*.07)*.12;

    ctx.rotate(ca);

    ctx.fillStyle=fl?'#fff':'#2c1a3e';
    ctx.fillRect(-7,-5,30,15);

    ctx.fillStyle='#4a3358';
    ctx.fillRect(21,-12,10,34);

    ctx.fillStyle='#5b4468';
    ctx.beginPath();
    ctx.arc(34,6,14,0,TAU);
    ctx.fill();

    ctx.fillStyle='#8f7ba0';

    for(let i=0;i<6;i++){
        const a2=i/6*TAU;
        ctx.beginPath();
        ctx.moveTo(34+Math.cos(a2)*12,6+Math.sin(a2)*12);
        ctx.lineTo(34+Math.cos(a2)*20,6+Math.sin(a2)*20);
        ctx.lineTo(34+Math.cos(a2+.55)*12,6+Math.sin(a2+.55)*12);
        ctx.fill();
    }

    ctx.restore();

    // torso
    ctx.fillStyle=fl?'#fff':'#33204d';
    ctx.beginPath();
    ctx.moveTo(-28,8);
    ctx.quadraticCurveTo(-34,44,-22,58);
    ctx.lineTo(22,58);
    ctx.quadraticCurveTo(34,44,28,8);
    ctx.quadraticCurveTo(0,0,-28,8);
    ctx.fill();

    ctx.fillStyle=fl?'#fff':'#452d68';
    ctx.beginPath();
    ctx.ellipse(0,40,17,13,0,0,TAU);
    ctx.fill();

    ctx.fillStyle='#574063';
    ctx.beginPath();
    ctx.moveTo(-28,10);
    ctx.lineTo(-38,-4);
    ctx.lineTo(-16,6);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(28,10);
    ctx.lineTo(38,-4);
    ctx.lineTo(16,6);
    ctx.fill();

    // head
    ctx.fillStyle=fl?'#fff':'#33204d';
    ctx.beginPath();
    ctx.arc(0,0,16,0,TAU);
    ctx.fill();

    ctx.fillStyle='#c9b8d8';
    ctx.beginPath();
    ctx.moveTo(-9,-9);
    ctx.lineTo(-19,-24);
    ctx.lineTo(-3,-12);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(9,-9);
    ctx.lineTo(19,-24);
    ctx.lineTo(3,-12);
    ctx.fill();

    ctx.fillStyle=tele?'#ffd43b':'#ff355e';
    ctx.fillRect(-9,-3,6,4);
    ctx.fillRect(3,-3,6,4);

    ctx.fillStyle='#241432';
    ctx.fillRect(-11,-7,22,3);
    ctx.fillRect(-4,7,8,3);

    const fa=B.st==='charge'?1.25:
        B.st==='slam'?(B.gr?1.3:-2.7):
        B.st==='tele'?-2.3:
        .3+Math.sin(t*.07)*.15;

    limb(24,20,32,14,fa,fl?'#fff':'#2c1a3e');

    if(tele){
        ctx.fillStyle='#ffd43b';
        ctx.font='bold 26px system-ui';
        ctx.textAlign='center';
        ctx.fillText('!',0,-34);
    }

    ctx.restore();
}


// =====================================================
// DRAW
// =====================================================

function draw(){

    bg();

    ctx.save();

    if(shake>.3){
        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );
    }

    plats.forEach(drawPlat);

    for(const s of spk)drawSpk(s);
    for(const s of saws)drawSaw(s);
    for(const p of pends)drawPend(p);
    for(const j of jets)drawJet(j);
    for(const s of springs)drawSpring(s);
    for(const c of chests)drawChest(c);
    for(const c of cps)drawCp(c);

    // portal
    const px=portal.x-cam;
    const pl=Math.sin(t*.1)*4;

    ctx.save();

    if(portal.open){
        ctx.shadowBlur=28;
        ctx.shadowColor='#a85cff';
        ctx.strokeStyle='#c277ff';
    }else{
        ctx.strokeStyle='#4a4f5a';
    }

    ctx.lineWidth=8;

    ctx.beginPath();
    ctx.ellipse(px+30,portal.y+55,28+pl,50+pl,0,0,TAU);
    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.fillStyle=portal.open?'rgba(130,50,220,.3)':'rgba(40,44,54,.5)';

    ctx.beginPath();
    ctx.ellipse(px+30,portal.y+55,24,44,0,0,TAU);
    ctx.fill();

    if(!portal.open){
        // chains + lock
        ctx.strokeStyle='#888e99';
        ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(px,portal.y+10);
        ctx.lineTo(px+60,portal.y+100);
        ctx.moveTo(px+60,portal.y+10);
        ctx.lineTo(px,portal.y+100);
        ctx.stroke();

        ctx.fillStyle='#e5b84d';
        ctx.fillRect(px+21,portal.y+44,18,14);
        ctx.beginPath();
        ctx.arc(px+30,portal.y+44,7,Math.PI,0);
        ctx.fill();
    }else{
        for(let i=0;i<3;i++){
            const a=t*.06+i/3*TAU;
            ctx.fillStyle='#e0b8ff';
            ctx.beginPath();
            ctx.arc(px+30+Math.cos(a)*26,portal.y+55+Math.sin(a)*40,2.5,0,TAU);
            ctx.fill();
        }
    }

    ctx.restore();

    // pickups
    for(const c of cns){

        if(!c.got){

            const s=Math.max(.25,Math.abs(Math.cos(c.a)));

            ctx.save();
            ctx.translate(c.x-cam,c.y);
            ctx.scale(s,1);

            ctx.fillStyle='#ffd43b';
            ctx.beginPath();
            ctx.arc(0,0,10,0,TAU);
            ctx.fill();

            ctx.strokeStyle='#fff1a1';
            ctx.lineWidth=2.5;
            ctx.stroke();

            ctx.restore();
        }
    }

    for(const g of gems)drawGem(g);

    for(const h of hts){
        if(!h.got){
            ctx.font='22px serif';
            ctx.textAlign='center';
            ctx.fillText('❤️',h.x-cam,h.y+Math.sin(t*.08)*4);
        }
    }

    // shockwaves
    for(const w of waves){

        const x=w.x-cam;
        const h=22+Math.sin(t*.4)*4;

        ctx.fillStyle='rgba(255,140,50,.9)';
        ctx.beginPath();
        ctx.moveTo(x-14,w.y);
        ctx.quadraticCurveTo(x-4,w.y-h,x,w.y-h-6);
        ctx.quadraticCurveTo(x+4,w.y-h,x+14,w.y);
        ctx.fill();

        ctx.fillStyle='rgba(255,220,120,.9)';
        ctx.beginPath();
        ctx.moveTo(x-7,w.y);
        ctx.quadraticCurveTo(x,w.y-h*.55,x+7,w.y);
        ctx.fill();
    }

    ens.forEach(drawEn);
    drawBoss();

    // projectiles
    for(const p of projs){

        const x=p.x-cam;

        if(x<-30||x>W+30)continue;

        ctx.save();
        ctx.translate(x,p.y);

        ctx.shadowBlur=12;
        ctx.shadowColor=p.orb?'#a85cff':'#ff8c40';

        ctx.fillStyle=p.orb?'#c07bff':'#8a6244';

        ctx.beginPath();
        ctx.arc(0,0,p.r,0,TAU);
        ctx.fill();

        ctx.shadowBlur=0;

        ctx.fillStyle=p.orb?'#e8d0ff':'#5c3517';
        ctx.beginPath();
        ctx.arc(-p.r*.3,-p.r*.3,p.r*.35,0,TAU);
        ctx.fill();

        ctx.restore();
    }

    drawPlayer();

    for(const p of parts){
        ctx.globalAlpha=p.l/p.m;
        ctx.fillStyle=p.c;
        ctx.beginPath();
        ctx.arc(p.x-cam,p.y,p.s,0,TAU);
        ctx.fill();
    }

    ctx.globalAlpha=1;

    ctx.restore();

    // vignette
    ctx.setTransform(1,0,0,1,0,0);

    const vg=ctx.createRadialGradient(
        cv.width/2,cv.height/2,cv.height*.4,
        cv.width/2,cv.height/2,cv.height*.95
    );

    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,.45)');

    ctx.fillStyle=vg;
    ctx.fillRect(0,0,cv.width,cv.height);

    ctx.setTransform(sc,0,0,sc,0,0);

    // boss HP bar
    if(boss&&boss.awake&&!boss.dead){

        const bw=Math.min(430,W*.66);
        const bx=(W-bw)/2;
        const by=64;

        ctx.fillStyle='rgba(5,10,20,.7)';
        ctx.fillRect(bx-3,by-3,bw+6,20);

        ctx.fillStyle='#3a1520';
        ctx.fillRect(bx,by,bw,14);

        ctx.fillStyle=boss.st==='rest'?'#ffd43b':'#ff4d6d';
        ctx.fillRect(bx,by,bw*Math.max(0,boss.hp)/boss.mhp,14);

        ctx.strokeStyle='rgba(255,255,255,.35)';
        ctx.lineWidth=1;
        ctx.strokeRect(bx,by,bw,14);

        ctx.fillStyle='#fff';
        ctx.font='bold 10px system-ui';
        ctx.textAlign='center';
        ctx.fillText('⚔ ARENA GUARDIAN ⚔',W/2,by+11);
    }

    // messages
    let mi=0;

    for(const m of msgs){

        m.t++;

        const pr=m.t<12?m.t/12:1;
        const en=m.l-m.t<24?(m.l-m.t)/24:1;

        ctx.globalAlpha=Math.max(0,Math.min(pr,en));
        ctx.font='800 26px system-ui';
        ctx.textAlign='center';
        ctx.lineWidth=5;
        ctx.strokeStyle='rgba(0,0,0,.7)';

        const yy=120+mi*34-(1-pr)*14;

        ctx.strokeText(m.txt,W/2,yy);
        ctx.fillStyle=m.col;
        ctx.fillText(m.txt,W/2,yy);

        mi++;
    }

    ctx.globalAlpha=1;

    msgs=msgs.filter(m=>m.t<m.l);

    // HUD
    $('sc').textContent=score;
    $('co').textContent=coins;
    $('lvl').textContent=TH.emo+' Lv '+level;
    $('hf').style.width=Math.max(0,P.hp)+'%';
    $('lv').textContent='♥'.repeat(Math.max(lives,0));
}


// =====================================================
// GAME LOOP
// =====================================================

let last=performance.now();
let acc=0;

function loop(n){

    requestAnimationFrame(loop);

    acc+=Math.min((n-last)/1000,.1);
    last=n;

    while(acc>=1/60){
        if(st==='play')step();
        acc-=1/60;
    }

    draw();
}


// =====================================================
// START
// =====================================================

build();

show(
    '⚔️ Platform Adventure',
    '<b>A / D</b> or <b>← / →</b> — move<br>'+
    '<b>W / Space / ↑</b> — jump · hold for higher<br>'+
    '<b>J</b> / <b>click</b> / <b>⚔</b> — sword (deflects orbs!)<br>'+
    'Stomp foes — but <b>spiked ones hurt to stomp</b><br>'+
    'Dodge spikes, saws, pendulums & flames<br>'+
    '🚩 flags = checkpoints · open 🧰 for treasure<br>'+
    'Every level ends with a <b>GUARDIAN</b> —<br>'+
    'defeat it to unlock the portal'+
    (best?'<br>🏆 Best: <b>'+best+'</b>':''),
    'START GAME',
    newGame
);

requestAnimationFrame(loop);

})();
</script>
