<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Platform Adventure</title>

<style>
:root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#07111f;
    --fg:#fff;
    --mut:#c6ceda
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--fg);
    font-family:system-ui,Arial,sans-serif;
    user-select:none;
    touch-action:none
}

canvas{
    display:block;
    width:100%;
    height:100%
}

#hud{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top,0px));
    left:12px;
    right:12px;
    z-index:5;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:space-between;
    pointer-events:none
}

.hb{
    background:rgba(5,10,20,.8);
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    padding:8px 12px;
    font-weight:700;
    font-size:14px;
    backdrop-filter:blur(8px)
}

.bar{
    width:140px;
    height:11px;
    background:#252b35;
    border-radius:20px;
    overflow:hidden;
    margin-top:5px
}

#hf{
    height:100%;
    width:100%;
    background:#27e36a;
    transition:width .15s
}

.ov{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.72)
}

.pn{
    width:min(90%,480px);
    padding:30px;
    text-align:center;
    background:rgba(12,19,33,.96);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px
}

.pn h1{
    font-size:32px;
    margin-bottom:14px
}

.pn p{
    color:var(--mut);
    line-height:1.7;
    margin-bottom:22px;
    font-size:15px
}

button{
    border:0;
    border-radius:12px;
    padding:13px 28px;
    background:#7657ed;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer
}

.hidden{
    display:none!important
}

#mc{
    position:fixed;
    left:14px;
    right:14px;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    z-index:10;
    display:none;
    justify-content:space-between;
    pointer-events:none
}

.g{
    display:flex;
    gap:12px
}

.mb{
    pointer-events:auto;
    width:64px;
    height:64px;
    border-radius:50%;
    background:rgba(10,15,28,.8);
    border:1px solid rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    touch-action:none
}

.mb:active{
    background:rgba(120,90,240,.7)
}

@media(pointer:coarse){
    #mc{
        display:flex
    }
}

@media(max-width:600px){
    .hb{
        font-size:12px;
        padding:6px 8px
    }

    .bar{
        width:90px
    }
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="hud">
    <div class="hb">
        ❤️ Health
        <div class="bar">
            <div id="hf"></div>
        </div>
    </div>

    <div class="hb" id="lv"></div>

    <div class="hb">
        ⭐ <span id="sc">0</span>
    </div>

    <div class="hb">
        🪙 <span id="co">0</span>
    </div>

    <div class="hb">
        🏆 Level <span id="lvl">1</span>
    </div>
</div>

<div id="ov" class="ov">
    <div class="pn">
        <h1 id="ot"></h1>
        <p id="op"></p>
        <button id="ob"></button>
    </div>
</div>

<div id="mc">
    <div class="g">
        <div class="mb" id="bl">◀</div>
        <div class="mb" id="br">▶</div>
    </div>

    <div class="g">
        <div class="mb" id="bj">⬆</div>
        <div class="mb" id="ba" style="background:rgba(110,50,190,.9)">⚔</div>
    </div>
</div>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const cv=$('c');
const ctx=cv.getContext('2d');

const LH=600;
const TAU=Math.PI*2;

let sc=1;
let W=800;

function rs(){
    const d=Math.min(devicePixelRatio||1,2);

    cv.width=innerWidth*d;
    cv.height=innerHeight*d;

    sc=cv.height/LH;
    W=cv.width/sc;
}

addEventListener('resize',rs);
rs();

const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;

const hash=i=>{
    const s=Math.sin(i*127.1)*43758.5453;
    return s-Math.floor(s);
};

let st='start';
let score=0;
let coins=0;
let level=1;
let lives=3;
let best=0;
let cam=0;
let shake=0;
let hitstop=0;
let t=0;
let WW=3000;

try{
    best=+localStorage.getItem('platBest')||0;
}catch(e){}

let plats=[];
let ens=[];
let cns=[];
let hts=[];
let parts=[];

let portal={
    x:0,
    y:0,
    w:60,
    h:110
};

const P={
    x:100,
    y:448,
    w:28,
    h:52,
    vx:0,
    vy:0,
    face:1,
    hp:100,
    gr:false,
    coy:0,
    buf:0,
    inv:0,
    atk:0,
    cd:0,
    kb:0,
    hits:new Set(),
    anim:0,
    safe:{
        x:100,
        y:448
    },
    sq:0,
    onp:null
};

const K={
    l:0,
    r:0,
    j:0
};

const stars=Array.from(
    {length:90},
    (_,i)=>[
        hash(i),
        hash(i+99),
        1+hash(i+7)*1.6,
        hash(i+3)*6
    ]
);


// =====================================================
// LEVEL
// =====================================================

function build(){

    const R=rng(level*7919+13);

    plats=[];
    ens=[];
    cns=[];
    hts=[];
    parts=[];

    let x=700;
    let y=500;

    plats.push({
        x:0,
        y:500,
        w:700
    });

    const n=12+level*3;

    for(let i=0;i<n;i++){

        x+=70+R()*Math.min(80,50+level*6);

        y=Math.max(
            300,
            Math.min(
                500,
                y+(R()-.5)*190
            )
        );

        const w=200+R()*240;

        plats.push({
            x,
            y,
            w
        });

        if(
            i>0 &&
            R()<.6+level*.03
        ){

            const hp=
                2+
                (level>2)+
                (level>5);

            ens.push({
                x:x+w/2-14,
                y:y-44,
                w:28,
                h:44,
                face:1,
                hp,
                mhp:hp,
                min:x+8,
                max:x+w-36,
                fl:0,
                kb:0,
                alive:1,
                sp:.9+level*.07,
                ph:R()*6
            });
        }

        for(let k=1;k<=4;k++){

            cns.push({
                x:x+w*k/5,
                y:y-50-Math.sin(k/5*Math.PI)*30,
                a:k,
                got:0
            });
        }

        if(i%5===3){

            hts.push({
                x:x+w/2,
                y:y-70,
                got:0
            });
        }

        x+=w;
    }

    x+=90;

    plats.push({
        x,
        y,
        w:700
    });

    WW=x+700;

    portal.x=WW-220;
    portal.y=y-110;

    Object.assign(P,{
        x:100,
        y:500-P.h,
        vx:0,
        vy:0,
        hp:100,
        inv:60,
        atk:0,
        cd:0,
        kb:0,
        safe:{
            x:100,
            y:448
        }
    });

    cam=0;
}


// =====================================================
// NEW GAME
// =====================================================

function newGame(){

    score=0;
    coins=0;
    level=1;
    lives=3;

    build();

    st='play';
}


// =====================================================
// OVERLAY
// =====================================================

function show(t,p,b,f){

    $('ot').textContent=t;
    $('op').innerHTML=p;
    $('ob').textContent=b;

    $('ov').classList.remove('hidden');

    $('ob').onclick=()=>{
        $('ov').classList.add('hidden');
        f();
    };
}


// =====================================================
// INPUT
// =====================================================

const km={
    KeyA:'l',
    ArrowLeft:'l',
    KeyD:'r',
    ArrowRight:'r',
    KeyW:'j',
    ArrowUp:'j',
    Space:'j'
};

addEventListener('keydown',e=>{

    if(km[e.code]){

        e.preventDefault();

        if(
            km[e.code]==='j' &&
            !e.repeat &&
            !K.j
        ){
            P.buf=7;
        }

        K[km[e.code]]=1;
    }

   if(
    (e.code==='Enter' || e.code==='KeyJ' || e.code==='KeyK') &&
    !e.repeat
  ){
    e.preventDefault();
    attack();
  }

    if(
        (e.code==='KeyP'||e.code==='Escape') &&
        st==='play'
    ){
        st='pause';

        show(
            'Paused',
            '',
            'RESUME',
            ()=>st='play'
        );
    }
});

addEventListener('keyup',e=>{
    if(km[e.code]){
        K[km[e.code]]=0;
    }
});

addEventListener('blur',()=>{
    K.l=K.r=K.j=0;
});

cv.addEventListener('mousedown',e=>{
    if(e.button===0)attack();
});

cv.addEventListener(
    'contextmenu',
    e=>e.preventDefault()
);

function hold(id,k){

    const e=$(id);

    e.addEventListener(
        'pointerdown',
        ev=>{
            ev.preventDefault();

            if(k==='j'&&!K.j){
                P.buf=7;
            }

            K[k]=1;
        }
    );

    [
        'pointerup',
        'pointerleave',
        'pointercancel'
    ].forEach(n=>
        e.addEventListener(
            n,
            ()=>K[k]=0
        )
    );
}

hold('bl','l');
hold('br','r');
hold('bj','j');

$('ba').addEventListener(
    'pointerdown',
    e=>{
        e.preventDefault();
        attack();
    }
);

function attack(){

    if(st!=='play'||P.cd>0)return;

    P.atk=24;
    P.cd=26;
    P.hits=new Set();
}


// =====================================================
// FX
// =====================================================

function puff(x,y,n,c){

    for(let i=0;i<n;i++){

        parts.push({
            x,
            y,
            vx:(Math.random()-.5)*3,
            vy:-Math.random()*1.5,
            l:22,
            m:22,
            c:c||'#9aa5a0',
            s:2+Math.random()*3,
            g:.02
        });
    }
}

function spark(x,y,n,c){

    for(let i=0;i<n;i++){

        parts.push({
            x,
            y,
            vx:(Math.random()-.5)*9,
            vy:(Math.random()-.5)*9,
            l:24,
            m:24,
            c:c||'#8cecff',
            s:2+Math.random()*2,
            g:.25
        });
    }
}


// =====================================================
// PHYSICS
// =====================================================

function mv(o,dx,dy){

    if(dx){

        o.x+=dx;

        for(const p of plats){

            if(
                o.x<p.x+p.w &&
                o.x+o.w>p.x &&
                o.y+o.h>p.y+.5 &&
                o.y<p.y+900
            ){

                o.x=dx>0
                    ?p.x-o.w
                    :p.x+p.w;

                o.vx=0;
            }
        }
    }

    if(dy){

        o.y+=dy;

        for(const p of plats){

            if(
                o.x<p.x+p.w &&
                o.x+o.w>p.x &&
                o.y+o.h>p.y &&
                o.y<p.y+900
            ){

                if(dy>0){

                    o.y=p.y-o.h;
                    o.vy=0;
                    o.gr=true;
                    o.onp=p;

                }else{

                    o.y=p.y+900;
                    o.vy=0;
                }
            }
        }
    }
}

function respawn(){

    P.x=P.safe.x;
    P.y=P.safe.y;

    P.vx=0;
    P.vy=0;

    P.inv=100;
    P.kb=0;
}

function die(){

    lives--;

    if(lives<=0){

        st='over';

        if(score>best){

            best=score;

            try{
                localStorage.setItem(
                    'platBest',
                    best
                );
            }catch(e){}
        }

        show(
            '💀 Game Over',
            'Score <b>'+score+
            '</b> · Coins <b>'+coins+
            '</b> · Best <b>'+best+'</b>',
            'PLAY AGAIN',
            newGame
        );

    }else{

        P.hp=100;
        respawn();
    }
}

function hurt(d,dir){

    P.hp-=d;
    P.inv=70;
    P.vx=dir*6;
    P.vy=-6;
    P.kb=12;

    shake=9;
    hitstop=4;

    spark(
        P.x+14,
        P.y+26,
        10,
        '#ff5b6e'
    );

    if(P.hp<=0){

        P.hp=0;
        die();
    }
}

function hitEn(e,dir){

    e.hp--;
    e.fl=8;
    e.kb=dir*6;

    hitstop=3;
    shake=5;

    spark(
        e.x+14,
        e.y+22,
        10
    );

    if(e.hp<=0){

        e.alive=0;
        score+=100;

        spark(
            e.x+14,
            e.y+22,
            26,
            '#ff9ab0'
        );

        if(Math.random()<.35){

            cns.push({
                x:e.x+14,
                y:e.y,
                a:0,
                got:0
            });
        }
    }
}


// =====================================================
// STEP
// =====================================================

function step(){

    shake*=.85;

    if(hitstop>0){
        hitstop--;
        return;
    }

    t++;

    if(P.cd>0)P.cd--;
    if(P.inv>0)P.inv--;
    if(P.atk>0)P.atk--;

    if(P.kb>0){

        P.kb--;

    }else{

        const d=K.r-K.l;

        if(d){

            P.vx+=d*(P.gr?.7:.4);
            P.face=d;

        }else{

            P.vx*=P.gr?.78:.96;
        }

        P.vx=Math.max(
            -5.2,
            Math.min(5.2,P.vx)
        );

        if(P.atk&&P.gr){
            P.vx*=.88;
        }
    }

    P.coy=P.gr?7:P.coy-1;

    if(P.buf>0)P.buf--;

    if(P.buf>0&&P.coy>0){

        P.vy=-13.5;
        P.coy=0;
        P.buf=0;
        P.gr=false;

        puff(
            P.x+14,
            P.y+52,
            5
        );
    }

    if(!K.j&&P.vy<-5){
        P.vy*=.6;
    }

    P.vy=Math.min(
        P.vy+.62,
        16
    );

    mv(P,P.vx,0);

    const was=P.vy;

    P.gr=false;

    mv(P,0,P.vy);

    if(P.gr&&was>7){

        puff(
            P.x+14,
            P.y+52,
            8
        );

        P.sq=.25;
    }

    P.sq*=.8;

    if(
        P.gr &&
        Math.abs(P.vx)>.5
    ){

        P.anim+=Math.abs(P.vx)*.07;

        if(
            Math.abs(P.vx)>3 &&
            t%9===0
        ){

            puff(
                P.x+14,
                P.y+52,
                1
            );
        }
    }

    if(P.x<0){

        P.x=0;
        P.vx=0;
    }

    if(
        P.gr &&
        P.onp
    ){

        const p=P.onp;

        if(
            P.x>p.x+30 &&
            P.x+P.w<p.x+p.w-30
        ){

            P.safe={
                x:P.x,
                y:P.y
            };
        }
    }


    // =================================================
    // FALLING DOWN = RESTART ENTIRE MATCH
    // =================================================

    if(P.y>LH+120){

        // Completely restart the match.
        // Level, score, coins and lives return to the beginning.
        newGame();

        return;
    }


    // =================================================
    // ATTACK HIT WINDOW
    // =================================================

    if(P.atk>=10&&P.atk<=18){

        const hx=P.face>0
            ?P.x+P.w
            :P.x-72;

        for(const e of ens){

            if(
                e.alive &&
                !P.hits.has(e) &&
                e.x<hx+72 &&
                e.x+e.w>hx &&
                e.y<P.y+58 &&
                e.y+e.h>P.y-6
            ){

                P.hits.add(e);

                hitEn(
                    e,
                    P.face
                );
            }
        }
    }


    // =================================================
    // ENEMIES
    // =================================================

    for(const e of ens){

        if(!e.alive)continue;

        if(e.fl>0)e.fl--;

        if(e.kb){

            e.x+=e.kb;
            e.kb*=.85;

            if(Math.abs(e.kb)<.3){
                e.kb=0;
            }

        }else{

            const dx=P.x-e.x;

            if(
                Math.abs(dx)<240 &&
                Math.abs(P.y-e.y)<90
            ){

                e.face=dx>0?1:-1;

                e.x+=e.face*e.sp*1.5;

            }else{

                e.x+=e.face*e.sp*.6;

                if(e.x<=e.min)e.face=1;
                if(e.x>=e.max)e.face=-1;
            }
        }

        e.x=Math.max(
            e.min,
            Math.min(e.max,e.x)
        );

        if(
            P.x<e.x+e.w &&
            P.x+P.w>e.x &&
            P.y<e.y+e.h &&
            P.y+P.h>e.y
        ){

            if(
                P.vy>1.5 &&
                P.y+P.h-e.y<24
            ){

                hitEn(e,P.face);

                P.vy=-9.5;
                P.gr=false;

                score+=10;

            }else if(P.inv<=0){

                hurt(
                    12,
                    e.x<P.x?1:-1
                );
            }
        }
    }


    // =================================================
    // COINS
    // =================================================

    for(const c of cns){

        if(!c.got){

            c.a+=.08;

            if(
                Math.hypot(
                    P.x+14-c.x,
                    P.y+26-c.y
                )<32
            ){

                c.got=1;
                coins++;
                score+=25;

                spark(
                    c.x,
                    c.y,
                    8,
                    '#ffd43b'
                );
            }
        }
    }


    // =================================================
    // HEALTH
    // =================================================

    for(const h of hts){

        if(
            !h.got &&
            Math.hypot(
                P.x+14-h.x,
                P.y+26-h.y
            )<34 &&
            P.hp<100
        ){

            h.got=1;

            P.hp=Math.min(
                100,
                P.hp+25
            );

            spark(
                h.x,
                h.y,
                12,
                '#ff6b8a'
            );
        }
    }


    // =================================================
    // PORTAL
    // =================================================

    if(
        P.x+P.w>portal.x &&
        P.x<portal.x+portal.w &&
        P.y+P.h>portal.y &&
        P.y<portal.y+portal.h
    ){

        st='clear';
        score+=500;

        show(
            '🎉 Level Complete!',
            'Score <b>'+score+'</b>',
            'NEXT LEVEL',
            ()=>{
                level++;
                build();
                st='play';
            }
        );
    }


    // =================================================
    // PARTICLES
    // =================================================

    for(const p of parts){

        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=p.g;
        p.l--;
    }

    parts=parts.filter(
        p=>p.l>0
    );


    // =================================================
    // CAMERA
    // =================================================

    const tg=P.x+P.face*60-W*.4;

    cam+=(tg-cam)*.1;

    cam=Math.max(
        0,
        Math.min(cam,WW-W)
    );
}


// =====================================================
// DRAWING
// =====================================================

function limb(x,y,l,w,a,c){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(a);

    ctx.fillStyle=c;

    ctx.fillRect(
        -w/2,
        0,
        w,
        l
    );

    ctx.restore();
}

function ridge(par,base,amp,col,sd){

    ctx.fillStyle=col;

    ctx.beginPath();

    ctx.moveTo(
        0,
        LH
    );

    for(
        let x=0;
        x<=W+30;
        x+=30
    ){

        const u=x+cam*par;

        ctx.lineTo(
            x,
            base-
            amp*
            (
                .5+
                .3*Math.sin(u*.004+sd)+
                .2*Math.sin(u*.011+sd*2)+
                .1*Math.sin(u*.027)
            )
        );
    }

    ctx.lineTo(
        W+30,
        LH
    );

    ctx.fill();
}


// =====================================================
// BACKGROUND
// =====================================================

function bg(){

    const g=ctx.createLinearGradient(
        0,
        0,
        0,
        cv.height
    );

    g.addColorStop(
        0,
        '#060d1f'
    );

    g.addColorStop(
        .6,
        '#17395c'
    );

    g.addColorStop(
        1,
        '#2d5a55'
    );

    ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        cv.width,
        cv.height
    );

    ctx.setTransform(
        sc,
        0,
        0,
        sc,
        0,
        0
    );

    ctx.fillStyle='#fff';

    for(const s of stars){

        ctx.globalAlpha=
            .35+
            .35*Math.sin(
                t*.03+s[3]
            );

        ctx.fillRect(
            ((s[0]*W-cam*.02)%W+W)%W,
            s[1]*320,
            s[2],
            s[2]
        );
    }

    ctx.globalAlpha=1;

    const mg=ctx.createRadialGradient(
        W-140,
        90,
        10,
        W-140,
        90,
        110
    );

    mg.addColorStop(
        0,
        'rgba(255,243,189,.9)'
    );

    mg.addColorStop(
        .3,
        'rgba(255,243,189,.25)'
    );

    mg.addColorStop(
        1,
        'rgba(255,243,189,0)'
    );

    ctx.fillStyle=mg;

    ctx.fillRect(
        W-260,
        0,
        260,
        220
    );

    ctx.fillStyle='#fff3bd';

    ctx.beginPath();

    ctx.arc(
        W-140,
        90,
        34,
        0,
        TAU
    );

    ctx.fill();

    ridge(
        .08,
        430,
        170,
        '#12283f',
        1
    );

    ridge(
        .18,
        480,
        130,
        '#0f2437',
        3
    );

    ctx.fillStyle='#0c2a26';

    const i0=
        Math.floor(cam*.4/110)-1;

    for(
        let i=i0;
        i<i0+W/110+3;
        i++
    ){

        const x=
            i*110-cam*.4;

        const h=
            70+
            hash(i)*70;

        ctx.beginPath();

        ctx.moveTo(
            x-30,
            LH-40
        );

        ctx.lineTo(
            x+15,
            LH-40-h
        );

        ctx.lineTo(
            x+60,
            LH-40
        );

        ctx.fill();

        ctx.fillRect(
            x-30,
            LH-40,
            90,
            60
        );
    }

    const f=ctx.createLinearGradient(
        0,
        330,
        0,
        LH
    );

    f.addColorStop(
        0,
        'rgba(70,130,150,0)'
    );

    f.addColorStop(
        1,
        'rgba(70,130,150,.28)'
    );

    ctx.fillStyle=f;

    ctx.fillRect(
        0,
        330,
        W,
        LH-330
    );
}


// =====================================================
// PLATFORM
// =====================================================

function plat(p){

    const x=p.x-cam;

    if(
        x+p.w<0||
        x>W
    )return;

    const g=ctx.createLinearGradient(
        0,
        p.y,
        0,
        p.y+220
    );

    g.addColorStop(
        0,
        '#5b4130'
    );

    g.addColorStop(
        1,
        '#241812'
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        x,
        p.y,
        p.w,
        LH-p.y+60
    );

    ctx.fillStyle='rgba(0,0,0,.22)';

    for(
        let i=14;
        i<p.w;
        i+=34
    ){

        const h=hash(p.x+i);

        ctx.fillRect(
            x+i,
            p.y+20+h*90,
            6+h*8,
            4+h*5
        );
    }

    ctx.fillStyle='#3c9d4d';

    ctx.fillRect(
        x,
        p.y,
        p.w,
        12
    );

    ctx.fillStyle='#6ccf62';

    ctx.fillRect(
        x,
        p.y,
        p.w,
        3
    );

    ctx.fillStyle='#4fb458';

    for(
        let i=0;
        i<p.w;
        i+=9
    ){

        const h=
            3+
            hash(p.x+i)*6;

        ctx.beginPath();

        ctx.moveTo(
            x+i,
            p.y
        );

        ctx.lineTo(
            x+i+3,
            p.y-h
        );

        ctx.lineTo(
            x+i+6,
            p.y
        );

        ctx.fill();
    }

    ctx.fillStyle='rgba(0,0,0,.28)';

    ctx.fillRect(
        x+p.w-6,
        p.y,
        6,
        LH
    );
}


// =====================================================
// PLAYER
// =====================================================

function drawPlayer(){

    const x=P.x+14-cam;
    const a=Math.sin(P.anim)*.8;
    const air=!P.gr;

    if(P.gr){

        ctx.fillStyle='rgba(0,0,0,.3)';

        ctx.beginPath();

        ctx.ellipse(
            x,
            P.y+P.h,
            17,
            4,
            0,
            0,
            TAU
        );

        ctx.fill();
    }

    ctx.save();

    if(
        P.inv>0 &&
        Math.floor(P.inv/4)%2
    ){
        ctx.globalAlpha=.4;
    }

    ctx.translate(
        x,
        P.y+P.h
    );

    ctx.scale(
        P.face*(1+P.sq),
        1-P.sq
    );

    ctx.translate(
        0,
        -P.h
    );

    limb(
        -4,
        30,
        22,
        9,
        air?-.5:a,
        '#172335'
    );

    limb(
        4,
        30,
        22,
        9,
        air?.4:-a,
        '#172335'
    );

    limb(
        -9,
        15,
        18,
        6,
        air?-.9:-a*.8,
        '#c88765'
    );

    ctx.fillStyle='#293d52';

    ctx.fillRect(
        -11,
        12,
        22,
        20
    );

    ctx.fillStyle='#466078';

    ctx.fillRect(
        -8,
        15,
        16,
        13
    );

    ctx.fillStyle='#88a7bd';

    ctx.fillRect(
        -1,
        15,
        2,
        13
    );

    ctx.fillStyle='#c88765';

    ctx.fillRect(
        -4,
        10,
        8,
        5
    );

    ctx.beginPath();

    ctx.arc(
        0,
        6,
        9,
        0,
        TAU
    );

    ctx.fill();

    ctx.fillStyle='#161923';

    ctx.beginPath();

    ctx.arc(
        0,
        4,
        10,
        Math.PI,
        TAU
    );

    ctx.fill();

    ctx.fillStyle='#8c3bea';

    ctx.fillRect(
        -9,
        2,
        18,
        3
    );

    ctx.fillStyle='#fff';

    ctx.fillRect(
        3,
        6,
        3,
        2.5
    );

    const ps=
        1-P.atk/24;

    const ang=
        P.atk
        ?2.4+3*(1-Math.pow(1-ps,3))
        :-.9;

    ctx.save();

    ctx.translate(
        9,
        16
    );

    if(P.atk>=8){

        ctx.globalAlpha=
            Math.min(
                1,
                P.atk/16
            );

        ctx.strokeStyle='#8cecff';
        ctx.shadowBlur=18;
        ctx.shadowColor='#5edfff';
        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            66,
            2.4+Math.PI/2,
            ang+Math.PI/2
        );

        ctx.stroke();

        ctx.globalAlpha=1;
        ctx.shadowBlur=0;
    }

    ctx.rotate(ang);

    ctx.fillStyle='#c88765';

    ctx.fillRect(
        -3,
        0,
        6,
        18
    );

    ctx.fillStyle='#e5b84d';

    ctx.fillRect(
        -7,
        17,
        14,
        3
    );

    ctx.fillStyle='#3a2616';

    ctx.fillRect(
        -2,
        19,
        4,
        8
    );

    const bl=
        ctx.createLinearGradient(
            -3,
            0,
            3,
            0
        );

    bl.addColorStop(
        0,
        '#fff'
    );

    bl.addColorStop(
        1,
        '#7aa4c0'
    );

    ctx.fillStyle=bl;

    ctx.beginPath();

    ctx.moveTo(
        -3,
        27
    );

    ctx.lineTo(
        3,
        27
    );

    ctx.lineTo(
        0,
        P.atk?92:80
    );

    ctx.fill();

    ctx.restore();
    ctx.restore();
}


// =====================================================
// ENEMY
// =====================================================

function drawEn(e){

    if(!e.alive)return;

    const x=e.x+14-cam;
    const a=
        Math.sin(
            t*.2+e.ph
        )*.7;

    const fl=e.fl>0;

    ctx.fillStyle='rgba(0,0,0,.3)';

    ctx.beginPath();

    ctx.ellipse(
        x,
        e.y+e.h,
        16,
        4,
        0,
        0,
        TAU
    );

    ctx.fill();

    ctx.save();

    ctx.translate(
        x,
        e.y
    );

    ctx.scale(
        e.face,
        1
    );

    limb(
        -4,
        28,
        16,
        8,
        a,
        '#191822'
    );

    limb(
        4,
        28,
        16,
        8,
        -a,
        '#191822'
    );

    ctx.fillStyle=
        fl?'#fff':'#2a1b39';

    ctx.fillRect(
        -10,
        10,
        20,
        20
    );

    ctx.fillStyle='#db3158';

    ctx.fillRect(
        -11,
        12,
        22,
        4
    );

    ctx.fillStyle=
        fl?'#fff':'#25232e';

    ctx.beginPath();

    ctx.arc(
        0,
        5,
        9,
        0,
        TAU
    );

    ctx.fill();

    ctx.fillStyle='#101018';

    ctx.fillRect(
        -9,
        4,
        18,
        6
    );

    ctx.fillStyle='#ff355e';

    ctx.fillRect(
        3,
        5,
        4,
        2.5
    );

    ctx.save();

    ctx.translate(
        8,
        16
    );

    ctx.rotate(
        -1.2+
        Math.sin(
            t*.2+e.ph
        )*.15
    );

    ctx.fillStyle='#bfe9ff';

    ctx.fillRect(
        -1.5,
        10,
        3,
        26
    );

    ctx.fillStyle='#6b4a2a';

    ctx.fillRect(
        -4,
        8,
        8,
        3
    );

    ctx.restore();
    ctx.restore();

    if(e.hp<e.mhp){

        ctx.fillStyle='#252b35';

        ctx.fillRect(
            x-14,
            e.y-10,
            28,
            4
        );

        ctx.fillStyle='#ff4d6d';

        ctx.fillRect(
            x-14,
            e.y-10,
            28*e.hp/e.mhp,
            4
        );
    }
}


// =====================================================
// DRAW
// =====================================================

function draw(){

    bg();

    ctx.save();

    if(shake>.3){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );
    }

    plats.forEach(plat);

    for(const c of cns){

        if(!c.got){

            const s=
                Math.max(
                    .25,
                    Math.abs(Math.cos(c.a))
                );

            ctx.save();

            ctx.translate(
                c.x-cam,
                c.y
            );

            ctx.scale(
                s,
                1
            );

            ctx.fillStyle='#ffd43b';

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                10,
                0,
                TAU
            );

            ctx.fill();

            ctx.strokeStyle='#fff1a1';
            ctx.lineWidth=2.5;

            ctx.stroke();

            ctx.restore();
        }
    }

    for(const h of hts){

        if(!h.got){

            ctx.font='22px serif';
            ctx.textAlign='center';

            ctx.fillText(
                '❤️',
                h.x-cam,
                h.y+Math.sin(t*.08)*4
            );
        }
    }

    const px=portal.x-cam;
    const pl=Math.sin(t*.1)*4;

    ctx.save();

    ctx.shadowBlur=28;
    ctx.shadowColor='#a85cff';
    ctx.strokeStyle='#c277ff';
    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.ellipse(
        px+30,
        portal.y+55,
        28+pl,
        50+pl,
        0,
        0,
        TAU
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    ctx.fillStyle='rgba(130,50,220,.3)';

    ctx.beginPath();

    ctx.ellipse(
        px+30,
        portal.y+55,
        24,
        44,
        0,
        0,
        TAU
    );

    ctx.fill();

    ctx.restore();

    ens.forEach(drawEn);

    drawPlayer();

    for(const p of parts){

        ctx.globalAlpha=
            p.l/p.m;

        ctx.fillStyle=p.c;

        ctx.beginPath();

        ctx.arc(
            p.x-cam,
            p.y,
            p.s,
            0,
            TAU
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;

    ctx.restore();

    ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
    );

    const vg=ctx.createRadialGradient(
        cv.width/2,
        cv.height/2,
        cv.height*.4,
        cv.width/2,
        cv.height/2,
        cv.height*.95
    );

    vg.addColorStop(
        0,
        'rgba(0,0,0,0)'
    );

    vg.addColorStop(
        1,
        'rgba(0,0,0,.45)'
    );

    ctx.fillStyle=vg;

    ctx.fillRect(
        0,
        0,
        cv.width,
        cv.height
    );

    $('sc').textContent=score;
    $('co').textContent=coins;
    $('lvl').textContent=level;

    $('hf').style.width=
        Math.max(0,P.hp)+'%';

    $('lv').textContent=
        '♥'.repeat(
            Math.max(lives,0)
        );
}


// =====================================================
// GAME LOOP
// =====================================================

let last=performance.now();
let acc=0;

function loop(n){

    requestAnimationFrame(loop);

    acc+=Math.min(
        (n-last)/1000,
        .1
    );

    last=n;

    while(acc>=1/60){

        if(st==='play'){
            step();
        }

        acc-=1/60;
    }

    draw();
}


// =====================================================
// START
// =====================================================

build();

show(
    '⚔️ Platform Adventure',
    '<b>A / D</b> or <b>← / →</b> — move<br>'+
    '<b>W / Space / ↑</b> — jump (hold for higher)<br>'+
    '<b>J</b> or <b>click</b> — sword attack<br>'+
    'Stomp enemies from above · <b>P</b> pauses',
    'START GAME',
    newGame
);

requestAnimationFrame(loop);

})();
</script>
