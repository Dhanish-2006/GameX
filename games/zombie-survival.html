<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Survival</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090b0f;color:white;font-family:Arial,sans-serif;overflow:hidden}
#gameCanvas{display:block;width:100vw;height:100vh;cursor:crosshair}

#ui{position:fixed;top:15px;left:15px;z-index:5;pointer-events:none}
.stat{background:rgba(0,0,0,.65);padding:8px 14px;margin-bottom:6px;border-radius:8px;font-weight:bold}
#healthBox{width:220px;height:18px;background:#333;border-radius:10px;overflow:hidden;margin-top:5px}
#healthBar{height:100%;width:100%;background:#24d65b;transition:width .15s}

#banner{position:fixed;top:22%;width:100%;text-align:center;font-size:56px;font-weight:900;letter-spacing:8px;
color:#e63946;text-shadow:0 0 25px rgba(230,57,70,.7);opacity:0;transition:opacity .6s;pointer-events:none;z-index:6}

#startScreen,#gameOver{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;
justify-content:center;align-items:center;z-index:20}
#gameOver{display:none}
h1{font-size:48px;margin-bottom:15px}
p{margin:6px;color:#ccc}
button{border:none;background:#e63946;color:white;padding:14px 30px;border-radius:10px;font-size:18px;
font-weight:bold;cursor:pointer;margin-top:20px}
button:hover{background:#ff4d5a}

#mobileControls{position:fixed;bottom:25px;left:25px;z-index:10;display:none}
.mobileBtn{width:55px;height:55px;margin:3px;padding:0;font-size:22px;background:rgba(255,255,255,.18);
border:1px solid rgba(255,255,255,.25)}
#mobileFire{position:fixed;right:30px;bottom:35px;z-index:10;display:none;width:75px;height:75px;
border-radius:50%;background:rgba(220,40,40,.7)}

@media (max-width:800px){
#mobileControls,#mobileFire{display:block}
h1{font-size:35px}
#banner{font-size:38px}
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">Wave: <span id="wave">1</span></div>
    <div class="stat">Ammo: <span id="ammo">15</span></div>
    <div class="stat">Health
        <div id="healthBox"><div id="healthBar"></div></div>
    </div>
</div>

<div id="banner"></div>

<div id="startScreen">
    <h1>🧟 ZOMBIE SURVIVAL</h1>
    <p>WASD / Arrow Keys — Move</p>
    <p>Mouse — Aim &nbsp;|&nbsp; Hold Left Click — Shoot</p>
    <p>R — Reload &nbsp;|&nbsp; Pick up medkits (+) to heal</p>
    <button id="startBtn">START GAME</button>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span> &nbsp;|&nbsp; Kills: <span id="finalKills">0</span> &nbsp;|&nbsp; Wave: <span id="finalWave">1</span></p>
    <button id="restartBtn">PLAY AGAIN</button>
</div>

<div id="mobileControls">
    <div><button class="mobileBtn" data-key="w">▲</button></div>
    <div>
        <button class="mobileBtn" data-key="a">◀</button>
        <button class="mobileBtn" data-key="s">▼</button>
        <button class="mobileBtn" data-key="d">▶</button>
    </div>
</div>

<button id="mobileFire">🔫</button>

<script>

const cv = document.getElementById("gameCanvas");
const ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

let W, H, ground, decals, dctx, dark, dk;

/* =========================
   WORLD (ground, decals, darkness layer)
========================= */

function resize() {
    W = cv.width = innerWidth;
    H = cv.height = innerHeight;

    ground = document.createElement("canvas");
    ground.width = W; ground.height = H;
    const g = ground.getContext("2d");

    g.fillStyle = "#1b221d";
    g.fillRect(0, 0, W, H);

    for (let x = 0; x < W; x += 64)
        for (let y = 0; y < H; y += 64) {
            g.fillStyle = Math.random() < .5
                ? `rgba(255,255,255,${rnd(0, .035)})`
                : `rgba(0,0,0,${rnd(0, .08)})`;
            g.fillRect(x, y, 64, 64);
        }

    for (let i = 0; i < W * H / 700; i++) {
        g.fillStyle = Math.random() < .5
            ? `rgba(90,120,75,${rnd(.1, .35)})`
            : `rgba(10,14,10,${rnd(.2, .5)})`;
        g.fillRect(rnd(0, W), rnd(0, H), rnd(1, 3), rnd(1, 4));
    }

    g.strokeStyle = "rgba(0,0,0,.4)";
    for (let i = 0; i < W * H / 50000; i++) {
        let x = rnd(0, W), y = rnd(0, H);
        g.beginPath(); g.moveTo(x, y);
        for (let k = 0; k < 5; k++) { x += rnd(-18, 18); y += rnd(-18, 18); g.lineTo(x, y); }
        g.stroke();
    }

    decals = document.createElement("canvas");
    decals.width = W; decals.height = H;
    dctx = decals.getContext("2d");

    dark = document.createElement("canvas");
    dark.width = W; dark.height = H;
    dk = dark.getContext("2d");

    P.x = Math.min(Math.max(P.x, 25), W - 25);
    P.y = Math.min(Math.max(P.y, 25), H - 25);
}


/* =========================
   STATE
========================= */

let running = false, score = 0, wave = 1, kills = 0;
let spawnLeft = 0, spawnT = 0, bannerT = 0;
let shake = 0, hurt = 0, time = 0, last = 0;
let firing = false, touchMode = false;

let zombies = [], bullets = [], parts = [], dead = [], packs = [];

const mouse = { x: 0, y: 0 };
const keys = { w: 0, a: 0, s: 0, d: 0 };

const P = {
    x: innerWidth / 2, y: innerHeight / 2, r: 16, speed: 3.1,
    hp: 100, angle: 0, walk: 0, moving: false,
    recoil: 0, flash: 0, ammo: 15, mag: 15, reload: 0, cool: 0
};

const RELOAD_MS = 1100;

const TYPES = {
    walker: { hp: 2, spd: [.75, 1.05], size: 1,    dmg: 8,  skin: "#7b9262", cloth: "#4d5d44", pants: "#2e3238", pts: 10 },
    runner: { hp: 1, spd: [1.5, 2.0],  size: .88,  dmg: 5,  skin: "#a3b08a", cloth: "#6d4a4a", pants: "#3a2f2f", pts: 15 },
    brute:  { hp: 7, spd: [.5, .7],    size: 1.45, dmg: 16, skin: "#566b4b", cloth: "#2f3a33", pants: "#1d2125", pts: 40 }
};


/* =========================
   AUDIO (synthesized, no files needed)
========================= */

let ac;

function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === "suspended") ac.resume();
}

function noise(d, f, v) {
    if (!ac) return;
    const n = ac.sampleRate * d | 0, b = ac.createBuffer(1, n, ac.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; fl.type = "lowpass"; fl.frequency.value = f; g.gain.value = v;
    s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start();
}

function tone(f1, f2, d, v, type = "sawtooth") {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(t + d);
}


/* =========================
   INPUT
========================= */

const KEYMAP = {
    KeyW: "w", ArrowUp: "w", KeyS: "s", ArrowDown: "s",
    KeyA: "a", ArrowLeft: "a", KeyD: "d", ArrowRight: "d"
};

addEventListener("keydown", e => {
    if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = 1; e.preventDefault(); }
    if (e.code === "KeyR") reload();
});

addEventListener("keyup", e => {
    if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = 0;
});

addEventListener("blur", () => { keys.w = keys.a = keys.s = keys.d = 0; firing = false; });

cv.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; touchMode = false; });
cv.addEventListener("mousedown", e => { if (e.button === 0) { audio(); firing = true; } });
addEventListener("mouseup", () => { firing = false; });
cv.addEventListener("contextmenu", e => e.preventDefault());

document.querySelectorAll(".mobileBtn").forEach(btn => {
    const k = btn.dataset.key;
    const on = e => { e.preventDefault(); keys[k] = 1; };
    const off = e => { e.preventDefault(); keys[k] = 0; };
    btn.addEventListener("touchstart", on);
    btn.addEventListener("touchend", off);
    btn.addEventListener("touchcancel", off);
    btn.addEventListener("mousedown", on);
    btn.addEventListener("mouseup", off);
});

const fireBtn = $("mobileFire");
fireBtn.addEventListener("touchstart", e => { e.preventDefault(); audio(); touchMode = true; firing = true; });
fireBtn.addEventListener("touchend", e => { e.preventDefault(); firing = false; });
fireBtn.addEventListener("touchcancel", () => { firing = false; });


/* =========================
   DRAW HELPERS
========================= */

function el(x, y, rx, ry, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
    ctx.fill();
}

function limb(x1, y1, x2, y2, w, c) {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}


/* =========================
   PLAYER
========================= */

function updatePlayer(d) {
    const dx = keys.d - keys.a, dy = keys.s - keys.w, l = Math.hypot(dx, dy);
    P.moving = l > 0;

    if (l) {
        P.x += dx / l * P.speed * d;
        P.y += dy / l * P.speed * d;
        P.walk += .22 * d;
    }

    P.x = Math.max(25, Math.min(W - 25, P.x));
    P.y = Math.max(25, Math.min(H - 25, P.y));

    /* touch screens have no cursor: auto-aim at the nearest zombie */
    if (touchMode && zombies.length) {
        let best = null, bd = 1e9;
        for (const z of zombies) {
            const dd = Math.hypot(z.x - P.x, z.y - P.y);
            if (dd < bd) { bd = dd; best = z; }
        }
        mouse.x = best.x; mouse.y = best.y;
    }

    P.angle = Math.atan2(mouse.y - P.y, mouse.x - P.x);
    P.recoil *= Math.pow(.78, d);
    if (P.flash > 0) P.flash -= d;

    for (let i = packs.length - 1; i >= 0; i--) {
        packs[i].t += d;
        if (Math.hypot(packs[i].x - P.x, packs[i].y - P.y) < 28) {
            P.hp = Math.min(100, P.hp + 25);
            tone(500, 900, .2, .12, "sine");
            packs.splice(i, 1);
        }
    }
}

function drawPlayer() {
    const rec = P.recoil, sw = P.moving ? Math.sin(P.walk) * 9 : 0;
    const breathe = 1 + Math.sin(time / 380) * .03;

    ctx.save();
    ctx.translate(P.x, P.y);
    ctx.rotate(P.angle);

    /* shadow */
    el(3, 4, 19, 20, "rgba(0,0,0,.4)");

    /* boots (alternate when walking) */
    el(sw, -7, 8, 4.5, "#11151a");
    el(-sw, 7, 8, 4.5, "#11151a");

    /* backpack */
    ctx.fillStyle = "#222b30";
    ctx.beginPath(); ctx.roundRect(-18, -9, 10, 18, 3); ctx.fill();

    /* torso + vest */
    ctx.save(); ctx.scale(1, breathe);
    el(0, 0, 12, 19, "#2d3b43");
    ctx.fillStyle = "#44575f";
    ctx.beginPath(); ctx.roundRect(-8, -13, 16, 26, 5); ctx.fill();
    ctx.fillStyle = "#2a363c";
    ctx.fillRect(-2, -12, 4, 24);
    ctx.restore();

    /* arms holding the rifle */
    limb(4, -14, 26 - rec, -3, 7, "#2d3b43");
    limb(4, 14, 22 - rec, 4, 7, "#2d3b43");

    /* gun */
    ctx.fillStyle = "#111417";
    ctx.beginPath(); ctx.roundRect(12 - rec, -3.5, 28, 7, 2); ctx.fill();
    ctx.fillStyle = "#394148";
    ctx.fillRect(16 - rec, -5, 14, 2);
    ctx.fillStyle = "#07090a";
    ctx.fillRect(38 - rec, -2, 11, 4);
    ctx.fillStyle = "#1c2226";
    ctx.fillRect(20 - rec, 3, 6, 7);

    /* hands */
    el(26 - rec, -3, 3.8, 3.8, "#b77d5b");
    el(22 - rec, 4, 3.8, 3.8, "#b77d5b");

    /* head: face, then helmet */
    el(2, 0, 9, 9.5, "#b77d5b");
    el(-1, 0, 10, 10.5, "#27343a");
    el(-3, -2, 5, 3, "#4a5d63");
    ctx.fillStyle = "#16202a";
    ctx.fillRect(5, -7, 3, 14);

    /* muzzle flash */
    if (P.flash > 0) {
        el(53 - rec, 0, rnd(10, 16), rnd(4, 7), "rgba(255,210,90,.9)");
        el(52 - rec, 0, 6, 3.5, "#fff");
    }

    ctx.restore();
}


/* =========================
   SHOOTING / RELOAD
========================= */

function shoot() {
    if (!running || P.cool > 0 || P.reload > 0) return;
    if (P.ammo <= 0) { reload(); return; }

    P.cool = 140; P.ammo--; P.recoil = 7; P.flash = 4;
    shake = Math.max(shake, 3);

    const a = P.angle + rnd(-.03, .03);
    const mx = P.x + Math.cos(a) * 50, my = P.y + Math.sin(a) * 50;

    bullets.push({ x: mx, y: my, vx: Math.cos(a) * 18, vy: Math.sin(a) * 18, life: 60 });

    for (let i = 0; i < 5; i++) {
        const sa = a + rnd(-.4, .4), sp = rnd(3, 8);
        parts.push({ x: mx, y: my, vx: Math.cos(sa) * sp, vy: Math.sin(sa) * sp,
            life: 8, max: 8, size: rnd(1.5, 3), color: "#ffcf5a", drag: .85 });
    }

    for (let i = 0; i < 2; i++) {
        parts.push({ x: mx, y: my, vx: Math.cos(a) * rnd(.5, 1.5), vy: Math.sin(a) * rnd(.5, 1.5) + rnd(-.3, .3),
            life: 35, max: 35, size: rnd(4, 8), color: "#cfd3d6", a: .25, drag: .96 });
    }

    /* ejected casing */
    const ca = a + Math.PI / 2 + rnd(-.3, .3);
    parts.push({ x: P.x + Math.cos(a) * 20, y: P.y + Math.sin(a) * 20,
        vx: Math.cos(ca) * rnd(2, 4), vy: Math.sin(ca) * rnd(2, 4),
        life: 45, max: 45, size: 3, color: "#d4a64a", drag: .9, shape: "r", rot: 0, vr: rnd(-.5, .5) });

    noise(.12, 2600, .35);
    tone(170, 40, .12, .25);

    if (P.ammo <= 0) reload();
}

function reload() {
    if (!running || P.reload > 0 || P.ammo === P.mag) return;
    P.reload = RELOAD_MS;
    noise(.05, 4500, .25);
}


/* =========================
   BULLETS
========================= */

function updateBullets(d) {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        let gone = false;

        for (let s = 0; s < 3 && !gone; s++) {
            b.x += b.vx * d / 3;
            b.y += b.vy * d / 3;

            for (let j = zombies.length - 1; j >= 0; j--) {
                const z = zombies[j];

                if (Math.hypot(b.x - z.x, b.y - z.y) < z.r + 3) {
                    z.hp--; z.flash = 5;
                    z.x += b.vx * .12 / z.size;
                    z.y += b.vy * .12 / z.size;

                    bleed(b.x, b.y, Math.atan2(b.vy, b.vx), 6, .8);
                    noise(.08, 900, .3);

                    if (z.hp <= 0) { killZombie(z, b); zombies.splice(j, 1); }
                    gone = true;
                    break;
                }
            }
        }

        b.life -= d;
        if (gone || b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30)
            bullets.splice(i, 1);
    }
}

function drawBullets() {
    ctx.lineCap = "round";
    for (const b of bullets) {
        ctx.strokeStyle = "rgba(255,233,160,.35)"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(b.x - b.vx * 2.4, b.y - b.vy * 2.4); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.strokeStyle = "#fff6c8"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(b.x - b.vx * 1.2, b.y - b.vy * 1.2); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
}


/* =========================
   ZOMBIES
========================= */

function spawnZombie() {
    const side = Math.floor(Math.random() * 4);
    let x, y;

    if (side === 0)      { x = rnd(0, W); y = -50; }
    else if (side === 1) { x = W + 50;    y = rnd(0, H); }
    else if (side === 2) { x = rnd(0, W); y = H + 50; }
    else                 { x = -50;       y = rnd(0, H); }

    const runnerChance = Math.min(.35, (wave - 1) * .07);
    const bruteChance = wave >= 3 ? Math.min(.2, (wave - 2) * .04) : 0;
    const roll = Math.random();
    const type = roll < bruteChance ? "brute" : roll < bruteChance + runnerChance ? "runner" : "walker";
    const T = TYPES[type];

    zombies.push({
        x, y, type, ...T,
        max: T.hp,
        spd: rnd(T.spd[0], T.spd[1]) + wave * .03,
        r: 18 * T.size,
        angle: Math.atan2(P.y - y, P.x - x),
        walk: rnd(0, 6), flash: 0, atk: 0, atkCd: 0
    });
}

function updateZombies(d) {
    for (const z of zombies) {
        const dx = P.x - z.x, dy = P.y - z.y, dist = Math.hypot(dx, dy) || 1;

        /* smooth turning */
        const want = Math.atan2(dy, dx);
        const da = Math.atan2(Math.sin(want - z.angle), Math.cos(want - z.angle));
        z.angle += da * .12 * d;

        /* lurching shamble */
        const v = z.spd * (1 + Math.sin(z.walk) * .3) * d;

        if (dist > z.r + P.r - 4) {
            z.x += dx / dist * v;
            z.y += dy / dist * v;
            z.walk += z.spd * d * .2;
        }

        if (z.flash > 0) z.flash -= d;
        if (z.atk > 0) z.atk -= d;
        z.atkCd -= d;

        if (dist < z.r + P.r + 2 && z.atkCd <= 0) {
            z.atkCd = 45; z.atk = 14;
            damage(z.dmg, dx / dist, dy / dist);
        }

        if (dist < 520 && Math.random() < .0006 * d)
            tone(rnd(80, 130), 45, .8, .05);
    }

    /* keep zombies from stacking on each other */
    for (let i = 0; i < zombies.length; i++)
        for (let j = i + 1; j < zombies.length; j++) {
            const a = zombies[i], b = zombies[j];
            const dx = b.x - a.x, dy = b.y - a.y, dd = Math.hypot(dx, dy);
            const min = (a.r + b.r) * .8;
            if (dd < min && dd > 0) {
                const push = (min - dd) / 2 / dd;
                a.x -= dx * push; a.y -= dy * push;
                b.x += dx * push; b.y += dy * push;
            }
        }
}

function damage(n, nx, ny) {
    P.hp -= n; hurt = 1;
    shake = Math.max(shake, 9);
    P.x += nx * 6; P.y += ny * 6;
    bleed(P.x, P.y, Math.atan2(ny, nx), 5, 1.2);
    tone(210, 80, .25, .15, "square");
}

function killZombie(z, b) {
    score += z.pts; kills++;
    dead.push({ z, t: 0 });

    /* blood pool stays on the ground */
    dctx.save();
    dctx.translate(z.x, z.y);
    dctx.rotate(rnd(0, TAU));
    dctx.fillStyle = "rgba(110,10,10,.55)";
    dctx.beginPath();
    dctx.ellipse(0, 0, rnd(18, 28) * z.size, rnd(12, 20) * z.size, 0, 0, TAU);
    dctx.fill();
    dctx.restore();

    bleed(z.x, z.y, Math.atan2(b.vy, b.vx), 14, 1);
    tone(rnd(110, 150), 35, .5, .1);

    if (Math.random() < .12) packs.push({ x: z.x, y: z.y, t: 0 });
}


/* =========================
   DRAW ZOMBIE (top-down, shuffling walk cycle)
========================= */

function drawZombie(z, fall = 0) {
    const s = Math.sin(z.walk), f = z.flash > 0;
    const C = c => f ? "#fff" : c;
    const lunge = z.atk > 0 ? 10 : 0;

    ctx.save();
    ctx.translate(z.x, z.y);
    ctx.rotate(z.angle);
    ctx.scale(z.size * (1 - fall * .1), z.size * (1 - fall * .25));

    /* shadow + feet */
    el(3, 4, 17, 19, "rgba(0,0,0,.4)");
    el(s * 8, -7, 8, 4, C(z.pants));
    el(-s * 8, 7, 8, 4, C(z.pants));

    /* swaying body */
    ctx.save();
    ctx.rotate(s * .1);
    el(0, 0, 11, 17, C(z.cloth));
    if (!f) el(-2, 5, 4, 3, "rgba(120,10,10,.7)");

    /* outstretched arms */
    limb(3, -13, 20 + lunge + s * 3, -9, 6, C(z.skin));
    limb(3, 13, 20 + lunge - s * 3, 9, 6, C(z.skin));
    el(22 + lunge + s * 3, -9, 3.5, 3.5, C(z.skin));
    el(22 + lunge - s * 3, 9, 3.5, 3.5, C(z.skin));

    /* lolling head */
    ctx.rotate(Math.sin(z.walk * .5) * .15);
    el(0, 0, 9, 9, C(z.skin));
    el(-3, 0, 6, 8, f ? "#fff" : "#1c211a");
    el(6, -3.5, 1.8, 1.8, "#ff2a1f");
    el(6, 3.5, 1.8, 1.8, "#ff2a1f");
    el(8.5, 0, 1.5, 2.5, "#2a0a0a");
    ctx.restore();

    ctx.restore();
}


/* =========================
   PARTICLES / PICKUPS
========================= */

function bleed(x, y, ang, n, spread) {
    for (let i = 0; i < n; i++) {
        const a = ang + rnd(-spread, spread), sp = rnd(1, 5);
        parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 28, max: 28, size: rnd(1.5, 3.5), color: "#b01818", drag: .92, blood: true });
    }
}

function updateParticles(d) {
    for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i], dr = Math.pow(p.drag, d);
        p.x += p.vx * d; p.y += p.vy * d;
        p.vx *= dr; p.vy *= dr;
        if (p.vr) p.rot += p.vr * d;
        p.life -= d;

        if (p.life <= 0) {
            if (p.blood && Math.random() < .5) {
                dctx.fillStyle = "rgba(120,12,12,.6)";
                dctx.beginPath(); dctx.arc(p.x, p.y, p.size * .8, 0, TAU); dctx.fill();
            }
            parts.splice(i, 1);
        }
    }
}

function drawParticles() {
    for (const p of parts) {
        ctx.globalAlpha = Math.max(0, p.life / p.max) * (p.a || 1);
        ctx.fillStyle = p.color;

        if (p.shape === "r") {
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
            ctx.fillRect(-3, -1.5, 6, 3);
            ctx.restore();
        } else {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

function drawPacks() {
    for (const k of packs) {
        const pulse = 1 + Math.sin(k.t * .12) * .12;
        ctx.save();
        ctx.translate(k.x, k.y); ctx.scale(pulse, pulse);
        el(0, 0, 15, 15, "rgba(40,220,100,.2)");
        ctx.fillStyle = "#f2f2f2";
        ctx.beginPath(); ctx.roundRect(-9, -9, 18, 18, 4); ctx.fill();
        ctx.fillStyle = "#e63946";
        ctx.fillRect(-2.5, -7, 5, 14); ctx.fillRect(-7, -2.5, 14, 5);
        ctx.restore();
    }
}


/* =========================
   LIGHTING (flashlight + darkness)
========================= */

function lighting() {
    dk.globalCompositeOperation = "source-over";
    dk.clearRect(0, 0, W, H);
    dk.fillStyle = "rgba(2,4,6,.8)";
    dk.fillRect(0, 0, W, H);
    dk.globalCompositeOperation = "destination-out";

    let g = dk.createRadialGradient(P.x, P.y, 10, P.x, P.y, 190);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    dk.fillStyle = g;
    dk.beginPath(); dk.arc(P.x, P.y, 190, 0, TAU); dk.fill();

    dk.save();
    dk.translate(P.x, P.y);
    dk.rotate(P.angle);

    /* soft outer cone, then bright inner cone */
    for (const [half, alpha] of [[.65, .3], [.4, .85]]) {
        g = dk.createRadialGradient(0, 0, 10, 0, 0, 560);
        g.addColorStop(0, `rgba(0,0,0,${alpha})`);
        g.addColorStop(1, "rgba(0,0,0,0)");
        dk.fillStyle = g;
        dk.beginPath(); dk.moveTo(0, 0); dk.arc(0, 0, 560, -half, half); dk.closePath(); dk.fill();
    }

    if (P.flash > 0) {
        g = dk.createRadialGradient(50, 0, 5, 50, 0, 320);
        g.addColorStop(0, "rgba(0,0,0,.6)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        dk.fillStyle = g;
        dk.beginPath(); dk.arc(50, 0, 320, 0, TAU); dk.fill();
    }

    dk.restore();
    ctx.drawImage(dark, 0, 0);
}


/* =========================
   RENDER
========================= */

function render() {
    ctx.save();
    if (shake > .2) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));

    ctx.drawImage(ground, 0, 0);
    ctx.drawImage(decals, 0, 0);
    drawPacks();

    for (const d of dead) {
        const f = d.t / 70;
        ctx.globalAlpha = Math.max(0, 1 - f * f);
        drawZombie(d.z, f);
    }
    ctx.globalAlpha = 1;

    drawParticles();

    for (const z of zombies) {
        drawZombie(z);

        if (z.hp < z.max) {
            ctx.fillStyle = "rgba(0,0,0,.6)";
            ctx.fillRect(z.x - 16, z.y - z.r - 14, 32, 4);
            ctx.fillStyle = "#e63946";
            ctx.fillRect(z.x - 16, z.y - z.r - 14, 32 * z.hp / z.max, 4);
        }
    }

    drawBullets();
    drawPlayer();
    ctx.restore();

    lighting();

    /* reload ring */
    if (P.reload > 0) {
        ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(P.x, P.y - 40, 12, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - P.reload / RELOAD_MS));
        ctx.stroke();
    }

    /* damage / low-health vignette */
    const lowPulse = P.hp < 30 && running ? (Math.sin(time / 180) + 1) * .15 : 0;
    const a = Math.max(hurt * .55, lowPulse);

    if (a > .01) {
        const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
        g.addColorStop(0, "rgba(160,0,0,0)");
        g.addColorStop(1, `rgba(160,0,0,${a})`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
}


/* =========================
   UI
========================= */

function updateUI() {
    $("score").textContent = score;
    $("wave").textContent = wave;
    $("ammo").textContent = P.reload > 0 ? "Reloading..." : P.ammo + " / " + P.mag;

    const hb = $("healthBar");
    hb.style.width = Math.max(0, P.hp) + "%";
    hb.style.background = P.hp > 60 ? "#24d65b" : P.hp > 30 ? "#f4a261" : "#e63946";

    $("banner").style.opacity = bannerT > 0 ? 1 : 0;
}


/* =========================
   WAVES / GAME FLOW
========================= */

function startWave() {
    spawnLeft = 5 + wave * 4;
    spawnT = 0;
    bannerT = 2200;
    $("banner").textContent = "WAVE " + wave;
    P.ammo = P.mag;
    P.reload = 0;
}

function startGame() {
    audio();

    score = 0; wave = 1; kills = 0;
    zombies = []; bullets = []; parts = []; dead = []; packs = [];
    dctx.clearRect(0, 0, W, H);

    P.x = W / 2; P.y = H / 2;
    P.hp = 100; P.angle = 0; P.recoil = 0; P.flash = 0; P.cool = 0;
    mouse.x = W / 2 + 100; mouse.y = H / 2;

    keys.w = keys.a = keys.s = keys.d = 0;
    firing = false; hurt = 0; shake = 0;

    running = true;
    startWave();

    $("startScreen").style.display = "none";
    $("gameOver").style.display = "none";
}

function endGame() {
    running = false; firing = false;
    P.hp = 0;

    $("finalScore").textContent = score;
    $("finalKills").textContent = kills;
    $("finalWave").textContent = wave;
    $("gameOver").style.display = "flex";
    $("banner").style.opacity = 0;
}

$("startBtn").addEventListener("click", startGame);
$("restartBtn").addEventListener("click", startGame);


/* =========================
   GAME LOOP
========================= */

function update(ms, d) {
    P.cool -= ms;

    if (P.reload > 0) {
        P.reload -= ms;
        if (P.reload <= 0) { P.reload = 0; P.ammo = P.mag; }
    }

    if (firing) shoot();

    updatePlayer(d);
    updateBullets(d);
    updateZombies(d);
    updateParticles(d);

    for (let i = dead.length - 1; i >= 0; i--) {
        dead[i].t += d;
        if (dead[i].t > 70) dead.splice(i, 1);
    }

    if (bannerT > 0) {
        bannerT -= ms;
    } else if (spawnLeft > 0) {
        spawnT -= ms;
        if (spawnT <= 0) {
            spawnZombie();
            spawnLeft--;
            spawnT = Math.max(350, 1100 - wave * 60);
        }
    } else if (!zombies.length) {
        wave++;
        startWave();
    }

    if (P.hp <= 0) endGame();
}

function loop(t) {
    requestAnimationFrame(loop);

    const ms = Math.min(40, t - last || 16);
    last = t;
    time = t;
    const d = ms / 16.67;

    if (running) update(ms, d);
    else updateParticles(d);

    shake *= Math.pow(.88, d);
    hurt = Math.max(0, hurt - .03 * d);

    render();
    updateUI();
}

addEventListener("resize", resize);

resize();
mouse.x = W / 2 + 100;
mouse.y = H / 2;
requestAnimationFrame(loop);

</script>

</body>
