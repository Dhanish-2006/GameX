<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Survival</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #090b0f;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#gameCanvas {
    display: block;
    background: #151a18;
    width: 100vw;
    height: 100vh;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 5;
    pointer-events: none;
}

.stat {
    background: rgba(0,0,0,.65);
    padding: 8px 14px;
    margin-bottom: 6px;
    border-radius: 8px;
    font-weight: bold;
}

#healthBox {
    width: 220px;
    height: 18px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 5px;
}

#healthBar {
    height: 100%;
    width: 100%;
    background: #24d65b;
    transition: width .15s;
}

#startScreen,
#gameOver {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
}

#gameOver {
    display: none;
}

h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

p {
    margin: 6px;
    color: #ccc;
}

button {
    border: none;
    background: #e63946;
    color: white;
    padding: 14px 30px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #ff4d5a;
}

#mobileControls {
    position: fixed;
    bottom: 25px;
    left: 25px;
    z-index: 10;
    display: none;
}

.mobileBtn {
    width: 55px;
    height: 55px;
    margin: 3px;
    padding: 0;
    font-size: 22px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.25);
}

#mobileFire {
    position: fixed;
    right: 30px;
    bottom: 35px;
    z-index: 10;
    display: none;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: rgba(220,40,40,.7);
}

@media (max-width: 800px) {
    #mobileControls,
    #mobileFire {
        display: block;
    }

    h1 {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">Wave: <span id="wave">1</span></div>

    <div class="stat">
        Health
        <div id="healthBox">
            <div id="healthBar"></div>
        </div>
    </div>
</div>

<div id="startScreen">
    <h1>🧟 ZOMBIE SURVIVAL</h1>
    <p>WASD / Arrow Keys — Move</p>
    <p>Mouse — Aim</p>
    <p>Left Click — Shoot</p>
    <button id="startBtn">START GAME</button>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <button id="restartBtn">PLAY AGAIN</button>
</div>

<div id="mobileControls">

    <div>
        <button class="mobileBtn" data-key="w">▲</button>
    </div>

    <div>
        <button class="mobileBtn" data-key="a">◀</button>
        <button class="mobileBtn" data-key="s">▼</button>
        <button class="mobileBtn" data-key="d">▶</button>
    </div>

</div>

<button id="mobileFire">🔫</button>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

window.addEventListener("resize", () => {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

    player.x = Math.min(player.x, W - 40);
    player.y = Math.min(player.y, H - 40);
});


/* =========================
   GAME VARIABLES
========================= */

let gameRunning = false;

let score = 0;
let wave = 1;

let zombies = [];
let bullets = [];
let particles = [];

let lastTime = 0;
let zombieTimer = 0;
let shootCooldown = 0;

let mouse = {
    x: W / 2,
    y: H / 2
};


/* =========================
   PLAYER
========================= */

const player = {

    x: W / 2,
    y: H / 2,

    radius: 22,

    speed: 4,

    health: 100,

    angle: 0,

    recoil: 0

};


/* =========================
   KEYBOARD
========================= */

const keys = {
    w: false,
    a: false,
    s: false,
    d: false
};


window.addEventListener("keydown", (event) => {

    if (
        event.code === "KeyW" ||
        event.code === "ArrowUp"
    ) {
        keys.w = true;
        event.preventDefault();
    }

    if (
        event.code === "KeyS" ||
        event.code === "ArrowDown"
    ) {
        keys.s = true;
        event.preventDefault();
    }

    if (
        event.code === "KeyA" ||
        event.code === "ArrowLeft"
    ) {
        keys.a = true;
        event.preventDefault();
    }

    if (
        event.code === "KeyD" ||
        event.code === "ArrowRight"
    ) {
        keys.d = true;
        event.preventDefault();
    }

});


window.addEventListener("keyup", (event) => {

    if (
        event.code === "KeyW" ||
        event.code === "ArrowUp"
    ) {
        keys.w = false;
    }

    if (
        event.code === "KeyS" ||
        event.code === "ArrowDown"
    ) {
        keys.s = false;
    }

    if (
        event.code === "KeyA" ||
        event.code === "ArrowLeft"
    ) {
        keys.a = false;
    }

    if (
        event.code === "KeyD" ||
        event.code === "ArrowRight"
    ) {
        keys.d = false;
    }

});


window.addEventListener("blur", () => {

    keys.w = false;
    keys.a = false;
    keys.s = false;
    keys.d = false;

});


/* =========================
   MOUSE
========================= */

canvas.addEventListener("mousemove", (event) => {

    mouse.x = event.clientX;
    mouse.y = event.clientY;

});


canvas.addEventListener("mousedown", (event) => {

    if (event.button === 0) {
        shoot();
    }

});


/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys.w) dy -= 1;
    if (keys.s) dy += 1;
    if (keys.a) dx -= 1;
    if (keys.d) dx += 1;

    const length = Math.sqrt(dx * dx + dy * dy);

    if (length > 0) {

        dx /= length;
        dy /= length;

        player.x += dx * player.speed;
        player.y += dy * player.speed;
    }


    const margin = 35;

    player.x = Math.max(
        margin,
        Math.min(W - margin, player.x)
    );

    player.y = Math.max(
        margin,
        Math.min(H - margin, player.y)
    );


    player.angle = Math.atan2(
        mouse.y - player.y,
        mouse.x - player.x
    );


    if (player.recoil > 0) {
        player.recoil -= 0.8;
    }

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer() {

    ctx.save();

    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);


    /* Shadow */

    ctx.beginPath();

    ctx.ellipse(
        0,
        19,
        25,
        10,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fill();


    /* Back arm */

    ctx.save();

    ctx.translate(-2, 8);

    ctx.rotate(-0.25);

    ctx.fillStyle = "#a87855";

    ctx.beginPath();

    ctx.roundRect(
        -9,
        -5,
        29,
        10,
        5
    );

    ctx.fill();

    ctx.fillStyle = "#303942";

    ctx.beginPath();

    ctx.roundRect(
        10,
        -6,
        13,
        12,
        4
    );

    ctx.fill();

    ctx.restore();


    /* Legs */

    ctx.fillStyle = "#202831";

    ctx.beginPath();

    ctx.roundRect(
        -13,
        10,
        10,
        18,
        4
    );

    ctx.fill();

    ctx.beginPath();

    ctx.roundRect(
        4,
        10,
        10,
        18,
        4
    );

    ctx.fill();


    /* Boots */

    ctx.fillStyle = "#11151a";

    ctx.beginPath();

    ctx.roundRect(
        -15,
        23,
        13,
        7,
        3
    );

    ctx.fill();

    ctx.beginPath();

    ctx.roundRect(
        3,
        23,
        14,
        7,
        3
    );

    ctx.fill();


    /* Body */

    ctx.fillStyle = "#26333b";

    ctx.beginPath();

    ctx.roundRect(
        -15,
        -10,
        30,
        29,
        8
    );

    ctx.fill();


    /* Tactical vest */

    ctx.fillStyle = "#384952";

    ctx.beginPath();

    ctx.roundRect(
        -12,
        -7,
        24,
        25,
        6
    );

    ctx.fill();


    /* Vest center */

    ctx.fillStyle = "#202a30";

    ctx.fillRect(
        -3,
        -6,
        6,
        23
    );


    /* Vest pockets */

    ctx.fillStyle = "#4b5c63";

    ctx.fillRect(
        -10,
        4,
        7,
        7
    );

    ctx.fillRect(
        3,
        4,
        7,
        7
    );


    /* Neck */

    ctx.fillStyle = "#9a684b";

    ctx.beginPath();

    ctx.roundRect(
        -5,
        -17,
        10,
        8,
        3
    );

    ctx.fill();


    /* Head */

    ctx.fillStyle = "#b77d5b";

    ctx.beginPath();

    ctx.arc(
        0,
        -22,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Face shadow */

    ctx.fillStyle = "#8e5e45";

    ctx.beginPath();

    ctx.arc(
        6,
        -20,
        6,
        -Math.PI / 2,
        Math.PI / 2
    );

    ctx.fill();


    /* Helmet */

    ctx.fillStyle = "#202a2d";

    ctx.beginPath();

    ctx.arc(
        0,
        -25,
        14,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* Helmet front */

    ctx.fillStyle = "#344348";

    ctx.fillRect(
        -13,
        -27,
        26,
        5
    );


    /* Helmet highlight */

    ctx.fillStyle = "#596a6e";

    ctx.fillRect(
        -7,
        -36,
        12,
        3
    );


    /* Eye */

    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(
        7,
        -22,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Front arm */

    ctx.save();

    ctx.translate(4, 5);

    ctx.rotate(-0.25);

    ctx.fillStyle = "#b77d5b";

    ctx.beginPath();

    ctx.roundRect(
        -2,
        -5,
        24,
        10,
        5
    );

    ctx.fill();

    ctx.fillStyle = "#303d43";

    ctx.beginPath();

    ctx.roundRect(
        9,
        -6,
        15,
        12,
        4
    );

    ctx.fill();

    ctx.restore();


    /* Gun */

    const gunRecoil = player.recoil;

    ctx.save();

    ctx.translate(
        17 - gunRecoil,
        3
    );

    ctx.rotate(-0.05);

    /* Gun body */

    ctx.fillStyle = "#16191c";

    ctx.beginPath();

    ctx.roundRect(
        0,
        -5,
        28,
        10,
        3
    );

    ctx.fill();


    /* Gun upper rail */

    ctx.fillStyle = "#394148";

    ctx.fillRect(
        4,
        -7,
        18,
        3
    );


    /* Barrel */

    ctx.fillStyle = "#0d0f11";

    ctx.fillRect(
        25,
        -3,
        15,
        6
    );


    /* Magazine */

    ctx.fillStyle = "#242a2e";

    ctx.beginPath();

    ctx.moveTo(8, 5);
    ctx.lineTo(15, 5);
    ctx.lineTo(12, 15);
    ctx.lineTo(7, 14);

    ctx.closePath();

    ctx.fill();


    /* Gun stock */

    ctx.fillStyle = "#171a1c";

    ctx.fillRect(
        -7,
        -4,
        9,
        8
    );

    ctx.restore();


    ctx.restore();
}


/* =========================
   SHOOT
========================= */

function shoot() {

    if (!gameRunning) return;

    if (shootCooldown > 0) return;

    shootCooldown = 150;

    player.recoil = 5;


    const speed = 10;

    const angle = player.angle;

    bullets.push({

        x: player.x + Math.cos(angle) * 38,

        y: player.y + Math.sin(angle) * 38,

        vx: Math.cos(angle) * speed,

        vy: Math.sin(angle) * speed,

        radius: 4,

        life: 70

    });


    /* muzzle particles */

    for (let i = 0; i < 5; i++) {

        particles.push({

            x: player.x + Math.cos(angle) * 40,

            y: player.y + Math.sin(angle) * 40,

            vx: Math.cos(angle) * (2 + Math.random() * 3),

            vy: Math.sin(angle) * (2 + Math.random() * 3),

            life: 10,

            size: 3 + Math.random() * 3,

            color: "#ffd166"

        });

    }

}


/* =========================
   BULLETS
========================= */

function updateBullets() {

    for (let i = bullets.length - 1; i >= 0; i--) {

        const b = bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        b.life--;

        if (
            b.life <= 0 ||
            b.x < -20 ||
            b.x > W + 20 ||
            b.y < -20 ||
            b.y > H + 20
        ) {

            bullets.splice(i, 1);

        }

    }

}


function drawBullets() {

    for (const b of bullets) {

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffe066";

        ctx.fill();

    }

}


/* =========================
   ZOMBIES
========================= */

function spawnZombie() {

    const side = Math.floor(Math.random() * 4);

    let x;
    let y;


    if (side === 0) {

        x = Math.random() * W;
        y = -40;

    } else if (side === 1) {

        x = W + 40;
        y = Math.random() * H;

    } else if (side === 2) {

        x = Math.random() * W;
        y = H + 40;

    } else {

        x = -40;
        y = Math.random() * H;

    }


    const speed =
        0.65 +
        wave * 0.08 +
        Math.random() * 0.35;


    zombies.push({

        x: x,

        y: y,

        radius: 18,

        speed: speed,

        health: 2,

        hitFlash: 0,

        angle: 0

    });

}


function updateZombies() {

    for (let i = zombies.length - 1; i >= 0; i--) {

        const z = zombies[i];

        const dx = player.x - z.x;
        const dy = player.y - z.y;

        const distance = Math.sqrt(
            dx * dx + dy * dy
        );


        if (distance > 1) {

            z.x += dx / distance * z.speed;
            z.y += dy / distance * z.speed;

            z.angle = Math.atan2(dy, dx);

        }


        if (z.hitFlash > 0) {
            z.hitFlash--;
        }


        /* Zombie touches player */

        if (
            distance <
            z.radius + player.radius
        ) {

            player.health -= 0.25;

            z.x -= dx / Math.max(distance, 1) * 1.5;
            z.y -= dy / Math.max(distance, 1) * 1.5;

        }

    }

}


/* =========================
   DRAW ZOMBIE
========================= */

function drawZombie(z) {

    ctx.save();

    ctx.translate(z.x, z.y);

    ctx.rotate(z.angle);


    /* Shadow */

    ctx.beginPath();

    ctx.ellipse(
        0,
        15,
        20,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.fill();


    /* Legs */

    ctx.fillStyle =
        z.hitFlash > 0
        ? "#ffffff"
        : "#30353a";


    ctx.fillRect(
        -12,
        8,
        8,
        18
    );

    ctx.fillRect(
        4,
        8,
        8,
        18
    );


    /* Body */

    ctx.fillStyle =
        z.hitFlash > 0
        ? "#ffffff"
        : "#536b46";


    ctx.beginPath();

    ctx.roundRect(
        -15,
        -9,
        30,
        27,
        8
    );

    ctx.fill();


    /* Arms */

    ctx.fillStyle =
        z.hitFlash > 0
        ? "#ffffff"
        : "#657c50";


    ctx.save();

    ctx.rotate(-0.35);

    ctx.fillRect(
        -7,
        -2,
        28,
        8
    );

    ctx.restore();


    ctx.save();

    ctx.rotate(0.35);

    ctx.fillRect(
        -7,
        -2,
        28,
        8
    );

    ctx.restore();


    /* Head */

    ctx.fillStyle =
        z.hitFlash > 0
        ? "#ffffff"
        : "#70875a";


    ctx.beginPath();

    ctx.arc(
        0,
        -17,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Hair */

    ctx.fillStyle = "#20251d";

    ctx.beginPath();

    ctx.arc(
        -2,
        -23,
        9,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    /* Eyes */

    ctx.fillStyle = "#ff3b30";

    ctx.beginPath();

    ctx.arc(
        5,
        -19,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================
   BULLET / ZOMBIE COLLISION
========================= */

function checkBulletHits() {

    for (let i = bullets.length - 1; i >= 0; i--) {

        const b = bullets[i];

        let hit = false;


        for (let j = zombies.length - 1; j >= 0; j--) {

            const z = zombies[j];

            const dx = b.x - z.x;
            const dy = b.y - z.y;

            const distance = Math.sqrt(
                dx * dx + dy * dy
            );


            if (
                distance <
                b.radius + z.radius
            ) {

                z.health--;

                z.hitFlash = 5;

                bullets.splice(i, 1);

                hit = true;


                createBlood(
                    z.x,
                    z.y
                );


                if (z.health <= 0) {

                    zombies.splice(j, 1);

                    score += 10;

                }

                break;

            }

        }

        if (hit) continue;

    }

}


/* =========================
   BLOOD PARTICLES
========================= */

function createBlood(x, y) {

    for (let i = 0; i < 7; i++) {

        particles.push({

            x: x,

            y: y,

            vx:
                (Math.random() - 0.5) * 4,

            vy:
                (Math.random() - 0.5) * 4,

            life: 25,

            size:
                2 + Math.random() * 3,

            color: "#d62828"

        });

    }

}


function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.96;
        p.vy *= 0.96;

        p.life--;


        if (p.life <= 0) {

            particles.splice(i, 1);

        }

    }

}


function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(0, p.life / 25);

        ctx.fillStyle = p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.globalAlpha = 1;

}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

    ctx.fillStyle = "#141a17";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* grid */

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";

    ctx.lineWidth = 1;


    const grid = 50;


    for (let x = 0; x < W; x += grid) {

        ctx.beginPath();

        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);

        ctx.stroke();

    }


    for (let y = 0; y < H; y += grid) {

        ctx.beginPath();

        ctx.moveTo(0, y);
        ctx.lineTo(W, y);

        ctx.stroke();

    }

}


/* =========================
   UI
========================= */

function updateUI() {

    document.getElementById("score").textContent =
        score;

    document.getElementById("wave").textContent =
        wave;

    document.getElementById("healthBar").style.width =
        Math.max(0, player.health) + "%";

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    gameRunning = false;

    document.getElementById("finalScore").textContent =
        score;

    document.getElementById("gameOver").style.display =
        "flex";

}


/* =========================
   START GAME
========================= */

function startGame() {

    score = 0;

    wave = 1;

    zombies = [];

    bullets = [];

    particles = [];

    player.x = W / 2;
    player.y = H / 2;

    player.health = 100;

    player.angle = 0;

    player.recoil = 0;

    keys.w = false;
    keys.a = false;
    keys.s = false;
    keys.d = false;

    gameRunning = true;

    document.getElementById("startScreen").style.display =
        "none";

    document.getElementById("gameOver").style.display =
        "none";

    updateUI();

}


document.getElementById("startBtn").addEventListener(
    "click",
    startGame
);


document.getElementById("restartBtn").addEventListener(
    "click",
    startGame
);


/* =========================
   MOBILE CONTROLS
========================= */

document.querySelectorAll(".mobileBtn").forEach(btn => {

    const key = btn.dataset.key;


    btn.addEventListener("touchstart", (e) => {

        e.preventDefault();

        keys[key] = true;

    });


    btn.addEventListener("touchend", (e) => {

        e.preventDefault();

        keys[key] = false;

    });


    btn.addEventListener("mousedown", () => {

        keys[key] = true;

    });


    btn.addEventListener("mouseup", () => {

        keys[key] = false;

    });

});


document.getElementById("mobileFire")
.addEventListener("touchstart", (e) => {

    e.preventDefault();

    shoot();

});


/* =========================
   GAME LOOP
========================= */

function gameLoop(time) {

    requestAnimationFrame(gameLoop);


    const delta =
        Math.min(
            32,
            time - lastTime
        );

    lastTime = time;


    if (!gameRunning) {

        drawBackground();

        drawPlayer();

        return;

    }


    /* Shooting cooldown */

    if (shootCooldown > 0) {

        shootCooldown -= delta;

    }


    /* Wave */

    wave =
        Math.floor(score / 100) + 1;


    /* Spawn zombies */

    zombieTimer += delta;


    const spawnDelay =
        Math.max(
            400,
            1200 - wave * 70
        );


    if (zombieTimer >= spawnDelay) {

        zombieTimer = 0;

        spawnZombie();

    }


    updatePlayer();

    updateBullets();

    updateZombies();

    checkBulletHits();

    updateParticles();


    if (player.health <= 0) {

        player.health = 0;

        updateUI();

        gameOver();

    }


    /* Draw */

    drawBackground();

    drawParticles();

    drawBullets();


    for (const z of zombies) {

        drawZombie(z);

    }


    drawPlayer();

    updateUI();

}


requestAnimationFrame(gameLoop);

</script>

</body>
</html>
