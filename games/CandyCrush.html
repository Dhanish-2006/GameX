
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sugar Spark - Match 3</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      font-family: Inter, system-ui, Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 10%, #ff89bc55, transparent 35%),
        radial-gradient(circle at 80% 20%, #72d6ff44, transparent 32%),
        linear-gradient(145deg, #29174f, #130b2e 55%, #07182b);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background-image:
        radial-gradient(circle, white 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .game {
      width: min(94vw, 720px);
      padding: 16px;
    }

    .title {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 900;
      letter-spacing: -2px;
      text-shadow:
        0 4px 0 #b32c78,
        0 8px 20px #0009;
    }

    .title span {
      color: #ffd74a;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      padding: 10px;
      text-align: center;
      border: 1px solid #ffffff22;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff20, #ffffff0a);
      box-shadow:
        inset 0 1px 1px #ffffff30,
        0 10px 25px #0004;
      backdrop-filter: blur(12px);
    }

    .stat small {
      display: block;
      margin-bottom: 3px;
      color: #d8ccff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stat strong {
      font-size: clamp(17px, 4vw, 25px);
    }

    .progress {
      height: 9px;
      margin-top: 6px;
      overflow: hidden;
      border-radius: 10px;
      background: #08051e88;
      box-shadow: inset 0 2px 4px #0008;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      transition: width 0.35s ease;
      background: linear-gradient(90deg, #ff55a5, #ffd83d);
      box-shadow: 0 0 10px #ff68be;
    }

    .board-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid #ffffff33;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 0%, #ffffff20, transparent 50%),
        linear-gradient(145deg, #5b3590cc, #241749ee);
      box-shadow:
        inset 0 1px 2px #ffffff50,
        inset 0 -15px 30px #08001c55,
        0 20px 55px #0008;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      touch-action: none;
      user-select: none;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .hint {
      color: #cfc4ed;
      font-size: 13px;
    }

    button {
      flex-shrink: 0;
      padding: 11px 18px;
      border: 0;
      border-radius: 14px;
      color: #34123c;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(180deg, #fff58a, #ffbb35);
      box-shadow:
        inset 0 2px 1px #fff,
        0 5px 0 #c56b1e,
        0 10px 20px #0005;
      transition: transform 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(3px);
      box-shadow:
        inset 0 2px 1px #fff,
        0 2px 0 #c56b1e;
    }

    .toast {
      position: absolute;
      z-index: 4;
      top: 43%;
      left: 50%;
      opacity: 0;
      pointer-events: none;
      color: #fff27a;
      font-size: clamp(25px, 7vw, 52px);
      font-weight: 1000;
      white-space: nowrap;
      text-shadow:
        0 4px 0 #d43185,
        0 8px 18px #000a;
      transform: translate(-50%, -50%) scale(0.3);
    }

    .toast.show {
      animation: toast 0.9s ease-out;
    }

    @keyframes toast {
      0% {
        opacity: 0;
        transform: translate(-50%, -30%) scale(0.3) rotate(-7deg);
      }
      30% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2) rotate(3deg);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, -58%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -90%) scale(0.9);
      }
    }

    .modal {
      position: absolute;
      z-index: 8;
      inset: 0;
      display: none;
      place-items: center;
      padding: 25px;
      background: #110826bb;
      backdrop-filter: blur(8px);
    }

    .modal.show {
      display: grid;
    }

    .modal-card {
      width: min(90%, 390px);
      padding: 30px;
      text-align: center;
      border: 1px solid #ffffff44;
      border-radius: 28px;
      background: linear-gradient(145deg, #673b9f, #2d185a);
      box-shadow: 0 25px 70px #000a;
      animation: modalIn 0.35s ease-out;
    }

    .modal-card h2 {
      margin: 0 0 10px;
      color: #ffe667;
      font-size: 38px;
    }

    .modal-card p {
      margin: 0 0 24px;
      color: #eee8ff;
      line-height: 1.5;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.7) translateY(30px);
      }
    }

    @media (max-width: 500px) {
      .game {
        padding: 10px;
      }

      .board-wrap {
        border-radius: 20px;
      }

      .hint {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <h1 class="title">Sugar <span>Spark</span></h1>

    <section class="hud">
      <div class="stat">
        <small>Score</small>
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        <small>Moves</small>
        <strong id="moves">24</strong>
      </div>

      <div class="stat">
        <small>Goal</small>
        <strong id="target">3500</strong>
        <div class="progress">
          <div id="progressBar"></div>
        </div>
      </div>
    </section>

    <div class="board-wrap">
      <canvas id="board" aria-label="Sugar Spark match three game"></canvas>
      <div class="toast" id="toast">Sweet!</div>

      <div class="modal" id="modal">
        <div class="modal-card">
          <h2 id="modalTitle">You Win!</h2>
          <p id="modalText"></p>
          <button id="playAgain">Play Again</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="hint">Drag or tap two neighboring candies to swap them.</div>
      <button id="restart">New Game</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const movesElement = document.getElementById("moves");
    const targetElement = document.getElementById("target");
    const progressBar = document.getElementById("progressBar");
    const toast = document.getElementById("toast");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalText = document.getElementById("modalText");

    const WIDTH = 720;
    const HEIGHT = 720;
    const ROWS = 8;
    const COLS = 8;
    const CELL = 84;
    const OFFSET = 24;
    const TYPES = 6;
    const TARGET_SCORE = 3500;
    const STARTING_MOVES = 24;

    const candyColors = [
      ["#ff9bcf", "#e81d7a"], // Pink
      ["#82e9ff", "#078ac7"], // Blue
      ["#ffe978", "#f3a900"], // Yellow
      ["#aeff8a", "#38a93c"], // Green
      ["#c9a2ff", "#7131c3"], // Purple
      ["#ff9a72", "#df3e29"]  // Orange
    ];

    let board = [];
    let particles = [];
    let tweens = [];
    let selected = null;
    let pointerStart = null;

    let score = 0;
    let moves = STARTING_MOVES;
    let busy = false;
    let gameEnded = false;
    let gameSession = 0;
    let audioContext = null;
    let lastFrame = performance.now();

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = WIDTH * ratio;
      canvas.height = HEIGHT * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function randomType() {
      return Math.floor(Math.random() * TYPES);
    }

    function cellX(column) {
      return OFFSET + column * CELL + CELL / 2;
    }

    function cellY(row) {
      return OFFSET + row * CELL + CELL / 2;
    }

    function createCandy(type, row, column, startY = cellY(row)) {
      return {
        type,
        row,
        column,
        x: cellX(column),
        y: startY,
        scale: 1,
        alpha: 1,
        rotation: 0
      };
    }

    function updateHUD() {
      scoreElement.textContent = score.toLocaleString();
      movesElement.textContent = moves;
      targetElement.textContent = TARGET_SCORE.toLocaleString();

      progressBar.style.width =
        `${Math.min(100, (score / TARGET_SCORE) * 100)}%`;
    }

    function buildBoard() {
      let attempts = 0;

      do {
        board = Array.from({ length: ROWS }, () =>
          Array(COLS).fill(null)
        );

        for (let row = 0; row < ROWS; row++) {
          for (let column = 0; column < COLS; column++) {
            let type;

            do {
              type = randomType();
            } while (
              (
                column >= 2 &&
                board[row][column - 1].type === type &&
                board[row][column - 2].type === type
              ) ||
              (
                row >= 2 &&
                board[row - 1][column].type === type &&
                board[row - 2][column].type === type
              )
            );

            board[row][column] = createCandy(type, row, column);
          }
        }

        attempts++;
      } while (!hasPossibleMove() && attempts < 100);
    }

    function findMatches() {
      const matches = new Set();

      // Horizontal matches
      for (let row = 0; row < ROWS; row++) {
        let start = 0;

        for (let column = 1; column <= COLS; column++) {
          const same =
            column < COLS &&
            board[row][column] &&
            board[row][start] &&
            board[row][column].type === board[row][start].type;

          if (!same) {
            if (column - start >= 3) {
              for (let index = start; index < column; index++) {
                matches.add(`${row},${index}`);
              }
            }
            start = column;
          }
        }
      }

      // Vertical matches
      for (let column = 0; column < COLS; column++) {
        let start = 0;

        for (let row = 1; row <= ROWS; row++) {
          const same =
            row < ROWS &&
            board[row][column] &&
            board[start][column] &&
            board[row][column].type === board[start][column].type;

          if (!same) {
            if (row - start >= 3) {
              for (let index = start; index < row; index++) {
                matches.add(`${index},${column}`);
              }
            }
            start = row;
          }
        }
      }

      return matches;
    }

    function hasPossibleMove() {
      for (let row = 0; row < ROWS; row++) {
        for (let column = 0; column < COLS; column++) {
          const directions = [
            [0, 1],
            [1, 0]
          ];

          for (const [dr, dc] of directions) {
            const nextRow = row + dr;
            const nextColumn = column + dc;

            if (nextRow >= ROWS || nextColumn >= COLS) continue;

            const first = board[row][column];
            const second = board[nextRow][nextColumn];

            [first.type, second.type] = [second.type, first.type];
            const createsMatch = findMatches().size > 0;
            [first.type, second.type] = [second.type, first.type];

            if (createsMatch) return true;
          }
        }
      }

      return false;
    }

    function easeOutBack(value) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(value - 1, 3) +
        c1 * Math.pow(value - 1, 2);
    }

    function easeInOut(value) {
      return value < 0.5
        ? 2 * value * value
        : 1 - Math.pow(-2 * value + 2, 2) / 2;
    }

    function tween(object, properties, duration = 250, easing = easeInOut) {
      const startValues = {};

      for (const property in properties) {
        startValues[property] = object[property];
      }

      return new Promise(resolve => {
        tweens.push({
          object,
          properties,
          startValues,
          duration,
          easing,
          startTime: performance.now(),
          resolve
        });
      });
    }

    function updateTweens(time) {
      for (let index = tweens.length - 1; index >= 0; index--) {
        const item = tweens[index];
        const progress = Math.min(
          1,
          (time - item.startTime) / item.duration
        );
        const eased = item.easing(progress);

        for (const property in item.properties) {
          const start = item.startValues[property];
          const end = item.properties[property];
          item.object[property] = start + (end - start) * eased;
        }

        if (progress >= 1) {
          tweens.splice(index, 1);
          item.resolve();
        }
      }
    }

    function swapBoardCells(first, second) {
      const firstCandy = board[first.row][first.column];
      const secondCandy = board[second.row][second.column];

      board[first.row][first.column] = secondCandy;
      board[second.row][second.column] = firstCandy;

      firstCandy.row = second.row;
      firstCandy.column = second.column;

      secondCandy.row = first.row;
      secondCandy.column = first.column;

      return [firstCandy, secondCandy];
    }

    async function animateSwap(first, second) {
      const [firstCandy, secondCandy] = swapBoardCells(first, second);

      await Promise.all([
        tween(firstCandy, {
          x: cellX(firstCandy.column),
          y: cellY(firstCandy.row)
        }, 240, easeInOut),

        tween(secondCandy, {
          x: cellX(secondCandy.column),
          y: cellY(secondCandy.row)
        }, 240, easeInOut)
      ]);
    }

    async function handleSwap(first, second) {
      if (busy || gameEnded) return;

      const session = gameSession;
      busy = true;
      selected = null;

      playTone(320, 0.05, "sine", 0.035);
      await animateSwap(first, second);

      if (session !== gameSession) return;

      let matches = findMatches();

      if (matches.size === 0) {
        playTone(130, 0.12, "triangle", 0.05);
        await animateSwap(first, second);

        if (session === gameSession) {
          busy = false;
        }
        return;
      }

      moves--;
      updateHUD();

      let multiplier = 1;

      while (matches.size > 0) {
        if (multiplier > 1) {
          showToast(
            multiplier >= 4
              ? `Amazing x${multiplier}!`
              : `Combo x${multiplier}!`
          );
        }

        await removeMatches(matches, multiplier);
        if (session !== gameSession) return;

        await collapseBoard();
        if (session !== gameSession) return;

        matches = findMatches();
        multiplier++;
      }

      if (!hasPossibleMove()) {
        showToast("Shuffle!");
        await reshuffle();
      }

      if (score >= TARGET_SCORE) {
        finishGame(true);
      } else if (moves <= 0) {
        finishGame(false);
      } else {
        busy = false;
      }
    }

    async function removeMatches(matches, multiplier) {
      const animations = [];
      const matchedCandies = [];

      for (const key of matches) {
        const [row, column] = key.split(",").map(Number);
        const candy = board[row][column];

        if (candy) {
          matchedCandies.push({ candy, row, column });
          createBurst(candy.x, candy.y, candyColors[candy.type][0]);
        }
      }

      score += matchedCandies.length * 60 * multiplier;
      updateHUD();

      playTone(
        430 + multiplier * 90,
        0.1,
        "sine",
        0.045
      );

      navigator.vibrate?.(15);

      for (const item of matchedCandies) {
        animations.push(
          tween(item.candy, {
            scale: 0.05,
            alpha: 0,
            rotation: item.candy.rotation + Math.random() * 1.5 - 0.75
          }, 260, value => value * value)
        );
      }

      await Promise.all(animations);

      for (const item of matchedCandies) {
        board[item.row][item.column] = null;
      }
    }

    async function collapseBoard() {
      const animations = [];

      for (let column = 0; column < COLS; column++) {
        let writeRow = ROWS - 1;

        for (let row = ROWS - 1; row >= 0; row--) {
          const candy = board[row][column];

          if (!candy) continue;

          if (writeRow !== row) {
            board[writeRow][column] = candy;
            board[row][column] = null;

            candy.row = writeRow;
            candy.column = column;

            const distance = Math.abs(cellY(writeRow) - candy.y);

            animations.push(
              tween(candy, {
                x: cellX(column),
                y: cellY(writeRow)
              }, 220 + distance * 0.22, easeOutBack)
            );
          }

          writeRow--;
        }

        let spawnIndex = 0;

        for (let row = writeRow; row >= 0; row--) {
          const startY = OFFSET - CELL / 2 - spawnIndex * CELL;
          const candy = createCandy(
            randomType(),
            row,
            column,
            startY
          );

          candy.scale = 0.85;
          board[row][column] = candy;
          spawnIndex++;

          const distance = Math.abs(cellY(row) - startY);

          animations.push(
            tween(candy, {
              y: cellY(row),
              scale: 1
            }, 300 + distance * 0.18, easeOutBack)
          );
        }
      }

      await Promise.all(animations);
    }

    async function reshuffle() {
      const animations = [];

      for (const row of board) {
        for (const candy of row) {
          animations.push(
            tween(candy, {
              scale: 0.2,
              rotation: candy.rotation + Math.PI
            }, 180, easeInOut)
          );
        }
      }

      await Promise.all(animations);

      let attempts = 0;

      do {
        for (let row = 0; row < ROWS; row++) {
          for (let column = 0; column < COLS; column++) {
            board[row][column].type = randomType();
          }
        }
        attempts++;
      } while (
        (findMatches().size > 0 || !hasPossibleMove()) &&
        attempts < 200
      );

      await Promise.all(
        board.flat().map(candy =>
          tween(candy, {
            scale: 1,
            rotation: 0
          }, 260, easeOutBack)
        )
      );
    }

    function createBurst(x, y, color) {
      for (let index = 0; index < 14; index++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 80 + Math.random() * 220;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 40,
          size: 3 + Math.random() * 7,
          life: 0.55 + Math.random() * 0.35,
          maxLife: 0.9,
          color,
          gravity: 420
        });
      }
    }

    function createConfetti() {
      const colors = [
        "#ff5ca8",
        "#ffe15c",
        "#5ae5ff",
        "#8dff75",
        "#bd83ff"
      ];

      for (let index = 0; index < 180; index++) {
        particles.push({
          x: Math.random() * WIDTH,
          y: -Math.random() * 250,
          vx: -80 + Math.random() * 160,
          vy: 80 + Math.random() * 220,
          size: 4 + Math.random() * 8,
          life: 2 + Math.random() * 2,
          maxLife: 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: 80
        });
      }
    }

    function updateParticles(delta) {
      for (let index = particles.length - 1; index >= 0; index--) {
        const particle = particles[index];

        particle.life -= delta;
        particle.vy += particle.gravity * delta;
        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;
        particle.vx *= 0.99;

        if (particle.life <= 0) {
          particles.splice(index, 1);
        }
      }
    }

    function candyPath(type, size) {
      const path = new Path2D();
      const radius = size * 0.5;

      switch (type) {
        case 0:
          path.arc(0, 0, radius, 0, Math.PI * 2);
          break;

        case 1: {
          const width = size * 0.9;
          const height = size * 0.78;
          const corner = size * 0.2;

          path.moveTo(-width / 2 + corner, -height / 2);
          path.lineTo(width / 2 - corner, -height / 2);
          path.quadraticCurveTo(
            width / 2,
            -height / 2,
            width / 2,
            -height / 2 + corner
          );
          path.lineTo(width / 2, height / 2 - corner);
          path.quadraticCurveTo(
            width / 2,
            height / 2,
            width / 2 - corner,
            height / 2
          );
          path.lineTo(-width / 2 + corner, height / 2);
          path.quadraticCurveTo(
            -width / 2,
            height / 2,
            -width / 2,
            height / 2 - corner
          );
          path.lineTo(-width / 2, -height / 2 + corner);
          path.quadraticCurveTo(
            -width / 2,
            -height / 2,
            -width / 2 + corner,
            -height / 2
          );
          break;
        }

        case 2:
          path.moveTo(0, -radius);
          path.lineTo(radius * 0.85, 0);
          path.lineTo(0, radius);
          path.lineTo(-radius * 0.85, 0);
          path.closePath();
          break;

        case 3:
          path.ellipse(
            0, 0,
            radius,
            radius * 0.68,
            -0.55,
            0,
            Math.PI * 2
          );
          break;

        case 4:
          for (let index = 0; index < 6; index++) {
            const angle = Math.PI / 3 * index - Math.PI / 2;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            if (index === 0) path.moveTo(x, y);
            else path.lineTo(x, y);
          }
          path.closePath();
          break;

        case 5:
          path.moveTo(0, radius * 0.9);
          path.bezierCurveTo(
            -radius * 1.15,
            radius * 0.2,
            -radius * 0.95,
            -radius * 0.65,
            -radius * 0.4,
            -radius * 0.55
          );
          path.bezierCurveTo(
            -radius * 0.05,
            -radius * 0.55,
            0,
            -radius * 0.2,
            0,
            -radius * 0.05
          );
          path.bezierCurveTo(
            0,
            -radius * 0.2,
            radius * 0.05,
            -radius * 0.55,
            radius * 0.4,
            -radius * 0.55
          );
          path.bezierCurveTo(
            radius * 0.95,
            -radius * 0.65,
            radius * 1.15,
            radius * 0.2,
            0,
            radius * 0.9
          );
          path.closePath();
          break;
      }

      return path;
    }

    function drawCandy(candy) {
      const size = CELL * 0.68;
      const colors = candyColors[candy.type];

      ctx.save();
      ctx.globalAlpha = candy.alpha;
      ctx.translate(candy.x, candy.y);
      ctx.rotate(candy.rotation);
      ctx.scale(candy.scale, candy.scale);

      const path = candyPath(candy.type, size);

      ctx.shadowColor = "#0009";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 8;
      ctx.fillStyle = colors[1];
      ctx.fill(path);

      ctx.shadowColor = "transparent";
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      const gradient = ctx.createRadialGradient(
        -size * 0.22,
        -size * 0.28,
        size * 0.05,
        0,
        0,
        size * 0.62
      );

      gradient.addColorStop(0, "#ffffff");
      gradient.addColorStop(0.18, colors[0]);
      gradient.addColorStop(0.72, colors[1]);
      gradient.addColorStop(1, "#401343");

      ctx.fillStyle = gradient;
      ctx.fill(path);

      ctx.save();
      ctx.clip(path);
      ctx.globalAlpha = 0.13;
      ctx.rotate(-0.55);
      ctx.fillStyle = "#ffffff";

      for (let x = -size; x < size; x += 18) {
        ctx.fillRect(x, -size, 7, size * 2);
      }

      ctx.restore();

      ctx.strokeStyle = "#ffffff55";
      ctx.lineWidth = 2;
      ctx.stroke(path);

      ctx.beginPath();
      ctx.ellipse(
        -size * 0.18,
        -size * 0.23,
        size * 0.16,
        size * 0.08,
        -0.45,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = "#ffffffaa";
      ctx.fill();

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Board slots
      for (let row = 0; row < ROWS; row++) {
        for (let column = 0; column < COLS; column++) {
          const x = OFFSET + column * CELL + 5;
          const y = OFFSET + row * CELL + 5;

          ctx.beginPath();
          ctx.roundRect(x, y, CELL - 10, CELL - 10, 18);
          ctx.fillStyle =
            (row + column) % 2 === 0
              ? "#ffffff0c"
              : "#0000000c";
          ctx.fill();
        }
      }

      if (selected) {
        const x = OFFSET + selected.column * CELL + 4;
        const y = OFFSET + selected.row * CELL + 4;

        ctx.save();
        ctx.shadowColor = "#fff77a";
        ctx.shadowBlur = 18;
        ctx.strokeStyle = "#fff680";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.roundRect(x, y, CELL - 8, CELL - 8, 20);
        ctx.stroke();
        ctx.restore();
      }

      for (const row of board) {
        for (const candy of row) {
          if (candy) drawCandy(candy);
        }
      }

      for (const particle of particles) {
        ctx.save();
        ctx.globalAlpha = Math.min(
          1,
          particle.life / Math.max(0.2, particle.maxLife)
        );
        ctx.fillStyle = particle.color;
        ctx.shadowColor = particle.color;
        ctx.shadowBlur = 8;

        ctx.beginPath();
        ctx.arc(
          particle.x,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );
        ctx.fill();
        ctx.restore();
      }
    }

    function animationLoop(time) {
      const delta = Math.min(0.033, (time - lastFrame) / 1000);
      lastFrame = time;

      updateTweens(time);
      updateParticles(delta);
      render();

      requestAnimationFrame(animationLoop);
    }

    function canvasPosition(event) {
      const rectangle = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - rectangle.left) * WIDTH / rectangle.width,
        y: (event.clientY - rectangle.top) * HEIGHT / rectangle.height
      };
    }

    function positionToCell(position) {
      const column = Math.floor((position.x - OFFSET) / CELL);
      const row = Math.floor((position.y - OFFSET) / CELL);

      if (
        row < 0 ||
        row >= ROWS ||
        column < 0 ||
        column >= COLS
      ) {
        return null;
      }

      return { row, column };
    }

    canvas.addEventListener("pointerdown", event => {
      event.preventDefault();

      if (busy || gameEnded) return;

      unlockAudio();
      canvas.setPointerCapture?.(event.pointerId);

      pointerStart = {
        position: canvasPosition(event),
        cell: positionToCell(canvasPosition(event))
      };
    });

    canvas.addEventListener("pointerup", event => {
      event.preventDefault();

      if (busy || gameEnded || !pointerStart?.cell) {
        pointerStart = null;
        return;
      }

      const endPosition = canvasPosition(event);
      const startCell = pointerStart.cell;
      const dx = endPosition.x - pointerStart.position.x;
      const dy = endPosition.y - pointerStart.position.y;

      let targetCell = positionToCell(endPosition);

      if (Math.hypot(dx, dy) > 24) {
        let row = startCell.row;
        let column = startCell.column;

        if (Math.abs(dx) > Math.abs(dy)) {
          column += dx > 0 ? 1 : -1;
        } else {
          row += dy > 0 ? 1 : -1;
        }

        targetCell = { row, column };
        selected = null;

        if (
          row >= 0 &&
          row < ROWS &&
          column >= 0 &&
          column < COLS
        ) {
          handleSwap(startCell, targetCell);
        }
      } else if (targetCell) {
        if (!selected) {
          selected = targetCell;
          playTone(520, 0.035, "sine", 0.02);
        } else {
          const distance =
            Math.abs(selected.row - targetCell.row) +
            Math.abs(selected.column - targetCell.column);

          if (
            selected.row === targetCell.row &&
            selected.column === targetCell.column
          ) {
            selected = null;
          } else if (distance === 1) {
            handleSwap(selected, targetCell);
          } else {
            selected = targetCell;
          }
        }
      }

      pointerStart = null;
    });

    canvas.addEventListener("pointercancel", () => {
      pointerStart = null;
    });

    function unlockAudio() {
      if (!audioContext) {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (AudioContextClass) {
          audioContext = new AudioContextClass();
        }
      }

      if (audioContext?.state === "suspended") {
        audioContext.resume();
      }
    }

    function playTone(
      frequency,
      duration,
      wave = "sine",
      volume = 0.04
    ) {
      if (!audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;

      oscillator.type = wave;
      oscillator.frequency.setValueAtTime(frequency, now);
      oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(40, frequency * 1.25),
        now + duration
      );

      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now);
      oscillator.stop(now + duration);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.remove("show");
      void toast.offsetWidth;
      toast.classList.add("show");
    }

    function finishGame(won) {
      gameEnded = true;
      busy = true;

      if (won) {
        createConfetti();
        showToast("Goal Reached!");
        playTone(740, 0.35, "sine", 0.07);
      } else {
        playTone(120, 0.4, "triangle", 0.06);
      }

      setTimeout(() => {
        modalTitle.textContent = won ? "You Win!" : "Out of Moves";
        modalText.innerHTML = won
          ? `You reached <strong>${score.toLocaleString()}</strong> points with ${moves} moves remaining.`
          : `Your score was <strong>${score.toLocaleString()}</strong>. Reach ${TARGET_SCORE.toLocaleString()} points to win.`;

        modal.classList.add("show");
      }, won ? 650 : 250);
    }

    function newGame() {
      gameSession++;
      tweens = [];
      particles = [];
      selected = null;
      pointerStart = null;
      score = 0;
      moves = STARTING_MOVES;
      busy = false;
      gameEnded = false;

      modal.classList.remove("show");
      buildBoard();
      updateHUD();
    }

    document.getElementById("restart").addEventListener("click", () => {
      unlockAudio();
      newGame();
    });

    document.getElementById("playAgain").addEventListener("click", () => {
      unlockAudio();
      newGame();
    });

    newGame();
    requestAnimationFrame(animationLoop);
  </script>
</body>
</html>
